# Active (attached) UE + ISAC sensing, X410, band n78, 20 MHz / 51 PRB, SCS 30 kHz.
#
# Cell (from gnb_remote_logs/du.yaml): band 78, PCI 2, PLMN 00106, TDD 7DL/2UL, common_scs 30.
# Matches the DU config as of gnb_remote_logs (channel_bandwidth_MHz: 20, carrierBandwidth: 51,
# absoluteFrequencyPointA: 627054, dl_arfcn/SSB: 627666 -> 3414.99 MHz).
#
# X410 note (learned on this machine, see ue_x410_n78_siso.conf's comments): the flashed X4_200
# FPGA image accepts ONLY master_clock_rate=245.76e6. At 51 PRB the PHY wants 23.04 Msps, which
# does NOT divide 245.76 cleanly -- srsUE solved this by forcing LTE-style symbol sizing (FFT=1024)
# so the rate became 30.72 Msps (245.76/30.72 = 8 exactly). If OAI lands on 23.04 Msps here and
# UHD reports a non-integer decimation / the cell never locks, that is the same trap.

uicc0 = {
  imsi = "001060123456748";
  key = "5122250214c33e723a5dd523fc145fc0";
  opc= "981d464c7c52eb6e5036234984ad0bcf";
  pdu_sessions = ({ dnn = "internet"; nssai_sst = 1; nssai_sd = 0x000000; });
}

position0 = {
    x = 0.0;
    y = 0.0;
    z = 6377900.0;
}

thread-pool = "-1,-1,-1,-1";

sensing = {
  enable      = 1;

  # This UE is ATTACHED and generating its own traffic, so its own scheduled PDSCH is the
  # densest reference available: pdsch_data is the true data-aided (TB re-encode) path,
  # Hh = Y/X measured at EVERY non-DMRS data RE (comb-1), not interpolated. csi_rs is fused in
  # to keep coverage in slots where PDSCH doesn't decode or isn't scheduled.
  sources     = "pdsch_data,csi_rs";

  cpi_slots   = 256;
  interpolate = 1;
  capture     = 1;          # dump the RVM raster too -- needed for single-receiver validation,
                            # since isac-track emits 0 tracks with one Tx-Rx pair BY DESIGN

  # Detection. Defaults from the module README; cfar_pfa slightly tighter than 1e-3 because an
  # indoor office is a rich multipath environment and the false-alarm floor will be high.
  cfar_guard         = 4;
  cfar_train         = 8;
  cfar_pfa           = 1e-4;
  zero_doppler_guard = 3;
  zero_range_guard   = 2;
  nms_range_bins     = 3;
  nms_doppler_bins   = 3;
  max_detections     = 32;

  # UNVERIFIED FOR THIS SETUP -- the 98.0 default is the B210 cell's diagnosed fixed group-delay
  # artifact and is testbed-specific (see defs_nr_UE_ISAC.h's comment on nominal_los_range_m).
  # This X410 + LiteOn path has NOT been characterised. Check the first run's _detections.csv /
  # RVM for where the strong static direct-path return actually lands and set this to that range;
  # a wrong value mis-seeds the Phase 1/3 LOS search and Phase 4's baseline matcher.
  nominal_los_range_m = 98.0;

  # Phase 1-4 STO/CFO/SFO/closed-loop sync corrections. ON by default and correct for this
  # deployment: UE and gNB are independent free-running clocks (no shared reference).
  sync_correction = 1;

  # Clutter: start with plain mean subtraction. ECA+ is available but its doppler band must be
  # tuned against this CPI's actual vel_res or it will eat slow targets (a walking person is
  # ~1 m/s) -- do that only after a first run reports vel_res_mps.
  clutter_removal = "mean";

  out_path       = "/tmp/oaiue_sensing_20mhz";

  # Single receiver, single illuminator. Positions are placeholders: survey and set them before
  # any multi-static/world-frame work -- they are meaningless for single-rx range/Doppler only.
  rx_id          = "rx1";
  illuminator_id = "gnb1";
  rx_pos_x       = 0.0;  rx_pos_y = 0.0;
  tx_pos_x       = 0.0;  tx_pos_y = 0.0;
};
