[ue]
phy = nr

[rf]
# X410 has a much more accurate reference than the B210 TCXO, so start with no static
# offset; the bulk-CFO UL pre-comp + SRSUE_ULFO_DBG will reveal the actual residual.
freq_offset = -17000
device_name = uhd
# Select the networked X410 (serial 327B872). DHCP-assigned address, confirm at session start
# with `uhd_find_devices` before assuming it hasn't changed (it moved after the 2026-07-18 firmware update).
# Explicit master_clock_rate required: srsUE's rf_uhd_imp.cc auto-injects a default MCR whenever
# device_args has "type" set and no explicit rate, but its fallback list only covers x300/n3xx/e3x0
# - x4xx isn't handled, so it silently fell through to the B200 default (23.04e6), which the flashed
# X4_200 FPGA image (200 MHz BW variant) rejects outright. 245.76e6 is MPM's own native/only-accepted
# rate for this image (184.32e6, an integer multiple of 23.04e6, was also rejected - this FPGA image
# genuinely only supports its one native rate).
device_args = type=x4xx,addr=192.168.10.2,master_clock_rate=245.76e6
time_adv_nsamples = 27
# 245.76e6 doesn't divide cleanly into the default 51-PRB rate (23.04e6, FFT=768 - ratio 10.667,
# UHD landed on 22.342 MHz actual, cell search never locked). Switching to standard-LTE symbol
# sizing (expert.lte_sample_rates below) makes 51 PRB select FFT=1024 -> required rate 30.72e6,
# and 245.76/30.72 = exactly 8 (clean, even decimation, matches the halfband-filter-friendly warning
# from the earlier attempt). srate here must match that new PHY-required rate.
srate = 30.72e6
continuous_tx = no
tx_gain = 60
rx_gain = 40
# SISO for now (gNB is 4x4, UE single-antenna this session)
nof_antennas = 1

[expert]
# Selects the standard-LTE FFT-size table (see [rf] srate comment above): for 51 PRB this picks
# FFT=1024 (rate 30.72e6) instead of srsRAN's default minimal FFT=768 (rate 23.04e6), because
# 30.72e6 is the value that divides cleanly into this X410's native 245.76e6 clock.
lte_sample_rates = true

[rat.eutra]
nof_carriers = 0
dl_earfcn = 3350

[rat.nr]
bands = 78
nof_carriers = 1
max_nof_prb = 51
# Live DU values (2026-07-18): dl_arfcn=627666, dl_ssb_arfcn=627360
dl_nr_arfcn = 627666
ssb_nr_arfcn = 627360
nof_prb = 51
scs = 30
ssb_scs = 30

[pcap]
#enable = mac_nr,nas
mac_nr_filename = /tmp/ue_mac_nr_x410.pcap
nas_filename = /tmp/ue_nas_x410.pcap

[log]
phy_lib_level = warning
all_level = info
filename = /tmp/ue_x410_siso.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc = 981d464c7c52eb6e5036234984ad0bcf
k = 5122250214c33e723a5dd523fc145fc0
imsi = 001060123456748
imei = 353490069873319

[nas]
apn = internet
apn_protocol = ipv4
force_imsi_attach = true

[gw]
netns = ue1
ip_devname = tun_ue1
ip_netmask = 255.255.255.0

[gui]
enable = false
