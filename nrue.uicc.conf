# ISAC / passive-radar sensing pipeline (openair1/PHY/NR_UE_ISAC).
# Full field reference: openairinterface5g/openair1/PHY/NR_UE_ISAC/README.md
# Test-sequence defaults per runbook.md (source=csi_rs is UE-agnostic and works
# regardless of which UE the gNB is scheduling traffic to; see runbook.md sec 1).
sensing = {
  enable          = 1;
  #source          = "pdsch_dmrs"; # csi_rs | pdsch_dmrs | pdsch_data -- see runbook.md sec 1
  # CFR-level fusion (opt-in): set `sources` to a comma list to feed SEVERAL references into one
  # per-subcarrier grid before the range-Doppler transform; it overrides `source` when non-empty.
  # Fused reports carry ref_type = "fused(csi_rs+pdsch_dmrs)". Leave commented for legacy single-source.
  sources       = "csi_rs,pdsch_dmrs";

  # UE-agnostic CSI-RS collection (other UEs' / cell-common CSI-RS). The receiver's own CSI-RS is
  # driven by its RRC CSI-MeasConfig; `csirs_monitor` additionally captures CSI-RS resources known
  # from the CELL config (gnb_remote_logs/) for sensing, independent of what our own MAC schedules,
  # feeding Ĥ into the ISAC engine with NO CSI report to the gNB. Comma-separated resources, each:
  #   row:start_rb:nr_rbs:freq_domain:symb_l0:symb_l1:cdm_type:freq_density:scramb_id:period:offset
  # (period/offset in SLOTS; occurs when abs_slot % period == offset). NZP CSI-RS only.
  #
  # VERIFIED 2026-07-21 against a fresh debug-level DU restart (gnb_remote_logs/gnb.log, DU boot
  # 07:48:27) + cross-checked against the RRC container in cuLogs/cu.log. Three cell-level NZP
  # resources found, all printed at DU startup before any UE attach (i.e. cell defaults, not tied
  # to another UE's RRC state):
  #   - row=1, symb_l0=4 and symb_l0=8 (a TRS pair, same slot): offset derived from the
  #     "DL_TTI.request slot=782.2" line immediately preceding the dump -> (782*20+2)%20 = 2;
  #     confirmed periodic at slots 782.2 -> 784.2 -> 786.2 (every 20 slots).
  #   - row=4 (regular CQI/RI/PMI-type CSI-RS, fd-CDM2, density=one): preceded by
  #     "DL_TTI.request slot=782.4" -> (782*20+4)%20 = 4.
  #   - scramb_id=2 for all three: the gnb.log dump's own "scramb_id=[0..51)" field is a log-
  #     formatter bug (identical bogus range on every resource, incl. the zero-power one) -- do
  #     NOT trust it. Cross-checked instead against cuLogs/cu.log's RRC container, which has
  #     "scramblingID": 2, matching PCI=2 and the PDSCH DM-RS scrambling (nid_pdsch=2) nearby.
  #   - nr_rbs=51 (not the dump's "crbs=[0..52)"): the OFH transport layer packing the SAME slot
  #     logs "PRB range '0:51'" / "Packing '51' PRBs", and 51 is the only value consistent with
  #     channel_bandwidth_MHz=20 @ common_scs=30 per the standard 3GPP bandwidth table (a hard
  #     physical constraint). Treating crbs=[0..52) as the same off-by-one artifact as scramb_id.
  #   - cdm_type: no_CDM=0, fd_CDM2=1. freq_density: dot5-even=0, dot5-odd=1, one=2, three=3.
  # RE-VERIFY if the DU cell_cfg (band/bandwidth/SCS/PCI) or RRC config changes.
  csirs_monitor = "1:0:51:4:4:2:0:3:2:20:2, 1:0:51:4:8:2:0:3:2:20:2, 4:0:51:4:4:2:1:2:2:20:4";
  cpi_slots       = 256;
  interpolate     = 1;
  capture         = 1;            # keep RVM rasters + rvm_blob for validation (runbook.md sec 8)

  # Self-test (runbook.md sec 6.1): flip these on for the software-only smoke test
  # BEFORE any live capture, then set selftest back to 0.
  # NOTE: values must fit inside THIS cell's unambiguous range (see the CPI log line's
  # "range[max=...]m" -- with source=csi_rs comb=12 on a 51-PRB carrier that's ~416 m).
  # 1.0us -> 150m (bin 18), 2.0us -> 300m (bin 37); both comfortably inside 416m.
  selftest         = 0;
  #selftest_targets = "1.0:20:0.6,2.0:-15:0.4";           # DELAY_US:DOPPLER_HZ:GAIN, range=c*delay/2

  cfar_guard         = 4;
  cfar_train         = 8;
  cfar_pfa           = 1e-4;
  zero_doppler_guard = 3;
  # WIDENED 1 -> 4 (2026-07-20 pm): after the CFR-fusion full-per-subcarrier grid change,
  # range_max grew to c/(2*SCS) ~= 5000m (was ~416m under the old comb-12-compressed grid).
  # zero_range_guard notches zrg bins at BOTH ends (bins 0..zrg AND N-1-zrg..N-1), so a wider
  # value now suppresses (a) the near-zero direct-path/LOS at the bottom and (b) the top-of-
  # axis rows where the direct path wraps around the circular range IFFT (negative delay) and
  # CA-CFAR edge effects fire a full false-alarm row at ~5000m. zrg=4 notches ~0-33m and the
  # top 4 bins (~4963-5000m). NOTE the notch is SYMMETRIC: it cannot fully kill the far-edge
  # CFAR row (~top 30 bins) without also blinding ~245m of close range, so the primary fix for
  # the 5000m artifacts is the plotter crop (tools/sensing/plot_rvm.py --range-max 500); a
  # proper asymmetric top-notch / CFAR edge-guard belongs in range_doppler.cc (deferred).
  # Prior history: 9 was tuned for source=csi_rs (comb=12); narrowed to 1 to test pdsch_dmrs
  # from ~16m. pdsch_dmrs range_res varies CPI-to-CPI with the real DL allocation size (comb=2
  # on the receiver's OWN grant) -- check the per-CPI "range[res=...]" log, and inspect raw RVM
  # power per range bin before trusting anything close-in as a real target (LOS/CFO artifact).
  # NARROWED 4 -> 3 (2026-07-21, ota_sync_passive_ue.md Phase 0): new baseline ahead of the
  # STO/CFO/SFO sync work; Phase 7b's guard-narrowing test targets this value, not 9.
  zero_range_guard   = 3;
  nms_range_bins     = 3;
  nms_doppler_bins   = 3inv;
  max_detections     = 16;

  out_path        = "/home/sens/NICOLA/tmpSensing/oaiue_sensing";
  report_endpoint = "tcp://127.0.0.1:5556";  # live bus for isac-track; drop to file-only

  rx_id           = "rx1";
  illuminator_id  = "gnb1";
  # TODO: fill in surveyed positions (ENU metres) before the session -- bistatic
  # range/velocity only mean something once fusion knows the geometry.
  rx_pos_x        = 0.0;
  rx_pos_y        = 0.0;
  tx_pos_x        = 0.0;
  tx_pos_y        = 0.0;
};
