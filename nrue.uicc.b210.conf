# ISAC / passive-radar sensing pipeline (openair1/PHY/NR_UE_ISAC).
# Full field reference: openairinterface5g/openair1/PHY/NR_UE_ISAC/README.md
# Test-sequence defaults per runbook.md (source=csi_rs is UE-agnostic and works
# regardless of which UE the gNB is scheduling traffic to; see runbook.md sec 1).
