# 100 MHz (273 PRB, 30 kHz SCS) variant of gnb.sa.rfsim.conf, for finer sensing range resolution:
# range_res = c/(N*df) = 3.05 m/bin vs 7.86 m at 106 PRB. SA/NGAP/AMF/PLMN parts are UNCHANGED from
# gnb.sa.rfsim.conf (same real open5gs core, same subscriber). Frequency plan copied from
# tests/sensing_sim/gnb.sensing.100mhz.rfsim.conf (itself copied from the known-good
# targets/PROJECTS/GENERIC-NR-5GC/CONF/gnb.sa.band78.273prb.fhi72.4x4-foxconn.conf) rather than
# re-derived: absoluteFrequencySSB 649920 / pointA 646724 -> carrier centre 3750.00 MHz, so the UE
# must be launched with -C 3750000000 -r 273 (see run_passive_rx.sh's BW100 env var).
# physCellId kept at 0 (same as gnb.sa.rfsim.conf) so this project's existing "scramb_id=0"
# assumptions elsewhere carry over unchanged -- one less thing to re-derive at the new bandwidth.
#
# initialDL/ULBWPlocationAndBandwidth = RIV(L=273,N=275) = 1099, i.e. the initial BWP spans the FULL
# carrier (same "full-band initial BWP" semantics as gnb.sa.rfsim.conf's own 106-PRB RIV=28875).
#
# CORESET/SearchSpace geometry and dci_length for the blind-PDCCH monitor are NOT yet re-derived for
# this bandwidth -- ue.passive.100mhz.conf ships with pdcch_blind_monitor_* commented out
# (sources="csi_rs" only) until the same live-diagnostic method used for 106 PRB
# (PHASE3_BLIND_PDCCH_LIVE_WIRING_HANDOVER.md) is repeated here.
#
# SPDX-License-Identifier: LicenseRef-CSSL-1.0

Active_gNBs = ( "gnb-passiverx");
# Asn1_verbosity, choice in: none, info, annoying
Asn1_verbosity = "none";

gNBs =
(
 {
    ////////// Identification parameters:
    gNB_ID = 0xe00;

    gNB_name  =  "gnb-passiverx";

    // Tracking area code, 0x0000 and 0xfffe are reserved values
    tracking_area_code  =  1;

    plmn_list = ({ mcc = 1; mnc = 6; mnc_length = 2; snssaiList = ({ sst = 1, sd = 0x000000 }) });

    nr_cellid = 12345678L

    # Transmit CSI-RS. This is the downlink reference the PASSIVE receiver locks onto via
    # [sensing] csirs_monitor -- it is scheduled for the active UE, not for the passive one,
    # which is exactly the point of the test.
    do_CSIRS = 1;

    ////////// Physical parameters:

    min_rxtxtime = 6;

    servingCellConfigCommon = (
    {
 #spCellConfigCommon

      physCellId                                                    = 0;

#  downlinkConfigCommon
    #frequencyInfoDL
      # this is 3600 MHz + 43 PRBs@30kHz SCS (same as initial BWP) -- copied from
      # tests/sensing_sim/gnb.sensing.100mhz.rfsim.conf, carrier centre 3750.00 MHz
      absoluteFrequencySSB                                          = 649920;
      # this is 3600 MHz
      dl_absoluteFrequencyPointA                                       = 646724;
      #scs-SpecificCarrierList
        dl_offstToCarrier                                              = 0;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        dl_subcarrierSpacing                                           = 1;
        dl_carrierBandwidth                                            = 273;
     #initialDownlinkBWP
      #genericParameters
        # this is RBstart=0,L=273 (275*(L-1))+RBstart
        initialDLBWPlocationAndBandwidth                                        = 1099;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        initialDLBWPsubcarrierSpacing                                           = 1;
      #pdcch-ConfigCommon
        initialDLBWPcontrolResourceSetZero                                      = 12;
        initialDLBWPsearchSpaceZero                                             = 0;



  #uplinkConfigCommon
     #frequencyInfoUL
      ul_frequencyBand                                                 = 78;
      #scs-SpecificCarrierList
      ul_offstToCarrier                                              = 0;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
      ul_subcarrierSpacing                                           = 1;
      ul_carrierBandwidth                                            = 273;
      pMax                                                          = 20;
     #initialUplinkBWP
      #genericParameters
        initialULBWPlocationAndBandwidth                                        = 1099;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        initialULBWPsubcarrierSpacing                                           = 1;
      #rach-ConfigCommon
        #rach-ConfigGeneric
          prach_ConfigurationIndex                                  = 98;
#prach_msg1_FDM
#0 = one, 1=two, 2=four, 3=eight
          prach_msg1_FDM                                            = 0;
          prach_msg1_FrequencyStart                                 = 0;
          zeroCorrelationZoneConfig                                 = 13;
          preambleReceivedTargetPower                               = -104;
#preamblTransMax (0...10) = (3,4,5,6,7,8,10,20,50,100,200)
          preambleTransMax                                          = 6;
#powerRampingStep
# 0=dB0,1=dB2,2=dB4,3=dB6
        powerRampingStep                                            = 1;
#ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR
#1=oneeighth,2=onefourth,3=half,4=one,5=two,6=four,7=eight,8=sixteen
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                = 4;
#one (0..15) 4,8,12,16,...60,64
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB                   = 15;
#ra_ContentionResolutionTimer
#(0..7) 8,16,24,32,40,48,56,64
        ra_ContentionResolutionTimer                                = 7;
        rsrp_ThresholdSSB                                           = 19;
#prach-RootSequenceIndex_PR
#1 = 839, 2 = 139
        prach_RootSequenceIndex_PR                                  = 2;
        prach_RootSequenceIndex                                     = 1;
        # SCS for msg1, can only be 15 for 30 kHz < 6 GHz, takes precendence over the one derived from prach-ConfigIndex
        #
        msg1_SubcarrierSpacing                                      = 1,
# restrictedSetConfig
# 0=unrestricted, 1=restricted type A, 2=restricted type B
        restrictedSetConfig                                         = 0,

        msg3_DeltaPreamble                                          = 1;
        p0_NominalWithGrant                                         =-90;

# pucch-ConfigCommon setup :
# pucchGroupHopping
# 0 = neither, 1= group hopping, 2=sequence hopping
        pucchGroupHopping                                           = 0;
        hoppingId                                                   = 40;
        p0_nominal                                                  = -90;

      ssb_PositionsInBurst_Bitmap                                   = 1;

# ssb_periodicityServingCell
# 0 = ms5, 1=ms10, 2=ms20, 3=ms40, 4=ms80, 5=ms160, 6=spare2, 7=spare1
      ssb_periodicityServingCell                                    = 2;

# dmrs_TypeA_position
# 0 = pos2, 1 = pos3
      dmrs_TypeA_Position                                           = 0;

# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
      subcarrierSpacing                                             = 1;


  #tdd-UL-DL-ConfigurationCommon
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
      referenceSubcarrierSpacing                                    = 1;
      # pattern1
      # dl_UL_TransmissionPeriodicity
      # 0=ms0p5, 1=ms0p625, 2=ms1, 3=ms1p25, 4=ms2, 5=ms2p5, 6=ms5, 7=ms10
      dl_UL_TransmissionPeriodicity                                 = 6;
      nrofDownlinkSlots                                             = 7;
      nrofDownlinkSymbols                                           = 6;
      nrofUplinkSlots                                               = 2;
      nrofUplinkSymbols                                             = 4;

  ssPBCH_BlockPower                                             = -25;
  }

  );


    # ------- SCTP definitions
    SCTP :
    {
        # Number of streams to use in input/output
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    ////////// AMF parameters:
        amf_ip_address = ({ ipv4 = "127.0.0.1"; });

        NETWORK_INTERFACES :
        {

           GNB_IPV4_ADDRESS_FOR_NG_AMF              = "127.0.0.100";
           GNB_IPV4_ADDRESS_FOR_NGU                 = "127.0.0.100";
           GNB_PORT_FOR_S1U                         = 2152; # Spec 2152
        };

  }
);

MACRLCs = (
  {
    tr_s_preference  = "local_L1";
    tr_n_preference  = "local_RRC";
    pusch_TargetSNRx10 = 200;
    pucch_TargetSNRx10 = 200;
  }
);

L1s = (
{
  tr_n_preference = "local_mac";
  prach_dtx_threshold = 200;
}
);

RUs = (
    {
       local_rf       = "yes"
         nb_tx          = 1
         nb_rx          = 1
         att_tx         = 0
         att_rx         = 0;
         bands          = [78];
         max_pdschReferenceSignalPower = -27;
         max_rxgain                    = 75;
         eNB_instances  = [0];
         sf_extension = 0
         sdr_addrs = "serial=XXXXXXX"
    }
);


rfsimulator = (
  {
    serveraddr = "server";
  }
);

security = {
  ciphering_algorithms = ( "nea0" );
  integrity_algorithms = ( "nia2", "nia0" );
  drb_ciphering = "yes";
  drb_integrity = "no";
};

     log_config :
     {
       global_log_level                      ="info";
       hw_log_level                          ="info";
       phy_log_level                         ="info";
       mac_log_level                         ="info";
       rlc_log_level                         ="info";
       pdcp_log_level                        ="info";
       rrc_log_level                         ="info";
       f1ap_log_level                         ="debug";
    };
