// T26c (2026-10-08): ue.passive.ota.dldedicated.dgx.cfg with the PDSCH pool sized for ~20 live C-RNTIs. GB10 core types
// (/proc/cpuinfo CPU part): 0xd85 Cortex-X925 3.9 GHz = cores 5-9,15-19 (17-19 DPDK); 0xd87 Cortex-A725 2.8 GHz = 0-4,10-14.
// MEASURED replay: the scan consumer on little core 13 took fep_llr 1531 us/occasion vs 249 us on big core 6, so the
// scan stays on big core 6 and the 3 PDSCH consumers (inline tasks, ISAC_PDSCH_INLINE_POOL=1) take big cores 7..9.
// (base: DGX OTA conf 2026-10-07, X410 34B2AF1 over DPDK)
// CORESET autodiscovery, full_auto DL PDSCH decode (merged-main defaults of ue.passive.auto.100mhz.dgx.cfg),
// no UL, sensing API off. Used to validate blind CSI-RS discovery (ISAC_CSIRS_DISC=1) alongside DL decoding.
// Cores: DPDK owns 17,18,19 (isolated); scan consumer on core 6, PDSCH consumers 7..9 (T26c).
sensing = {
  enable = 0;
  pdcch_blind_monitor_autoconf = 1;
  pdcch_blind_monitor_autodiscover = 1;
  pdcch_blind_monitor_full_auto = 1;
  pdcch_blind_monitor_dci10 = "1";
  pdcch_blind_monitor_pdsch = "1:1:0:1:16:3:64:7";
  pdcch_blind_monitor_rnti_range = "1:65519";
  pdcch_blind_monitor_noise_gates = "0:2:500:0:3.0";
  pdcch_blind_monitor_scan_thread = "1:16:6";
  rx_id = "rx_x410_dgx";
};
