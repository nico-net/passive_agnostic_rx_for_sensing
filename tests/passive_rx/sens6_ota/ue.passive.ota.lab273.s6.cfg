// sens6 OTA conf, lab cell (sens4 OCUDU gNB) and any n78 cell: merged-main defaults (2026-10-24).
// Based on tests/passive_rx/dgx/ue.passive.ota.autocores.cfg: no pinned layout (autoconf from MIB/SIB1, autodiscover,
// full_auto DL, DCI layout by search), and NO core numbers: every affinity comes from the core plan (nr_core_layout,
// one "SENSING: CORE_PLAN" line; on sens6 isolcpus 1-2 -> RT 3, UHD ctrl 1, USRP ring 2, pool 4-9, lane 10-13, hk 0).
// Cell geometry is NOT in this file: -C/-r/--ssb (or --ue-scan-carrier) come from the launcher command line.
// The gNB config/log is validation ground truth only and is never an input here.
// New file (sens6 is frozen: tests/passive_rx/captures/* and tests/passive_rx/*.conf are never edited).
sensing = {
  enable = 0;
  pdcch_blind_monitor_autoconf = 1;
  pdcch_blind_monitor_autodiscover = 1;
  pdcch_blind_monitor_full_auto = 1;
  pdcch_blind_monitor_dci10 = "1";
  pdcch_blind_monitor_pdsch = "1:1:0:1:16:3:20";
  pdcch_blind_monitor_rnti_range = "1:65519";
  pdcch_blind_monitor_noise_gates = "0:2:500:0:3.0";
  pdcch_blind_monitor_scan_thread = "1:8";
  rx_id = "rx_x410_s6";
};
