# OCUDU (srsRAN-Project fork) gNB for the ZMQ passive-RX bed (run_ocudu_passive.sh).
# Base = repos/ocudu/configs/gnb_zmq_n78_tdd_local.yaml (local open5gs AMF 127.0.0.1), the one change
# being rx_port: the gNB's UL now comes from ocudu_zmq_broker.py (:2101), not straight from srsUE.
# 20 MHz / 51 PRB / 30 kHz / 23.04 Msps: the rate OAI reaches EXACTLY with -E (3/4 sampling, FFT 768).
# Test-matrix knobs go on the gNB command line (see ../README_OCUDU.md), not into this file.
gnb_id: 332

cu_cp:
  inactivity_timer: 7200
  amf:
    addr: 127.0.0.1
    port: 38412
    bind_addr: 127.0.0.1
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "00106"
            tai_slice_support_list:
              - sst: 1
                sd: 000000

cu_up:
  ngu:
    socket:
      - bind_addr: 127.0.0.1

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2101,base_srate=23040000
  srate: 23.04
  tx_gain: 0
  rx_gain: 0

cell_cfg:
  dl_arfcn: 627666
  band: 78
  channel_bandwidth_MHz: 20
  common_scs: 30
  plmn: "00106"
  tac: 1
  slicing:
    - sst: 1
      sd: 0
  pci: 1
  tdd_ul_dl_cfg:
    dl_ul_tx_period: 10
    nof_dl_slots: 6
    nof_dl_symbols: 8
    nof_ul_slots: 3
    nof_ul_symbols: 0
  nof_antennas_ul: 1
  nof_antennas_dl: 1
  pdsch:
    mcs_table: qam256
  pusch:
    mcs_table: qam64
  pucch:
    sr_period_ms: 10
  prach:
    prach_config_index: 159

log:
  filename: /tmp/ocudu_passive/gnb.log
  all_level: info
  broadcast_enabled: true
  hex_max_size: 1024

metrics:
  autostart_stdout_metrics: 1
