# Fully agnostic passive receiver for the OCUDU ZMQ bed (run_ocudu_passive.sh), derived from
# ../ue.passive.agn.conf. Changes vs that file, and nothing else:
#  - no rfsimulator / channelmod / sensing_channel blocks: the radio is oai_zmqdevif fed by
#    ocudu_zmq_broker.py (ideal channel, DL+UL summed), so the rfsim-only synthetic target is inert;
#  - no csirs_monitor and no csi_rs source: that string is an RRC-dedicated NZP-CSI-RS resource read
#    off a gNB config, which is exactly what this bed must NOT seed;
#  - single antenna, so no rx_array / AoA;
#  - output paths under /tmp/ocudu_passive.
# Cell-level inputs come only from the command line (-C/-r/--ssb/--band, all public/SSB-derivable).
# Every dedicated PDCCH/PDSCH/PUSCH parameter is self-discovered (autoconf/autodiscover/full_auto).

uicc0 = {
  imsi = "001060000000000";
  key  = "00000000000000000000000000000000";
  opc  = "00000000000000000000000000000000";
}

thread-pool = "-1,-1,-1,-1,-1,-1,-1,-1";

sensing = {
  enable          = 1;
  sources         = "pdsch_dmrs_blind,pdsch_data";

  pdcch_blind_monitor_autoconf      = 1;
  pdcch_blind_monitor_autodiscover  = 1;
  pdcch_blind_monitor_full_auto     = 1;
  pdcch_blind_monitor_dci10         = "1";
  pdcch_blind_monitor_rnti_range    = "1:65519";
  pdcch_blind_monitor_noise_gates   = "0:2:500:0:3.0";
  pdcch_blind_monitor_scan_thread   = "1:8:5";
  pdcch_blind_monitor_pdsch         = "2:0:0:1:16";
  pdcch_blind_monitor_dci01         = "1:0";
  pdcch_blind_monitor_ul_pusch      = "1:1:0";
  pdcch_blind_monitor_ul_uci        = "256:11:0:32";
  pdcch_blind_monitor_ul_thread     = "2:32:2";

  cpi_slots       = 32;
  interpolate     = 1;
  capture         = 1;
  sync_correction = 1;
  selftest        = 0;

  cfar_guard         = 4;
  cfar_train         = 8;
  cfar_pfa           = 1e-4;
  zero_doppler_guard = 3;
  zero_range_guard   = 3;
  nms_range_bins     = 3;
  nms_doppler_bins   = 3;
  max_detections     = 16;

  out_path    = "/tmp/ocudu_passive/px_sensing";
  report_path = "/tmp/ocudu_passive/px_reports.jsonl";

  rx_id          = "rx_ocudu_passive";
  illuminator_id = "ocudu-gnb";
  rx_pos_x = 100.0;
  rx_pos_y = 0.0;
  tx_pos_x = 0.0;
  tx_pos_y = 0.0;
};

log_config = {
  global_log_level = "info";
  global_log_options = ("nocolor", "level", "wall_clock");
  hw_log_level     = "info";
  phy_log_level    = "info";
};
