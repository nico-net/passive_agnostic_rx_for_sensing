# srsUE (active, attached) for the OCUDU ZMQ passive-RX bed: copy of repos/srs-ue/configs/ue_zmq_n78_siso.conf,
# only rx_port (-> ocudu_zmq_broker.py :2100) and the log path changed. IMSI 001060123456748 is provisioned
# in the local open5gs mongodb (clone of 001060123456743, same K/OPc).
#####################################################################
# srsUE NR-SA config — SISO ZMQ regression test against ocudu gNB
# (../../ocudu/configs/gnb_zmq_n78_tdd.yaml)
#
# Phase 2 (nr-mimo/rx-plumbing) regression gate: rf.nof_antennas=1 must
# decode SIB1 exactly as before the multi-antenna RX plumbing changes.
#####################################################################
[rf]
freq_offset = 0
# 0, NOT 50: srsRAN rf_zmq multiplies TX by 10^(gain/20); at 50 (x316, ~+47 dBFS) OCUDU measured PUSCH
# SINR median 2.6 dB on an ideal channel, at 0 it is 42.8 dB (runs m2 vs m3, 2026-09-27).
tx_gain = 0
#rx_gain unset -> AGC

nof_antennas = 1

device_name = zmq
device_args = tx_port=tcp://*:2001,rx_port=tcp://127.0.0.1:2100,id=ue,base_srate=23.04e6
srate = 23.04e6

[rat.eutra]
nof_carriers = 0

[rat.nr]
bands = 78
nof_carriers = 1
# NR-SA cell params MUST match the gNB (gnb_zmq_n78_tdd.yaml) — this fork's srsUE does
# NOT blind-scan the band; without these it defaults to 1842.5 MHz / SCS15 / FDD and reads zeros.
dl_nr_arfcn  = 627666   # gNB dl_arfcn (3414.99 MHz, n78)
ssb_nr_arfcn = 627360   # gNB dl_ssb_arfcn (from gNB stdout)
scs          = 30       # common_scs (numerology 1)
ssb_scs      = 30       # SSB SCS
nof_prb      = 51       # 20 MHz @ SCS30
max_nof_prb  = 51

[pcap]
enable = none

[log]
all_level = info
phy_lib_level = none
all_hex_limit = 32
filename = /tmp/ocudu_passive/srsue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc  = 981d464c7c52eb6e5036234984ad0bcf
k    = 5122250214c33e723a5dd523fc145fc0
imsi = 001060123456748
imei = 675456789012341

[rrc]

[nas]
apn = internet
apn_protocol = ipv4
force_imsi_attach = true

[gw]
netns = ue1
ip_devname = tun_ue1
ip_netmask = 255.255.255.0

[gui]
enable = false

[phy]
nof_phy_threads = 3

[phy.nr]
store_pdsch_ko = false
sensing.enable = false

[general]
metrics_csv_enable = false
