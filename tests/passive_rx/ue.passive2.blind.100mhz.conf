# ==================================================================================================
# 2-receiver AoA experiment, 100 MHz. Identical to ue.passive{,2}.100mhz.conf EXCEPT the
# [sensing_channel] "objects" scene, which was redesigned because the old one was undetectable.
#
# WHY: the previous scene's single target moved at 0.1 m/s, giving a bistatic range rate of ~0.17
# m/s. Measured against the CPI geometry actually achieved, that fell INSIDE the zero-Doppler
# clutter notch (zero_doppler_guard * vel_res) in 70% of CPIs -- the target was undetectable by
# construction, and no fusion/gating tuning could have recovered it.
#
# The new scene has two patrolling targets designed against the MEASURED CPI geometry
# (range_res 3.05 m, vel_res 1.11-1.40 m/s, vel_max 17.7-22.3 m/s -- see design_scene.py, which
# re-checks every constraint at both receivers and prints pass/fail):
#   obj0  (0,60)  <-> (0,200)   6 m/s   dR  77-323 m,  |dR/dt|  9.1-11.4 m/s
#   obj1  (60,220)<-> (60,80)   6 m/s   dR  90-400 m,  |dR/dt|  7.5-11.7 m/s
# Both sit clear of the zero-range notch (9.2 m) and the zero-Doppler notch (4.2 m/s), stay under
# the Doppler alias limit (17.7 m/s) and inside the 255-tap CIR span (622 m), and their bearings
# stay within 33 deg of each receiver's broadside so the 4-element ULA can see them. They move in
# opposite directions, so they separate in Doppler even where they cross in range -- a real
# multi-target association test rather than a single blob.
#
# Waypoints run to 1200 s of SIMULATED time; at the measured ~6.7% real-time factor that covers a
# ~5 h wall-clock run before the trajectory would freeze at its endpoint.
# ==================================================================================================
# 100 MHz (273 PRB) variant of ue.passive2.conf -- see ue.passive.100mhz.conf's header for the
# prediction/re-derivation caveats on csirs_monitor/pdcch_blind_monitor_*, and ue.passive2.conf's
# header for why only rx_pos_x/y and rx_id/output paths differ from rx1.

uicc0 = {
  imsi = "001060000000000";
  key  = "00000000000000000000000000000000";
  opc  = "00000000000000000000000000000000";
}

thread-pool = "-1,-1,-1,-1,-1,-1,-1,-1";

rfsimulator = (
  {
    serveraddr = "127.0.0.1";
    options    = ("chanmod");
  }
);

channelmod = {
  max_chan  = 10;
  modellist = "modellist_rfsimu_1";
  modellist_rfsimu_1 = (
    {
      model_name     = "rfsimu_channel_enB0";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    },
    {
      model_name     = "rfsimu_channel_ue0";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    }
  );
};

sensing_channel = {
  enable            = 1;
  tx_pos_x          = 0.0;
  tx_pos_y          = 0.0;
  rx_pos_x          = -100.0;
  rx_pos_y          = 0.0;
  los_gain_db       = 0.0;
  los_delay_samples = 0.0;
  frac_delay_taps   = 8;
  channel_length    = 128;
  objects = "1.0; 0.0,0.0,60.0; 1200.0,0.0,240.0; 2400.0,0.0,60.0 | 0.8; 0.0,50.0,200.0; 800.0,50.0,80.0; 1600.0,50.0,200.0; 2400.0,50.0,80.0";
  # Same 4-element lambda/2 ULA as rx1 (0.0399m spacing @3.75GHz, see ue.passive.100mhz.conf),
  # reoriented for rx2's own geometry -- see ue.passive2.conf's rx_array comment for the bearing
  # derivation (~30deg from rx2, unchanged by bandwidth). MUST match [sensing] below exactly.
  rx_array               = "0,0;0.0399,0;0.0798,0;0.1197,0";
  rx_array_boresight_deg = -60.0;
};

sensing = {
  enable          = 1;
  sources         = "pdsch_dmrs_blind";
  csirs_monitor   = "2:0:273:1:13:0:0:2:0:160:0";

  pdcch_blind_monitor_coreset = "40:1:0:0:0:0";
  pdcch_blind_monitor_ss      = "1:0:1:0:2:0:0:0";
  pdcch_blind_monitor_bwp     = "0:273:0:48";
  # See ue.passive.100mhz.conf's header comment: energy_min disabled here for the same reason.
  pdcch_blind_monitor_noise_gates = "0:2:500:4.0:2.0";  # 5th field = energy_adapt_factor:
                               # threshold = 2.0 x running median noise floor. Absolute
                               # energy_min stays 0 -- it is in receiver-dependent units
                               # and does not transfer between bandwidths/gains.

  cpi_slots       = 32;
  interpolate     = 1;
  capture         = 1;
  sync_correction = 1;
  selftest        = 0;

  cfar_guard         = 4;
  cfar_train         = 8;
  cfar_pfa           = 1e-5;   # NOT a hand-tune: CFAR false alarms scale with the CELL
                               # COUNT, which is nof_range*nof_doppler = 3276*32 ~ 105k at
                               # 273 PRB vs ~41k at 106 PRB. The inherited 1e-4 therefore
                               # yields ~10 expected false alarms per CPI here, filling most
                               # of max_detections=16 before a real target gets a slot --
                               # measured: detection median range 2486 m (p90 4920 m) while
                               # the targets sit at 62-287 m. 1e-5 restores ~1 expected FA
                               # per CPI, the same order the 106 PRB runs had.
  zero_doppler_guard = 3;
  zero_range_guard   = 3;

  # ---- DSP options that existed but were never enabled in the passive_rx confs (they landed for
  # the attached-UE tests/sensing_sim path). Each targets an artifact visible in this cell's RVM:
  clutter_removal    = "eca+";      # direct-path cancellation by projection instead of plain
                                    # slow-time mean subtraction. The comb-12 CSI-RS row measures
                                    # only 273 of 3276 subcarriers, so the LOS leaks badly.
  range_window       = "chebyshev"; # equiripple near sidelobes. With 8.3% subcarrier occupancy the
                                    # range response has poor sidelobes, and Hann's near sidelobes
                                    # are what raise the CFAR training level around the targets.
  range_window_sidelobe_db = 70.0;
  cfar_per_row       = 1;           # THE one aimed at the observed artifact: rejects the ridge a
                                    # strong scatterer smears along its own range row across every
                                    # Doppler bin -- exactly the horizontal bands in the RVM plots,
                                    # which sit on top of the targets and lift the local threshold.
  subbin_interp      = 1;           # parabolic sub-bin peak interpolation: removes half-bin
                                    # quantisation from every reported range/velocity, which
                                    # directly tightens the fusion residuals.
  nms_range_bins     = 3;
  nms_doppler_bins   = 3;
  max_detections     = 64;   # raised from 16: the comb-12 CSI-RS row measures only 273 of
                             # 3276 subcarriers (8.3% occupancy), whose range sidelobes plus
                             # direct-path leakage produce banded clutter across the whole
                             # Doppler axis (see the RVM plots). At 16 the clutter filled
                             # EVERY slot -- measured exactly 16.0 detections/CPI -- crowding
                             # the real targets out even though they were present and their
                             # bearings were accurate to 0.02-0.07 deg. This does not remove
                             # the clutter, it stops it from starving the target.

  out_path    = "/tmp/passive_rx/passive_sensing_rx2_100m";
  report_path = "/tmp/passive_rx/passive_reports_rx2_100m.jsonl";

  rx_id          = "rx_passive2";
  illuminator_id = "gnb-passiverx";
  rx_pos_x = -100.0;
  rx_pos_y = 0.0;
  tx_pos_x = 0.0;
  tx_pos_y = 0.0;

  aoa_enable = 1;
  rx_array               = "0,0;0.0399,0;0.0798,0;0.1197,0";
  rx_array_boresight_deg = -60.0;
  aoa_broadside_deg      = 30.0;
};

log_config = {
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
};
