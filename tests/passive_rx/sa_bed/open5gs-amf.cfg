# YAML fragment for /etc/open5gs/amf.yaml. Merge these keys into the installed
# file; preserve its NRF/SBI/security/service sections. 001/06 is two-digit MNC.
amf:
  ngap:
    server:
      - address: 127.0.0.1
  guami:
    - plmn_id: {mcc: '001', mnc: '06'}
      amf_id: {region: 2, set: 1}
  tai:
    - plmn_id: {mcc: '001', mnc: '06'}
      tac: 1
  plmn_support:
    - plmn_id: {mcc: '001', mnc: '06'}
      s_nssai:
        - {sst: 1, sd: '000000'}
