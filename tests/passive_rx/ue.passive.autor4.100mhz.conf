# Agnostic rfsim receiver: the .q conf's radio/channel sections + adaptive_no_hints.conf's sensing block.
# No pinned CORESET/BWP/TDA/DM-RS/dci_length: autoconf from MIB/SIB1, autodiscover, searched DCI layout.
# 100 MHz (273 PRB) variant of ue.passive.conf -- see gnb.sa.rfsim.100mhz.conf's header for the
# frequency plan (carrier centre 3750.00 MHz, -C 3750000000 -r 273). Otherwise identical structure;
# only bandwidth-dependent numbers differ, re-derived (NOT re-measured live except where noted) from
# openair2/LAYER2/NR_MAC_gNB/nr_radio_config.c's get_coreset_config()/get_nzp_csi_rs_resource() the
# same way the 106-PRB values in ue.passive.conf originally were, PLUS this session's live-verified
# 106-PRB numbers as a Rosetta stone for which fields are bandwidth-independent (scrambling=PCI,
# CORESET duration, SS periodicity/candidates, dmrs_typeA_position -- all unchanged) vs
# bandwidth-dependent (CORESET num_groups, RIV bit width -> dci_length, csirs nr_rbs).
#
# dci_length_override=48 is a PREDICTION, not yet live-verified: at 106 PRB the real payload (45)
# was 3 bits short of the formula's 48, and that 3-bit gap looked config-related (not bandwidth-
# related) in the 106-PRB investigation, so predicted 273-PRB real length = (48-3) fixed-bit-guess +
# 16 riv_bits(273) = 48. RE-VERIFY the same way 45 was verified for 106 PRB (RNTI cross-check
# against the active UE's real C-RNTI, see PHASE3_BLIND_PDCCH_LIVE_WIRING_HANDOVER.md) before
# trusting blind-PDCCH decode at this bandwidth.
#
# csirs_monitor is similarly a PREDICTION for nr_rbs/period/offset -- RE-DERIVE per procedure:
# run the gNB with --log_config.nr_mac_log_level debug and grep "Scheduling CSI-RS in frame".

uicc0 = {
  imsi = "001060000000000";
  key  = "00000000000000000000000000000000";
  opc  = "00000000000000000000000000000000";
}

thread-pool = "-1,-1,-1,-1,-1,-1,-1,-1";

rfsimulator = (
  {
    serveraddr = "127.0.0.1";
    options    = ("chanmod");
  }
);

channelmod = {
  max_chan  = 10;
  modellist = "modellist_rfsimu_1";
  modellist_rfsimu_1 = (
    {
      model_name     = "rfsimu_channel_enB0";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    },
    {
      model_name     = "rfsimu_channel_ue0";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    }
  );
};

sensing_channel = {
  enable            = 1;
  tx_pos_x          = 0.0;
  tx_pos_y          = 0.0;
  rx_pos_x          = 100.0;
  rx_pos_y          = 0.0;
  los_gain_db       = 0.0;
  los_delay_samples = 0.0;
  frac_delay_taps   = 8;
  channel_length    = 128;
  objects           = "0.5; 0,60,80; 200,60,80 | 0.5; 0,140,-60; 200,140,-60 | 0.5; 0,-40,120; 200,-40,120";
  # AoA: carrier here is 3750.00 MHz, lambda=c/f=0.07994m, lambda/2=0.03997m -- spacing rounded DOWN
  # to 0.0399 for the same reason the 106-PRB config rounds down (avoid tripping
  # sensing_channel.c's cosmetic "AMBIGUOUS" check by a rounding hair). Target bearing from rx1 is
  # UNCHANGED (same physical geometry, ~122deg), so boresight/broadside carry over unchanged too.
  rx_array               = "0,0;0.0399,0;0.0798,0;0.1197,0";
  rx_array_boresight_deg = 32.0;
  tx_array               = "0,0;0.04,0;0.08,0;0.12,0";
  tx_array_boresight_deg = 90.0;
};

# csirs_monitor fields, in order:
#   row : start_rb : nr_rbs : freq_domain : symb_l0 : symb_l1 : cdm_type : freq_density
#       : scramb_id : period_slots : offset_slots
#
# row/freq_domain/symb_l0/symb_l1/cdm_type/freq_density/scramb_id are bandwidth-INDEPENDENT in
# get_nzp_csi_rs_resource() (same 1-port row2 branch, same PCI=0 scrambling) so carry over from the
# live-verified 106-PRB values unchanged. nr_rbs is a PREDICTION: the same "round up to a multiple
# of 4, then clamp to BWP size" pattern that gave 106 (clamped down from a natural 108) should give
# 273 here (natural value from the >>2/<<2 rounding is 276, clamp to bwp_size=273). period/offset
# are also PREDICTIONS carried over unchanged from 106 PRB (same numerology/TDD pattern, and nothing
# in get_nzp_csi_rs_resource()'s periodicity logic reads bwp_size) -- NOT independently reverified.
sensing = {
  enable = 0;
  pdcch_blind_monitor_autoconf = 1;
  pdcch_blind_monitor_autodiscover = 1;
  pdcch_blind_monitor_full_auto = 1;
  pdcch_blind_monitor_dci10 = "1";
  pdcch_blind_monitor_pdsch = "1:1:0:1:16:3:20:2";
  pdcch_blind_monitor_rnti_range = "1:65519";
  pdcch_blind_monitor_noise_gates = "0:2:500:0:3.0";
  pdcch_blind_monitor_scan_thread = "1:8:5";
  pdcch_blind_monitor_dci01 = "1:0";
  pdcch_blind_monitor_ul_pusch = "1:1:0";
  // Live UCI-on-PUSCH recovery: sweep up to 64 RE when exploring, explore on 1 failure in 32.
  // CSI Part 1 is always rate-matched, so the LLRs must be COMPACTED, not merely truncated.
  pdcch_blind_monitor_ul_uci = "256:11:0:32";
  pdcch_blind_monitor_ul_thread = "2:32:2";
};
