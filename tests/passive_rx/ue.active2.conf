# SECOND active UE, so the passive receivers see downlink traffic to/from TWO independent RNTIs
# (not just one) -- makes the blind-PDCCH RNTI-persistence gate exercise more realistic (real
# deployments have more than one active UE) and doubles the CFR-submission rate available to
# fusion. Credentials provisioned in the local open5gs mongodb (distinct IMSI from ue.active.conf).
#
# MUST run in its own network namespace (run_passive_rx.sh's setup_ue_netns/oai_pue2), NOT the
# default one ue.active.conf uses: nr-uesoftmodem always creates its PDU session TUN as
# "oaitun_ue1" (tuntap_generate_ue_ifname()'s ue_id is always 0 -- one UE per process, no CLI knob
# to change it), so two active UEs in the SAME netns collide on that device name. The rfsim SERVER
# (gNB) itself binds the wildcard address (getaddrinfo(NULL,...) + AI_PASSIVE in simulator.cpp), so
# it accepts a connection from this netns's veth peer with no gNB-side config change -- only this
# UE's own serveraddr needs to point at the veth's HOST-side IP instead of 127.0.0.1.
rfsimulator = (
  {
    serveraddr = "10.91.2.1";
  }
);

uicc0 = {
  imsi = "001060123456744";
  key  = "cdbf02d9754fe0212bce1e660e2a8af8";
  opc  = "5dee9ddc47453d1c769260499818b1db";
  dnn  = "internet";
  nssai_sst = 1;
  nssai_sd  = 0;
}

thread-pool = "-1,-1,-1,-1,-1,-1,-1,-1";
