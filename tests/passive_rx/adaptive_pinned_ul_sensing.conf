// Manual mode (adaptive_pinned_ul.conf, unchanged) + the sensing pipeline ON, for the live
// dashboard: CFO/SFO trackers, LOS baseline and DetectionReports on tcp://*:5556.
// Sources are the OTA-safe ones: SSB (cell-common, always present) and blind-PDCCH DM-RS.
// csi_rs is deliberately absent -- no csirs_monitor line has been verified for this X410 cell,
// and a wrong one yields garbage CFR, not a weak one.
sensing = {
  enable = 1;
  pdcch_blind_monitor_autoconf = 1;
  pdcch_blind_monitor_autodiscover = 1;
  pdcch_blind_monitor_full_auto = 0;
  pdcch_blind_monitor_dci10 = "1";
  pdcch_blind_monitor_pdsch = "1:1:0:1:16:3:20:2";
  pdcch_blind_monitor_rnti_range = "1:65519";
  pdcch_blind_monitor_noise_gates = "0:2:500:0:3.0";
  pdcch_blind_monitor_scan_thread = "1:8:5";
  pdcch_blind_monitor_dci01 = "1:43";
  pdcch_blind_monitor_ul_pusch = "1:1:0";
  pdcch_blind_monitor_ul_uci = "256:11:0:32";
  pdcch_blind_monitor_ul_thread = "2:64:2";  // consumers on the ISOLATED cores 2-3 (isolcpus, no NIC IRQs).
  // Cores 10-13 were tried and cost 8 RXDISCONTs: the E-cores carry the mlx5 completion queues.
  pdcch_blind_monitor_ul_dci_bits = "0:0:0:0:4:2:0:0:0:3:2:0:0:0:0:1";
  pdcch_blind_monitor_ul_bwp = "0:273";
  pdcch_blind_monitor_ul_tda = "0:14:4:0,0:14:5:0,0:14:6:0,0:14:7:0,0:14:8:0,0:14:11:0";

  sources             = "ssb,pdsch_dmrs_blind";
  cpi_slots           = 32;
  interpolate         = 1;
  capture             = 0;
  sync_correction     = 1;
  nominal_los_range_m = 0.0;
  report_path         = "/tmp/passive_rx/x410_manual_reports.jsonl";
  out_path            = "/tmp/passive_rx/x410_manual_sensing";
  report_endpoint     = "tcp://*:5556";
  rx_id               = "rx_x410";
};
