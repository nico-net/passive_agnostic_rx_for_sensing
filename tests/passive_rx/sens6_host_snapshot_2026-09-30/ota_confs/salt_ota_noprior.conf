// AGNOSTIC OTA conf for the Salt commercial cell (band 78, 217 PRB, 3540 MHz). Same no-prior shape
// as agnostic_ota_noprior.conf (mcs_table=0 forces Technique D; no pinned CORESET/BWP/TDA/DM-RS),
// with the PDSCH consumer count bumped 2->6 -- learned on THIS cell in cons6_ota.conf ("queue was
// dropping 93% full at 2"): Salt's real grant rate is much higher than the lab cell's.
sensing = {
  enable = 1;
  pdcch_blind_monitor_autoconf = 1;
  pdcch_blind_monitor_autodiscover = 1;
  pdcch_blind_monitor_full_auto = 1;
  pdcch_blind_monitor_dci10 = "1";
  pdcch_blind_monitor_pdsch = "2:0:0:1:16:6:64:6";  // mcs_table=0 (unknown): Technique D determines it live; 6 consumers (Salt grant rate)
  pdcch_blind_monitor_rnti_range = "1:65519";
  pdcch_blind_monitor_noise_gates = "0:2:500:0:3.0";
  pdcch_blind_monitor_scan_thread = "1:8:5";
  pdcch_blind_monitor_dci01 = "1:0";
  pdcch_blind_monitor_ul_pusch = "1:1:0";
  pdcch_blind_monitor_ul_uci = "256:11:0:32";
  pdcch_blind_monitor_ul_thread = "2:64:2";
  sources = "ssb,pdsch_dmrs_blind,pdsch_data,pusch_dmrs,pusch_data";
  cpi_slots = 32;
  interpolate = 1;
  capture = 0;
  sync_correction = 1;
  nominal_los_range_m = 0.0;
  report_path = "/tmp/passive_rx/salt_ota_reports.jsonl";
  out_path = "/tmp/passive_rx/salt_ota_sensing";
  report_endpoint = "tcp://*:5557";
  rx_id = "rx_salt";
};
