# X410 high-throughput data link: default netdev_max_backlog (1000) is small for a bursty ~10GbE-class
# SDR sample stream; rmem/wmem already generously sized separately. Documented NIC-drop/RFSTALL history
# on this rig (see project memory) motivates a modest bump, not an aggressive one.
net.core.netdev_max_backlog = 5000
