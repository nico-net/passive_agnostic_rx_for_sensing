# Sensing API v2 example. Merge this sensing block into the receiver's libconfig file,
# or pass these values as --sensing.* command-line overrides.
sensing = {
  enable = 1;
  # "all" is not a token in the current adapter; list every source explicitly.
  # PRACH is record-only; SRS and the other RS/data taps may write CFR frames.
  sources = "csi_rs,pdsch_dmrs,pdsch_dmrs_blind,pdsch_data,pusch_dmrs,pusch_data,ssb,prach,srs";
  records_path = "/tmp/sense_api_records.jsonl";
  cfr_path = "/tmp/sense_api_frames.cfr";
  cfr_antennas = 4;
  cfr_ring_frames = 32;
  cfr_max_re = 46200;
  rec_ring_slots = 1024;
  # Four antennas at the maximum RE cap use about 53 MiB of preallocated rings.
  # Larger rings reduce drops but cost RAM; CFR disk writes and extra channel
  # estimates cost CPU and storage bandwidth. Measure against enable=0.
};
