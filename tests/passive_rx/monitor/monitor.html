<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Passive RX Monitor</title>
<style>
:root{
  --bg:oklch(0.16 0.014 240); --panel:oklch(0.205 0.016 240); --raised:oklch(0.245 0.018 240);
  --border:oklch(0.32 0.02 240); --soft:oklch(0.27 0.018 240);
  --text:oklch(0.93 0.006 240); --dim:oklch(0.66 0.012 240); --faint:oklch(0.48 0.012 240);
  --green:oklch(0.78 0.19 150); --green-d:oklch(0.26 0.05 150);
  --amber:oklch(0.80 0.15 75);  --amber-d:oklch(0.28 0.05 75);
  --red:oklch(0.68 0.19 25);    --red-d:oklch(0.28 0.06 25);
  --cyan:oklch(0.76 0.12 215);  --cyan-d:oklch(0.26 0.05 215);
  --violet:oklch(0.72 0.15 305);--violet-d:oklch(0.27 0.05 305);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 "IBM Plex Sans",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
header{display:flex;align-items:center;gap:20px;padding:0 20px;height:52px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.05em;font-size:13.5px}
.brand svg{width:21px;height:21px;color:var(--green)}
select{background:var(--raised);color:var(--dim);border:1px solid var(--border);border-radius:5px;padding:6px 10px;font-family:"IBM Plex Mono",monospace;font-size:11.5px}
.status{margin-left:auto;display:flex;align-items:center;gap:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;padding:5px 10px;border-radius:4px}
.chip-green{background:var(--green-d);color:var(--green)} .chip-amber{background:var(--amber-d);color:var(--amber)}
.chip-red{background:var(--red-d);color:var(--red)} .chip-grey{background:var(--raised);color:var(--faint)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
/* Acquisition chain: the receiver's own state machine, drawn as the path it has actually walked.
   Reached states are filled; the current one carries the accent ring; unreached stay outlined so
   the gap between "where we are" and "what is left" is readable without counting. */
.panel-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:11px 14px 0;font-weight:600}
.acq{display:flex;flex-wrap:wrap;align-items:center;gap:0;padding:12px 14px}
.acq .st{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.04em;padding:5px 9px;border-radius:4px;border:1px solid var(--border);color:var(--faint);white-space:nowrap}
.acq .st.hit{background:var(--green-d);color:var(--green);border-color:transparent}
.acq .st.now{background:var(--cyan-d);color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.acq .st.lost{background:var(--red-d);color:var(--red);border-color:transparent}
.acq .arr{color:var(--faint);padding:0 6px;font-size:11px}
.facts{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px}
.fact{display:flex;flex-direction:column;gap:3px;background:var(--raised);border:1px solid var(--border);border-radius:5px;padding:8px 10px;min-width:132px}
.fact .k{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.fact .v{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--text)}
.fact .v.ok{color:var(--green)} .fact .v.bad{color:var(--red)} .fact .v.wait{color:var(--faint)}
.stat{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint)} .stat b{color:var(--text);font-weight:500}
nav{display:flex;gap:4px;padding:0 20px;height:38px;border-bottom:1px solid var(--border);flex-shrink:0}
nav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--faint);font:500 12.5px/1 inherit;padding:0 15px;cursor:pointer}
nav button:hover{color:var(--dim)} nav button.active{color:var(--text);border-bottom-color:var(--green)}
main{flex:1;min-height:0;padding:16px 20px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.panel{background:var(--panel);border:1px solid var(--soft);border-radius:8px;padding:14px 16px}
.ptitle{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:11px}
.row{display:flex;gap:14px} .row>*{flex:1;min-width:0}
.cardv{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;margin:6px 0 4px}
.cardv.good{color:var(--green)} .cardv.warn{color:var(--amber)} .cardv.bad{color:var(--red)}
.clab{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.csub{font-size:11px;color:var(--dim);font-family:"IBM Plex Mono",monospace}
table{width:100%;border-collapse:collapse;font-family:"IBM Plex Mono",monospace;font-size:11.5px}
th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:600;padding:0 6px 8px}
td{padding:5px 6px;border-top:1px solid var(--soft);color:var(--dim)} td.hl{color:var(--text)}
.kv{display:flex;justify-content:space-between;gap:10px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:6px 0;border-bottom:1px solid var(--soft)}
.kv:last-child{border-bottom:none} .kv .k{color:var(--faint)} .kv .v{color:var(--text);text-align:right}
.bar{height:9px;background:var(--raised);border-radius:5px;overflow:hidden} .bar>div{height:100%}
canvas{display:block;width:100%;border-radius:6px;border:1px solid var(--soft);background:oklch(0.11 0.018 240)}
.banner{display:flex;gap:10px;padding:10px 14px;background:var(--amber-d);border:1px solid oklch(0.80 0.15 75/.35);border-radius:7px;font-size:11.5px;color:var(--dim);line-height:1.5}
.banner b{color:var(--amber)}
.log{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim);white-space:pre-wrap;word-break:break-all;max-height:420px;overflow:auto;line-height:1.7}
.hidden{display:none!important}
.empty{color:var(--faint);font-size:12px;padding:18px 0;text-align:center;font-family:"IBM Plex Mono",monospace}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.2" stroke-opacity=".5"/>
      <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>
      <path d="M12 12 L12 3"/><path d="M12 12 L18.4 7.6" stroke-opacity=".35"/>
    </svg>PASSIVE&middot;RX MONITOR
  </div>
  <select id="rxsel"></select>
  <div class="status" id="status"></div>
</header>
<nav id="tabs"></nav>
<main id="view"></main>

<script>
const TABS = ["Link & Sync Health","DL Detections","UL Detections","Tracking","Config / Scene"];
let tab = 0, state = null, rxId = null, pollError = null;

const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const fmt = (v, d = 2) => (v == null || Number.isNaN(v)) ? "—" : (+v).toFixed(d);
const panel = (title, ...kids) => { const p = el("div","panel"); if (title) p.appendChild(el("div","ptitle",title)); kids.forEach(k => k && p.appendChild(k)); return p; };

function chip(cls, txt, dot = true) {
  const c = el("span", "chip " + cls);
  if (dot) c.appendChild(el("span","dot"));
  c.appendChild(document.createTextNode(txt));
  return c;
}
function card(label, value, cls, sub) {
  const p = el("div","panel");
  p.appendChild(el("div","clab",label));
  p.appendChild(el("div","cardv " + (cls||""), value));
  if (sub) p.appendChild(el("div","csub",sub));
  return p;
}
function kvRows(pairs) {
  const f = document.createDocumentFragment();
  for (const [k,v,color] of pairs) {
    const r = el("div","kv");
    r.appendChild(el("span","k",k));
    const val = el("span","v",v);
    if (color) val.style.color = `var(--${color})`;
    r.appendChild(val); f.appendChild(r);
  }
  return f;
}
function table(cols, rows) {
  const t = el("table"), hr = el("tr");
  cols.forEach(c => hr.appendChild(el("th",null,c)));
  t.appendChild(hr);
  rows.forEach(r => {
    const tr = el("tr");
    r.forEach((c,i) => tr.appendChild(el("td", i===0?"hl":null, c)));
    t.appendChild(tr);
  });
  return t;
}

const rx = () => state && rxId ? state.receivers[rxId] : null;
const rep = () => { const r = rx(); return r && r.latest; };

/* ---- detection source split -------------------------------------------------------------------
   src_occ counts ROWS per source in the fused CPI grid. Detections come out of that ONE grid, so a
   detection cannot be attributed to DL or UL individually -- the split below is by which sources
   contributed rows, and the UL tab says so rather than implying per-detection attribution. */
function occ() {
  const r = rep(); if (!r || !r.src_occ) return null;
  const names = state.source_names, out = {};
  /* pdsch_dmrs is the ATTACHED-UE DM-RS source: its RT tap lives in nr_ue_pdsch_procedures(), which
     only runs for grants addressed to this UE's own RNTI after RRC connection. A --passive-rx
     receiver never attaches, so the row is structurally always 0 and a permanently empty bar just
     reads as a fault. Its passive counterpart is pdsch_dmrs_blind (the blind-PDCCH tap), which
     carries the same signal and is typically the LARGEST contributor -- so that one is shown in its
     place. Indices stay aligned with nr_isac_source_t; this is display only. */
  const HIDE = {pdsch_dmrs: 1};
  const LABEL = {blind: "pdsch_dmrs (blind)"};
  r.src_occ.forEach((n,i) => {
    const k = names[i] || (i === 6 ? "ssb" : null);
    if (k && !HIDE[k]) out[LABEL[k] || k] = n;
  });
  return out;
}
const ulRows = () => { const o = occ(); return o ? state.ul_sources.reduce((a,s) => a + (o[s]||0), 0) : 0; };
const dlRows = () => { const o = occ(); if (!o) return 0;
  return Object.entries(o).filter(([s]) => !state.ul_sources.includes(s)).reduce((a,[,n]) => a+n, 0); };

/* ---- range-Doppler raster ---------------------------------------------------------------------- */
function rasterCanvas(r) {
  const wrap = el("div");
  const cv = el("canvas"); cv.height = 320; wrap.appendChild(cv);
  requestAnimationFrame(() => {
    cv.width = cv.clientWidth;
    const ctx = cv.getContext("2d"), W = cv.width, H = cv.height;
    ctx.fillStyle = "oklch(0.11 0.018 240)"; ctx.fillRect(0,0,W,H);
    const blob = r.rvm_blob;
    if (blob && blob.length) {
      // rvm_blob is row-major over Doppler x range; infer the range extent from the axis metadata.
      const nR = Math.max(1, Math.round(r.range_max_m / r.range_res_m));
      const nD = Math.max(1, Math.floor(blob.length / nR));
      let lo = Infinity, hi = -Infinity;
      for (const v of blob) { if (v < lo) lo = v; if (v > hi) hi = v; }
      const span = (hi - lo) || 1;
      const img = ctx.createImageData(W, H);
      for (let y = 0; y < H; y++) {
        const d = Math.min(nD-1, Math.floor(y / H * nD));
        for (let x = 0; x < W; x++) {
          const rr = Math.min(nR-1, Math.floor(x / W * nR));
          const t = Math.max(0, Math.min(1, (blob[d*nR + rr] - lo) / span));
          const i = (y*W + x) * 4;
          // dark blue -> cyan -> amber, matching the colorbar
          img.data[i]   = 255 * Math.min(1, Math.max(0, t*2 - 0.9));
          img.data[i+1] = 255 * Math.min(1, t*1.5);
          img.data[i+2] = 255 * Math.min(1, Math.max(0.08, 1.2 - t*1.6));
          img.data[i+3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    } else {
      ctx.fillStyle = "oklch(0.48 0.012 240)"; ctx.font = "12px IBM Plex Mono, monospace";
      ctx.textAlign = "center";
      ctx.fillText("no rvm_blob in report — set [sensing] capture = 1 to stream the raster", W/2, H/2);
    }
    // detection markers
    ctx.strokeStyle = "oklch(0.76 0.12 215)"; ctx.lineWidth = 1.5;
    ctx.fillStyle = "oklch(0.76 0.12 215)"; ctx.font = "10px IBM Plex Mono, monospace";
    ctx.textAlign = "left";
    for (const d of r.detections || []) {
      const x = (d.bistatic_range_m / (r.range_max_m||1)) * W;
      const y = H/2 - (d.bistatic_velocity_mps / (r.vel_max_mps||1)) * (H/2);
      ctx.strokeRect(x-10, y-10, 20, 20);
      ctx.fillText(`${fmt(d.bistatic_range_m,0)}m ${fmt(d.bistatic_velocity_mps,1)}m/s`, x+13, y+3);
    }
    // axes
    ctx.fillStyle = "oklch(0.48 0.012 240)"; ctx.font = "9px IBM Plex Mono, monospace";
    for (let i = 0; i <= 4; i++) {
      ctx.fillText(fmt(r.range_max_m*i/4, 0)+" m", i/4*W + 3, H-5);
    }
    ctx.fillText("+"+fmt(r.vel_max_mps,1)+" m/s", 3, 11);
    ctx.fillText("−"+fmt(r.vel_max_mps,1)+" m/s", 3, H-16);
  });
  return wrap;
}

function detTable(r) {
  const rows = (r.detections||[]).map((d,i) => [
    String(i+1), fmt(d.bistatic_range_m,1), fmt(d.bistatic_velocity_mps,2),
    d.azimuth_deg != null ? fmt(d.azimuth_deg,1)+"°" : "—",
    fmt(d.snr_db,1), d.p_real != null ? fmt(d.p_real,2) : "—",
  ]);
  return rows.length ? table(["#","Range m","Rate m/s","Az","SNR dB","p(real)"], rows)
                     : el("div","empty","no detections in the latest CPI");
}

/* Staleness limit. A CPI closes on ROW COUNT, never on time, so its wall-clock cadence swings with
   traffic: ~4 s at cpi_slots=128 but 150-200 s at 1024. A fixed 60 s threshold made a perfectly
   healthy long-CPI run read STALE for two thirds of every CPI. Derive it from the receiver's own
   median inter-report gap instead, with 60 s as the floor for a run too young to have a gap yet. */
function staleLimit(h) { return Math.max(60, 2.5 * ((h && h.cadence_s) || 0)); }

/* Per-CPI LOS trace: labelled y-axis, current value, and off-scale points kept visible.
   Values outside `sane` are drawn as warn-coloured ticks at the top and EXCLUDED from the
   autoscale -- otherwise a single comb-replica reading (measured up to 1.4e10 bins) flattens every
   real 0-10 m value onto the axis and hides the thing the trace exists to show. */
function trace(vals, sane, unit) {
  const wrap = el("div");
  const good = vals.filter(v => v != null && v >= 0 && v <= sane);
  if (!good.length) { wrap.appendChild(el("div","empty","no LOS estimate yet")); return wrap; }

  let lo = Math.min(...good), hi = Math.max(...good);
  if (hi - lo < 0.5) { const m = (lo + hi) / 2; lo = m - 0.25; hi = m + 0.25; }   // avoid a flat line filling the box
  if (lo < 0) lo = 0;
  const span = hi - lo;
  const cur  = [...vals].reverse().find(v => v != null && v >= 0);

  const PADL = 54, W = 560, H = 110, TOP = 12, BOT = H - 20;
  const x = i => PADL + (vals.length < 2 ? (W - PADL) : (i * (W - PADL)) / (vals.length - 1));
  const y = v => BOT - ((v - lo) / span) * (BOT - TOP);

  const ns  = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", "100%"); svg.setAttribute("height", H);

  const mk = (tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  };

  // y-axis: three labelled gridlines, in the unit the reader cares about
  [0, 0.5, 1].forEach(f => {
    const v = lo + f * span, yy = y(v);
    svg.appendChild(mk("line", {x1: PADL, y1: yy, x2: W, y2: yy,
                                stroke: "var(--border)", "stroke-width": 1, "stroke-dasharray": f === 0 ? "" : "3 3"}));
    svg.appendChild(mk("text", {x: PADL - 6, y: yy + 3.5, "text-anchor": "end",
                                fill: "var(--dim)", "font-size": "9.5",
                                "font-family": "'IBM Plex Mono',monospace"}, v.toFixed(2)));
  });
  svg.appendChild(mk("text", {x: 4, y: TOP - 3, fill: "var(--dim)", "font-size": "9.5",
                              "font-family": "'IBM Plex Mono',monospace"}, unit));

  const pts = [];
  vals.forEach((v, i) => {
    if (v == null || v < 0) return;
    if (v > sane) {
      svg.appendChild(mk("line", {x1: x(i), y1: TOP - 6, x2: x(i), y2: TOP - 1,
                                  stroke: "var(--amber)", "stroke-width": 1.6}));
    } else {
      pts.push(x(i).toFixed(1) + "," + y(v).toFixed(1));
    }
  });
  svg.appendChild(mk("polyline", {points: pts.join(" "), fill: "none",
                                  stroke: "var(--cyan)", "stroke-width": 1.7}));

  // current value, marked on the trace and printed at the right edge
  if (cur != null && cur <= sane) {
    svg.appendChild(mk("circle", {cx: x(vals.length - 1), cy: y(cur), r: 3, fill: "var(--cyan)"}));
    svg.appendChild(mk("text", {x: W - 2, y: Math.max(TOP + 9, y(cur) - 7), "text-anchor": "end",
                                fill: "var(--cyan)", "font-size": "11", "font-weight": "600",
                                "font-family": "'IBM Plex Mono',monospace"},
                       cur.toFixed(2) + " " + unit));
  }
  svg.appendChild(mk("text", {x: PADL, y: H - 6, fill: "var(--dim)", "font-size": "9.5",
                              "font-family": "'IBM Plex Mono',monospace"},
                     `oldest  <- ${vals.length} CPIs ->  newest`));
  wrap.appendChild(svg);

  const off = vals.filter(v => v != null && v > sane).length;
  const cap = el("div","empty");
  cap.textContent = `current ${cur != null ? cur.toFixed(2) + " " + unit : "-"}`
                  + ` · axis ${lo.toFixed(2)}-${hi.toFixed(2)} ${unit}`
                  + (off ? ` · ${off} CPIs off-scale (>${sane} ${unit}, comb replica -- rejected by the tracker)` : "");
  wrap.appendChild(cap);
  return wrap;
}

/* ---- tabs -------------------------------------------------------------------------------------- */
function tabHealth(v) {
  const r = rep(), h = rx(), log = state.log;
  if (!r) { v.appendChild(el("div","empty","waiting for the first DetectionReport…")); return; }
  const s = r.sync || {}, sto = s.sto||{}, cfo = s.cfo||{}, sfo = s.sfo||{}, los = s.los_residual||{};
  const age = h.last_seen ? state.now - h.last_seen : 999;
  const lim = staleLimit(h);
  const fly = sto.n_valid ? 100*sto.n_flywheel/(sto.n_valid+sto.n_flywheel) : null;
  const st = log && log.stats || {};

  const cards = el("div","row");
  /* Receiver liveness is a SEPARATE fact from report freshness. A receiver that has lost PBCH
     lock still writes to its log continuously while emitting no CPIs at all, and showing only
     "STALE" for that is indistinguishable from nothing running -- which is the opposite of what
     it means. */
  {
    const la = (state.log && state.log.last_line_at) || null;
    const lage = la ? (state.now - la) : null;
    cards.appendChild(card("Receiver",
      lage == null ? "NO LOG" : lage < 15 ? "ALIVE" : "SILENT " + fmt(lage,0) + "s",
      lage == null ? null : lage < 15 ? "good" : "bad",
      lage != null && lage < 15 && age >= lim ? "running but not closing CPIs" : "log activity"));
  }
  cards.appendChild(card("Report stream", age < lim ? "LIVE" : "STALE", age < lim ? "good":"bad",
    `${h.cpi_count} CPIs · last ${fmt(age,0)}s ago` + (h.cadence_s ? ` · every ~${fmt(h.cadence_s,0)}s` : "")));
  cards.appendChild(card("CFO", fmt(cfo.cfo_hz,1)+" Hz", Math.abs(cfo.cfo_hz||0) < 300 ? "good":"bad",
    `filtered ${fmt(cfo.cfo_hz_filtered,1)} Hz · mis-lock >2600 Hz`));
  cards.appendChild(card("STO flywheel", fly==null?"—":fmt(fly,0)+"%", fly>60?"bad":fly>35?"warn":"good",
    `${sto.n_valid||0} locked · ${sto.n_flywheel||0} flywheel rows`));
  cards.appendChild(card("LOS range", sto.los_range_m!=null && sto.los_range_m>=0 ? fmt(sto.los_range_m,2)+" m" : "—",
    (sto.los_range_m!=null && sto.los_range_m>=0 && sto.los_range_m<=60) ? "good" : "warn",
    (sto.los_seed_bin!=null ? `bin ${fmt(sto.los_seed_bin,3)}` : "") +
    (sto.n_seed_rejected ? ` · ${sto.n_seed_rejected} rows rejected` : "")));
  cards.appendChild(card("SFO", fmt(sfo.sfo_ppm,3)+" ppm", sfo.corrected ? "good":"warn",
    sfo.corrected ? "correction applied" : "correction withheld (R²/t gate)"));
  v.appendChild(cards);

  const o = occ();
  const occPanel = panel("CFR occupancy (rows / CPI)",
    el("div", "csub", `CPI ${h.cpi_count || 0} | last update ${fmt(age,1)}s ago`));
  if (o) {
    const max = Math.max(1, ...Object.values(o));
    for (const [name,n] of Object.entries(o)) {
      const row = el("div"); row.style.cssText = "display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;margin-bottom:9px;font-family:'IBM Plex Mono',monospace;font-size:11.5px";
      row.appendChild(el("span",null,name));
      const bar = el("div","bar"), fill = el("div");
      fill.style.cssText = `width:${100*n/max}%;background:var(--${state.ul_sources.includes(name)?"violet":"cyan"})`;
      bar.appendChild(fill); row.appendChild(bar);
      row.appendChild(el("span",null,String(n)));
      occPanel.appendChild(row);
    }
  } else occPanel.appendChild(el("div","empty","receiver build predates src_occ reporting"));

  v.appendChild(panel("LOS range per CPI — converged estimate (m)",
    trace((h.history||[]).map(x => x.los_range_m), 60, "m")));

  const health = panel("Decode / radio health", kvRows([

  meta.appendChild(card("UL usable decodes", st.ul_ok!=null ? String(st.ul_ok) : "—",

function tabTracking(v) {
  const r = rep(), h = rx();
  if (!r) { v.appendChild(el("div","empty","waiting for data…")); return; }
  const tracks = r.tracks || [];
  const wrap = el("div"); wrap.style.cssText = "display:flex;gap:14px;flex:1;min-height:0";
  const mapPanel = el("div","panel"); mapPanel.style.cssText = "flex:1;min-width:0;padding:0;position:relative";
  const cv = el("canvas"); cv.height = 560; mapPanel.appendChild(cv);
  wrap.appendChild(mapPanel);

  const side = el("div"); side.style.cssText = "width:290px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;overflow:auto";
  side.appendChild(panel(`Tracks (${tracks.length})`));
  const COLORS = ["cyan","amber","violet","green"];
  tracks.forEach((t,i) => {
    const p = el("div","panel");
    const head = el("div"); head.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px";
    const id = el("div"); id.style.cssText="font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px";
    const sw = el("span"); sw.style.cssText=`width:9px;height:9px;border-radius:50%;background:var(--${COLORS[i%4]})`;
    id.append(sw, document.createTextNode("TRK-"+String(t.track_id).padStart(3,"0")));
    head.appendChild(id);
    head.appendChild(chip(t.updated?"chip-green":"chip-amber", t.updated?"UPDATED":"COASTING"));
    p.appendChild(head);
    p.appendChild(kvRows([
      ["Δrange", fmt(t.bistatic_range_m,1)+" m"],
      ["range rate", fmt(t.bistatic_velocity_mps,2)+" m/s"],
      ["bearing", t.azimuth_deg!=null ? `${fmt(t.azimuth_deg,1)}° ±${fmt(t.azimuth_std_deg,1)}°` : "— (no AoA)"],
      ["position", t.position ? `${fmt(t.position[0],0)}, ${fmt(t.position[1],0)} m` : "no fix"],
      ["σ range / coast", `${fmt(t.sigma_range_m,1)} m / ${t.coast_count}`],
    ]));
    side.appendChild(p);
  });
  if (!tracks.length) side.appendChild(panel(null, el("div","empty","no confirmed tracks")));
  wrap.appendChild(side);
  v.appendChild(wrap);

  requestAnimationFrame(() => {
    cv.width = cv.clientWidth;
    const ctx = cv.getContext("2d"), W = cv.width, H = cv.height;
    const tx = r.tx_position || [0,0], rxp = r.rx_position || [0,0];
    // world extent from everything we must show, with margin
    const pts = [rxp, tx, ...tracks.filter(t=>t.position).map(t=>t.position)];
    Object.values(h.trails||{}).forEach(tr => tr.forEach(p => pts.push([p.x,p.y])));
    let minX = Math.min(...pts.map(p=>p[0])), maxX = Math.max(...pts.map(p=>p[0]));
    let minY = Math.min(...pts.map(p=>p[1])), maxY = Math.max(...pts.map(p=>p[1]));
    const pad = Math.max(60, 0.15*Math.max(maxX-minX, maxY-minY, 1));
    minX-=pad; maxX+=pad; minY-=pad; maxY+=pad;
    const sc = Math.min(W/(maxX-minX), H/(maxY-minY));
    const X = x => (x-minX)*sc, Y = y => H-(y-minY)*sc;   // world +y is up

    ctx.fillStyle="oklch(0.13 0.016 245)"; ctx.fillRect(0,0,W,H);
    // range rings around the receiver
    ctx.strokeStyle="oklch(1 0 0 / 0.09)"; ctx.lineWidth=1;
    ctx.fillStyle="oklch(1 0 0 / 0.3)"; ctx.font="9px IBM Plex Mono, monospace";
    for (let d=100; d<=1000; d+=100) {
      const rad = d*sc; if (rad > Math.hypot(W,H)) break;
      ctx.beginPath(); ctx.arc(X(rxp[0]), Y(rxp[1]), rad, 0, 7); ctx.stroke();
      ctx.fillText(d+" m", X(rxp[0])+4, Y(rxp[1])-rad-3);
    }
    // baseline Rx -> gNB
    ctx.strokeStyle="oklch(0.80 0.15 75 / 0.6)"; ctx.setLineDash([5,5]); ctx.beginPath();
    ctx.moveTo(X(rxp[0]),Y(rxp[1])); ctx.lineTo(X(tx[0]),Y(tx[1])); ctx.stroke(); ctx.setLineDash([]);

    tracks.forEach((t,i) => {
      const col = `oklch(${["0.76 0.12 215","0.80 0.15 75","0.72 0.15 305","0.78 0.19 150"][i%4]})`;
      // bearing ray: the constraint that makes a single-receiver fix possible at all
      if (t.azimuth_deg != null) {
        const a = t.azimuth_deg*Math.PI/180, L = Math.max(W,H)/sc;
        ctx.strokeStyle=col; ctx.globalAlpha=.45; ctx.setLineDash([2,4]); ctx.beginPath();
        ctx.moveTo(X(rxp[0]),Y(rxp[1]));
        ctx.lineTo(X(rxp[0]+L*Math.cos(a)), Y(rxp[1]+L*Math.sin(a)));
        ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1;
      }
      const trail = (h.trails||{})[String(t.track_id)] || [];
      if (trail.length > 1) {
        ctx.strokeStyle=col; ctx.lineWidth=2; ctx.beginPath();
        trail.forEach((p,j) => j ? ctx.lineTo(X(p.x),Y(p.y)) : ctx.moveTo(X(p.x),Y(p.y)));
        ctx.stroke();
      }
      // per-detection dots, radius scaled by that fix's own range rate
      ctx.fillStyle=col;
      trail.forEach(p => { ctx.beginPath(); ctx.arc(X(p.x),Y(p.y), 3+Math.min(6,Math.abs(p.v)), 0, 7); ctx.fill(); });
      if (t.position) {
        ctx.strokeStyle=col; ctx.lineWidth=2; ctx.beginPath();
        ctx.arc(X(t.position[0]),Y(t.position[1]),11,0,7); ctx.stroke();
        ctx.font="600 10.5px IBM Plex Mono, monospace";
        ctx.fillText(`TRK-${String(t.track_id).padStart(3,"0")}  ${fmt(t.bistatic_velocity_mps,1)} m/s`,
                     X(t.position[0])+14, Y(t.position[1])-4);
      }
    });

    // gNB
    ctx.strokeStyle="oklch(0.80 0.15 75)"; ctx.lineWidth=2; ctx.beginPath();
    ctx.moveTo(X(tx[0])-9,Y(tx[1])+15); ctx.lineTo(X(tx[0]),Y(tx[1])-11); ctx.lineTo(X(tx[0])+9,Y(tx[1])+15); ctx.closePath(); ctx.stroke();
    ctx.fillStyle="oklch(0.80 0.15 75)"; ctx.font="600 11px IBM Plex Mono, monospace"; ctx.textAlign="center";
    ctx.fillText("gNB · TX", X(tx[0]), Y(tx[1])+34);
    ctx.font="9.5px IBM Plex Mono, monospace"; ctx.fillStyle="oklch(0.6 0.01 240)";
    ctx.fillText(`(${fmt(tx[0],0)}, ${fmt(tx[1],0)}) m`, X(tx[0]), Y(tx[1])+47);
    // receiver
    ctx.strokeStyle="oklch(0.78 0.19 150)"; ctx.lineWidth=2.2; ctx.beginPath();
    ctx.arc(X(rxp[0]),Y(rxp[1]),15,0,7); ctx.stroke();
    ctx.fillStyle="oklch(0.78 0.19 150)"; ctx.beginPath(); ctx.arc(X(rxp[0]),Y(rxp[1]),3,0,7); ctx.fill();
    ctx.font="600 11px IBM Plex Mono, monospace";
    ctx.fillText("X410 · RX", X(rxp[0]), Y(rxp[1])+34);
    ctx.textAlign="left";
    ctx.fillStyle="oklch(0.85 0.01 240 / 0.45)"; ctx.font="9.5px IBM Plex Mono, monospace";
    ctx.fillText("fix = bearing ray ∩ bistatic range ellipse (single receiver)", 12, H-12);
  });
}

const ACQ_CHAIN = ["SEARCHING","PBCH_LOCKED","SIB1_DECODED","PDCCH_LOCKED",
                  "CORESET_VERIFIED","CELL_CONFIGURED","DL_CONVERGED","UL_CONVERGED","TRACKING"];

// What the receiver has worked out for itself. Everything here is a verdict it reached from the
// air -- not a value it was configured with -- so "waiting" is a real state, not a missing field.
function discoveryPanel() {
  const s = (state.log && state.log.stats) || {};
  const wrap = el("div", "panel");
  wrap.appendChild(el("div", "panel-h", "Acquisition & blind discovery"));

  const chain = el("div", "acq");
  const walked = new Set(s.acq_path || []);
  const now = s.acq_state;
  ACQ_CHAIN.forEach((name, i) => {
    if (i) chain.appendChild(el("span", "arr", "\u2192"));
    let cls = "st";
    if (name === now) cls += " now"; else if (walked.has(name)) cls += " hit";
    chain.appendChild(el("span", cls, name));
  });
  if (now === "LOST" || walked.has("LOST")) {
    chain.appendChild(el("span", "arr", "\u2192"));
    chain.appendChild(el("span", now === "LOST" ? "st lost" : "st lost", "LOST"));
  }
  wrap.appendChild(chain);

  const facts = el("div", "facts");
  const fact = (k, v, cls) => {
    const d = el("div", "fact");
    d.appendChild(el("div", "k", k));
    d.appendChild(el("div", "v " + (cls || (v === "waiting" ? "wait" : "")), v));
    facts.appendChild(d);
  };
  // Scan progress first: before sync this is the only thing moving, and a dashboard that shows
  // nothing while the receiver sweeps 300 raster points looks broken when it is working.
  if (s.gscn == null) {
    fact("Blind scan", s.scan_count ? s.scan_count + " raster pts | at GSCN " + s.scan_gscn : "starting");
    fact("SSB candidates", s.pbch_attempts ? s.pbch_attempts + " PBCH tries / " + (s.polar_attempts||0) + " polar"
                                           : "none yet", s.pbch_attempts ? "ok" : "");
    if (s.synch_failed) fact("Sync attempts failed", String(s.synch_failed), "bad");
  }
  fact("Cell", s.gscn != null ? "GSCN " + s.gscn + " sc " + s.ssb_sc : "searching");
  fact("Carrier offset", s.cfo_hz != null ? s.cfo_hz + " Hz" : "waiting");
  fact("Carrier check", s.carrier || "waiting", s.carrier === "CONFIRMED" ? "ok" : s.carrier ? "bad" : "");
  const ss = s.search_space || {};
  const ssKeys = Object.keys(ss);
  fact("Search space", ssKeys.length ? ssKeys.map(k => k.replace(/\(.*\)/, "") + " AL{" + ss[k] + "}").join("  ") : "waiting",
       ssKeys.length ? "ok" : "");
  const scr = s.scrambling || {};
  const scrKeys = Object.keys(scr);
  fact("PDCCH scrambling", scrKeys.length ? "n_id " + scr[scrKeys[0]] + " confirmed" : "waiting", scrKeys.length ? "ok" : "");
  fact("Rank", s.rank ? s.rank.layers + " layer" + (s.rank.layers > 1 ? "s" : "") + " " + s.rank.probe.toLowerCase() : "waiting",
       s.rank ? (s.rank.probe === "CORROBORATED" ? "ok" : "bad") : "");
  fact("DL config", s.converged ? "S" + s.converged.S + " L" + s.converged.L + " mask" + s.converged.mask + " tbl" + s.converged.table : "searching",
       s.converged ? "ok" : "");
  if (s.retune) fact("Retune needed", s.retune.replace(/[{}\"]/g, "").slice(0, 60), "bad");
  wrap.appendChild(facts);

  if (s.per_rnti) {
    const p = el("div", "facts");
    const d = el("div", "fact"); d.style.minWidth = "100%";
    d.appendChild(el("div", "k", "Per-UE downlink (CRC-OK / decoded)"));
    d.appendChild(el("div", "v", s.per_rnti));
    p.appendChild(d); wrap.appendChild(p);
  }
  return wrap;
}

function decoderPanel() {
  const log = state.log || {}, s = log.stats || {}, seen = log.decoder_seen || {};
  const row = el("div", "row");
  for (const [key, title, rate] of [["dl", "DL decoder", s.dl_tb_rate], ["ul", "UL decoder", s.ul_rate]]) {
    const age = seen[key] != null ? Math.max(0, state.now - seen[key]) : null;
    const ok = s[key + "_ok"], tried = s[key + "_try"];
    const fresh = age != null && age < 5;
    const count = tried != null ? `${ok} CRC-OK / ${tried} completed TBs` : "waiting for worker counters";
    const recent = s[key + "_recent_rate"];
    row.appendChild(card(title, rate != null ? fmt(rate, 1) + "%" : "-",
      fresh ? "good" : "warn",
      count + (age != null ? ` | ${fresh ? "LIVE" : "STALE"} ${fmt(age,1)}s` : "") +
      (recent != null ? ` | recent ${fmt(recent,1)}%` : "")));
  }
  const drops = (key) => s[key + "_drop_stale"] == null ? "-" :
    `${s[key + "_drop_stale"]} stale / ${s[key + "_drop_full"]} full`;
  row.appendChild(card("Queue drops", "DL / UL", null, `DL ${drops("dl")} | UL ${drops("ul")}`));
  return row;
}

const RENDER = [tabHealth, tabDL, tabUL, tabTracking, tabConfig];

function renderChrome() {
  const nav = document.getElementById("tabs"); nav.textContent = "";
  TABS.forEach((t,i) => {
    const b = el("button", i===tab?"active":null, t);
    b.onclick = () => { tab = i; render(); };
    nav.appendChild(b);
  });
  const sel = document.getElementById("rxsel");
  const ids = state ? Object.keys(state.receivers) : [];
  if (sel.dataset.ids !== ids.join()) {
    sel.dataset.ids = ids.join(); sel.textContent = "";
    ids.forEach(id => { const o = el("option",null,id); o.value = id; sel.appendChild(o); });
    sel.onchange = () => { rxId = sel.value; render(); };
  }
  if (ids.length && (!rxId || !ids.includes(rxId))) rxId = ids[0];
  sel.value = rxId || "";

  const st = document.getElementById("status"); st.textContent = "";
  if (pollError) st.appendChild(chip("chip-red", "DASHBOARD DISCONNECTED"));
  const r = rep(), h = rx();
  const age = h && h.last_seen ? state.now - h.last_seen : null;
  const lim = staleLimit(h);
  st.appendChild(chip(age==null?"chip-grey":age<lim?"chip-green":"chip-red",
                      age==null?"NO DATA":age<lim?"LIVE":"STALE"));
  if (r) {
    const cfo = (r.sync&&r.sync.cfo||{}).cfo_hz;
    st.appendChild(chip(Math.abs(cfo||0)<300?"chip-green":"chip-red", "CFO "+fmt(cfo,0)+" Hz"));
    const s = el("span","stat"); s.innerHTML = `CPI <b>${h.cpi_count}</b>`; st.appendChild(s);
    const d = el("span","stat"); d.innerHTML = `DET <b>${(r.detections||[]).length}</b>`; st.appendChild(d);
    const t = el("span","stat"); t.innerHTML = `TRK <b>${(r.tracks||[]).length}</b>`; st.appendChild(t);
  }
}

function render() {
  renderChrome();
  const v = document.getElementById("view");
  // Preserve scroll across the rebuild, per pane, in DOM order. `stick` means the user was at the
  // bottom, so keep them there as lines arrive; otherwise hold the exact offset so they can read.
  const prev = [...v.querySelectorAll(".log")].map(n => ({
    top: n.scrollTop, stick: n.scrollHeight - n.scrollTop - n.clientHeight < 24 }));
  v.textContent = "";
  if (state && state.log) v.appendChild(discoveryPanel());
  if (state && state.log) v.appendChild(decoderPanel());
  if (!state || !Object.keys(state.receivers).length) {
    const live = state.log && state.log.last_line_at && (state.now - state.log.last_line_at) < 10;
    v.appendChild(el("div","empty", live
      ? "receiver is running and writing logs — no sensing reports yet (CPIs only start after sync; the panel above is live)"
      : "no receiver activity — no log lines and no sensing reports"));
    return;
  }
  RENDER[tab](v);
  [...v.querySelectorAll(".log")].forEach((n, i) => {
    const p = prev[i];
    if (!p) { n.scrollTop = n.scrollHeight; return; }   // new pane: start at the newest line
    n.scrollTop = p.stick ? n.scrollHeight : p.top;
  });
}

async function poll() {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 4000);
  try {
    const res = await fetch("/state", {cache: "no-store", signal: controller.signal});
    if (!res.ok) throw new Error("HTTP " + res.status);
    state = await res.json();
    pollError = null;
    safeRender();
  } catch (e) {
    pollError = String(e);
    renderChrome();
  } finally {
    clearTimeout(timeout);
    setTimeout(poll, 1000);
  }
}
// A thrown render() leaves the view cleared, so the page goes blank and the operator has no idea
// why. Surface the failure where they are looking instead of in a console they may not have open.
window.addEventListener("error", (e) => {
  const v = document.getElementById("view");
  if (!v) return;
  const box = el("div", "panel");
  box.appendChild(el("div", "panel-h", "Dashboard error"));
  const p = el("pre", "log");
  p.textContent = (e.message || "error") + "\n" + (e.filename || "") + ":" + (e.lineno || "?") +
                  "\n\nThe receiver is unaffected; this is the page failing to draw.";
  p.style.cssText = "padding:12px 14px;margin:0;white-space:pre-wrap;color:var(--red)";
  box.appendChild(p);
  v.textContent = ""; v.appendChild(box);
});
function safeRender() {
  try { render(); }
  catch (err) {
    const v = document.getElementById("view");
    if (v) {
      v.textContent = "";
      const box = el("div", "panel");
      box.appendChild(el("div", "panel-h", "Dashboard error"));
      const p = el("pre");
      p.textContent = String(err && err.stack || err) +
                      "\n\nThe receiver is unaffected; this is the page failing to draw.";
      p.style.cssText = "padding:12px 14px;margin:0;white-space:pre-wrap;color:var(--red);font-size:11.5px";
      box.appendChild(p); v.appendChild(box);
    }
  }
}
safeRender(); poll();
window.addEventListener("resize", () => render());
</script>
</body>
</html>
