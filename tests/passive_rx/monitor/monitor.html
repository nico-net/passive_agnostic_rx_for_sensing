<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receiver Dashboard</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2; --surface: #fcfcfb; --surface-2: #efeeea; --border: #dddcd6;
  --text: #0b0b0b; --text-2: #52514e; --muted: #75746f;
  --accent: #2a78d6; --accent-ink: #1c5cab;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --bad: #d03b3b; --idle: #9a9993;
  --good-bg: #e6f4e6; --warn-bg: #fdf3dc; --bad-bg: #fbe7e7; --idle-bg: #efeeea;
  --grid: #e7e6e1; --code: #f0efec;
  --seq0: #f4f8fd; --seq1: #cde2fb; --seq2: #86b6ef; --seq3: #3987e5; --seq4: #1c5cab; --seq5: #0d366b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #383835;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #94938b;
    --accent: #3987e5; --accent-ink: #86b6ef;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --good-bg: #16301a; --warn-bg: #3a2f12; --bad-bg: #3d1b1b; --idle-bg: #2a2a28;
    --grid: #2c2c2a; --code: #242422;
    --seq0: #1d2633; --seq1: #184f95; --seq2: #256abf; --seq3: #3987e5; --seq4: #86b6ef; --seq5: #cde2fb;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #383835;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #94938b;
  --accent: #3987e5; --accent-ink: #86b6ef;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --good-bg: #16301a; --warn-bg: #3a2f12; --bad-bg: #3d1b1b; --idle-bg: #2a2a28;
  --grid: #2c2c2a; --code: #242422;
  --seq0: #1d2633; --seq1: #184f95; --seq2: #256abf; --seq3: #3987e5; --seq4: #86b6ef; --seq5: #cde2fb;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent-ink); }
button, select, input { font: inherit; color: inherit; }
button { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
select, input[type=text], input[type=number], input[type=search] { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
header { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
header .grow { flex: 1; }
.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-size: 12px; border: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; }
.badge.live { background: var(--good-bg); border-color: var(--good); }
.badge.off { background: var(--idle-bg); }
.label { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--text-2); overflow-wrap: anywhere; }
header .label { max-width: 46ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#banner { display: none; padding: 8px 16px; border-bottom: 1px solid var(--border); }
#banner.on { display: block; }
#banner .al { margin: 2px 0; }
.layout { display: flex; min-height: calc(100vh - 52px); }
nav { width: 210px; flex: none; background: var(--surface); border-right: 1px solid var(--border); padding: 10px 8px; position: sticky; top: 52px; align-self: flex-start; height: calc(100vh - 52px); overflow: auto; }
nav a { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 6px; text-decoration: none; color: var(--text); }
nav a.on { background: var(--surface-2); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
nav a .ico { width: 18px; text-align: center; }
nav .sep { border-top: 1px solid var(--border); margin: 8px 4px; }
main { flex: 1; min-width: 0; padding: 16px; }
.page { display: none; }
.page.on { display: block; }
h2 { font-size: 18px; margin: 0 0 4px; }
h3 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 6px; align-items: center; }
p.lead { color: var(--text-2); margin: 0 0 14px; max-width: 900px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; min-width: 0; margin-bottom: 12px; }
.grid > .card, .grid2 > .card { margin-bottom: 0; }
.tile { cursor: pointer; border-left: 6px solid var(--idle); }
.tile.ok { border-left-color: var(--good); } .tile.warn { border-left-color: var(--warn); } .tile.bad { border-left-color: var(--bad); }
.tile .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile .val { font-size: 26px; font-weight: 650; margin: 2px 0; font-variant-numeric: tabular-nums; }
.tile .sent { color: var(--text-2); min-height: 40px; }
.tile .more { font-size: 12.5px; }
.st { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.st.ok { background: var(--good-bg); } .st.warn { background: var(--warn-bg); } .st.bad { background: var(--bad-bg); } .st.idle { background: var(--idle-bg); color: var(--text-2); }
.st .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.st.ok .dot { background: var(--good); } .st.warn .dot { background: var(--warn); } .st.bad .dot { background: var(--bad); } .st.idle .dot { background: var(--idle); }
.stages { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
.stage { flex: 1 1 110px; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; background: var(--surface-2); font-size: 12.5px; }
.stage.done { background: var(--good-bg); border-color: var(--good); }
.stage.cur { box-shadow: 0 0 0 2px var(--accent); }
.stage b { display: block; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-weight: 600; color: var(--text-2); font-size: 12.5px; position: sticky; top: 0; background: var(--surface); cursor: default; }
th.sort { cursor: pointer; }
td.num, th.num { text-align: right; }
.tablewrap { overflow: auto; max-height: 520px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; }
.kv .k { color: var(--text-2); }
.kpis { display: flex; flex-wrap: wrap; gap: 18px; margin: 4px 0 8px; }
.kpi .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.kpi .k { font-size: 12px; color: var(--text-2); display: flex; gap: 4px; align-items: center; }
.empty { border: 1px dashed var(--border); border-radius: 8px; padding: 14px; color: var(--text-2); background: var(--surface-2); }
.empty b { color: var(--text); }
.i { display: inline-flex; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--muted); color: var(--text-2); font-size: 10.5px; font-weight: 700; align-items: center; justify-content: center; cursor: help; font-style: normal; flex: none; background: transparent; padding: 0; }
.i:focus { outline: 2px solid var(--accent); }
#tip { position: fixed; z-index: 50; max-width: 360px; background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: 0 4px 18px rgba(0,0,0,.18); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; display: none; pointer-events: none; }
#tip .t { font-weight: 650; margin-bottom: 2px; }
#tip .r { color: var(--text-2); }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 8px; }
.toolbar .grow { flex: 1; }
.small { font-size: 12px; color: var(--text-2); }
.chart { width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .axis text { fill: var(--text-2); font-size: 11px; }
.chart .gridl { stroke: var(--grid); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--text-2); margin: 2px 0; }
.legend .sw { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.legend .sw.box { height: 10px; width: 10px; }
.ev { display: grid; grid-template-columns: 70px 22px 1fr; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
.ev .tt { color: var(--text-2); font-variant-numeric: tabular-nums; }
.ico-ok::before { content: "\2713"; color: var(--good); font-weight: 700; }
.ico-warn::before { content: "!"; color: #b07900; font-weight: 800; }
.ico-bad::before { content: "\2715"; color: var(--bad); font-weight: 700; }
.ico-info::before { content: "\2022"; color: var(--muted); }
.statebadge { font-size: 12px; white-space: nowrap; }
.statebadge.confirmed::before { content: "\2713 "; color: var(--good); font-weight: 700; }
.statebadge.provisional::before { content: "~ "; color: #b07900; font-weight: 700; }
.statebadge.unknown::before { content: "? "; color: var(--muted); font-weight: 700; }
.statebadge.removed::before { content: "\2715 "; color: var(--bad); font-weight: 700; }
pre.log { background: var(--code); border-radius: 8px; padding: 8px; overflow: auto; max-height: 70vh; font-size: 12px; line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
pre.log .hl { background: var(--warn-bg); }
pre.log .hb { background: var(--bad-bg); }
pre.log mark { background: #fde68a; color: #000; }
#replay { display: none; align-items: center; gap: 8px; padding: 6px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); flex-wrap: wrap; }
#replay.on { display: flex; }
#replay input[type=range] { flex: 1; min-width: 160px; }
.notice { border-left: 4px solid var(--accent); background: var(--surface-2); padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
.bar { height: 10px; border-radius: 3px; background: var(--s1); display: inline-block; vertical-align: middle; }
details summary { cursor: pointer; color: var(--accent-ink); }
.gl dt { font-weight: 650; margin-top: 10px; }
.gl dd { margin: 2px 0 0 0; color: var(--text-2); max-width: 900px; }
.menu-btn { display: none; }
@media (max-width: 860px) {
  .layout { display: block; }
  nav { position: static; width: auto; height: auto; display: none; border-right: none; border-bottom: 1px solid var(--border); }
  nav.open { display: block; }
  .menu-btn { display: inline-block; }
  .grid2 { grid-template-columns: 1fr; }
  main { padding: 12px 16px; }
  header h1 { font-size: 14px; }
}
@media (forced-colors: active) { .tile { border-left-width: 6px; } }
</style>
</head>
<body>
<header>
  <button class="menu-btn" id="menuBtn" aria-label="Open navigation">&#9776;</button>
  <h1>Passive 5G NR receiver &middot; dashboard</h1>
  <label class="small">Run <select id="runSel" aria-label="Run"></select></label>
  <label class="small">Cell <select id="cellSel" aria-label="Cell (PCI and frequency)"></select></label>
  <span id="liveBadge" class="badge off">-</span>
  <span class="grow"></span>
  <span id="labelBadge" class="label" title="Evidence label of this run (PROJECT_MEMORY 0.1)"></span>
  <button id="themeBtn" title="Switch light / dark theme" aria-label="Switch theme">Theme</button>
</header>
<div id="banner" role="alert"></div>
<div id="replay" aria-label="Replay controls">
  <b>Replay</b>
  <button id="rpPlay">&#9654; Play</button>
  <select id="rpSpeed" aria-label="Replay speed"><option value="1">1x</option><option value="10" selected>10x</option><option value="60">60x</option></select>
  <input id="rpSlider" type="range" min="0" max="100" step="1" value="0" aria-label="Replay time">
  <span id="rpTime" class="mono">t = 0 s</span>
  <button id="rpExit" title="Show the whole run again">Show whole run</button>
</div>
<div class="layout">
<nav id="nav" aria-label="Sections">
  <a href="#home" data-p="home"><span class="ico">&#8962;</span>Home</a>
  <a href="#dl" data-p="dl"><span class="ico">&#8595;</span>Downlink (DL)</a>
  <a href="#ul" data-p="ul"><span class="ico">&#8593;</span>Uplink (UL)</a>
  <a href="#sensing" data-p="sensing"><span class="ico">&#8776;</span>Sensing export</a>
  <a href="#cell" data-p="cell"><span class="ico">&#9673;</span>Cell information</a>
  <a href="#settings" data-p="settings"><span class="ico">&#9881;</span>Settings</a>
  <div class="sep"></div>
  <a href="#perf" data-p="perf"><span class="ico">&#9201;</span>Performance &amp; timing</a>
  <a href="#spectrum" data-p="spectrum"><span class="ico">&#8767;</span>Spectrum &amp; scan</a>
  <a href="#history" data-p="history"><span class="ico">&#8644;</span>Run history &amp; compare</a>
  <a href="#logs" data-p="logs"><span class="ico">&#9776;</span>Logs</a>
  <a href="#glossary" data-p="glossary"><span class="ico">?</span>Glossary</a>
  <div class="sep"></div>
  <div class="small" style="padding:0 10px">Read-only view. The dashboard never starts, stops or reconfigures the receiver.</div>
</nav>
<main id="main">
  <section class="page" id="p-home"></section>
  <section class="page" id="p-dl"></section>
  <section class="page" id="p-ul"></section>
  <section class="page" id="p-sensing"></section>
  <section class="page" id="p-cell"></section>
  <section class="page" id="p-settings"></section>
  <section class="page" id="p-perf"></section>
  <section class="page" id="p-spectrum"></section>
  <section class="page" id="p-history"></section>
  <section class="page" id="p-logs"></section>
  <section class="page" id="p-glossary"></section>
</main>
</div>
<div id="tip" role="tooltip"></div>
<script>
"use strict";
/* ------------------------------------------------------------------ help texts: (i) tooltips + glossary */
const HELP = {
  radio: ["Radio", "Whether IQ samples are streaming from the X410 without stalls, and the power per antenna.", "dBFS (power relative to ADC full scale)", "Good: no RF stall, antennas within ~3 dB of each other, well below 0 dBFS.", "run.log RFSTALL, CHPOW (ISAC_USRP_CHPOW_S=N), RFCHAN"],
  sync: ["Sync position", "How far the blind acquisition chain has got, from cell search to an uplink lock.", "stage", "Good: RNTIs or further, and no LOST event.", "run.log Initial sync / MIB / SIB1 / CORESET / ACQ_STATE lines, ISAC_METRICS acq_*"],
  dl: ["Downlink CRC-OK", "Share of decoded downlink grants (PDSCH) whose transport block passed CRC.", "%", "Higher is better; >= 80 % green, 50-80 % amber (thresholds in Settings).", "ISAC_METRICS pdschq_crc_ok / pdschq_decoded per 20 s window, else per-grant observations"],
  ul: ["Uplink", "Uplink layout lock and PUSCH CRC-OK share.", "%", "A lock is needed before PUSCH can be interpreted.", "run.log ULLAYOUT lines, pusch_passive[...], ISAC_METRICS pusch_try/pusch_crc_ok"],
  decode: ["Decode health", "Time to decode one PDSCH grant and the share of grants dropped because their IQ expired before decoding (stale).", "ms / %", "Target p99 <= 0.5 ms (Settings); stale < 10 %.", "run.log PDTIMCLS / PDTIMPCT / EVMGRANT dec_us; ISAC_METRICS pdschq_drop_stale"],
  compute: ["Compute", "GPU discovery budget used, receiver CPU, host temperature and free memory.", "% / C / GB", "GPU budget < 95 %, RAM above 16 GB, temperature below 80 C.", "ISAC_METRICS gpu_budget_used_pct; /proc and /sys of this host (live only)"],
  crc_pct: ["CRC-OK %", "Transport blocks whose 24-bit CRC passed, divided by blocks decoded.", "%", "Depends on SNR and MCS; low-MCS grants should be near 100 %.", "per-grant observations (obs.jsonl) or EVMGRANT lines"],
  grants_s: ["Grants per second", "PDSCH grants the receiver decoded per second (recent 20 s window).", "1/s", "Follows cell load; 0 means no RNTI is solved yet.", "ISAC_METRICS pdschq_decoded deltas"],
  tput: ["Throughput estimate", "Sum of transport-block sizes with CRC OK per second: what the receiver actually recovered, not the cell's capacity.", "bit/s", "-", "TBS x CRC-OK / time, per-grant source"],
  mcs_bucket: ["CRC-OK by MCS bucket", "Grants grouped by modulation-and-coding scheme index: 0-4 (robust QPSK), 5-9, 10-16 (16QAM), 17-27 (64QAM and up).", "%", "Expect falling success with MCS; a low 0-4 bucket points at sync/identity problems, not SNR.", "per-grant source"],
  layers: ["CRC-OK by layers (Nl)", "Grants grouped by the number of spatial layers (MIMO rank) 1-4.", "%", "Multi-layer grants are harder (per-layer SNR).", "per-grant source"],
  latency: ["Decode latency", "Wall time of one PDSCH decode (FEP + channel estimation + demodulation + LDPC).", "ms", "Target: p99 below the Settings target (0.5 ms).", "PDTIMCLS real (best), PDTIMPCT sum, or EVMGRANT dec_us"],
  stale: ["Stale drops", "Grants whose IQ samples expired in the ring before a worker decoded them.", "% of queued", "< 10 % (Settings). High values = decode backlog.", "ISAC_METRICS pdschq_drop_stale / pdschq_queued"],
  drop_full: ["Full drops", "Jobs evicted because the queue was full (scan queue = PDCCH scanning, PDSCH queue = data decoding).", "% of queued", "Scan queue <= 2.5 % (4-RX gate).", "ISAC_METRICS scanq_drop_full, pdschq_drop_full"],
  pdcch: ["PDCCH monitoring", "Occasions = slots the control channel was searched; candidates = blind decode attempts; accepted DCIs = candidates passing CRC and all false-positive gates.", "count", "Occasions must grow steadily; flat = no slots reach the monitor.", "blind PDCCH monitor summary line, ISAC_METRICS pdcch_*"],
  rnti_table: ["Per-RNTI table", "One row per user identity (RNTI) the receiver recovered from control messages.", "-", "-", "per-grant source"],
  retry: ["Recovery / retry share", "Share of decode bodies that were retries or solver probes rather than first real decodes.", "%", "Low is better; probes are part of blind interpretation.", "PDTIMCLS real/retry/probe counts"],
  ul_lock: ["UL layout lock", "The receiver must learn the uplink bandwidth part (size and start) before it can place PUSCH; it does that from DCI 0_1 statistics and confirms with PUSCH CRC.", "-", "LOCKED is best; PROVISIONAL = size known, start not CRC-confirmed.", "run.log ULLAYOUT LOCK / BWP_LOCK / CRC_LOCK / PRIOR_* / STATS"],
  pusch: ["PUSCH CRC-OK", "Uplink transport blocks whose CRC passed out of attempts.", "%", "Needs UL lock and enough UL path gain.", "pusch_passive[...] line, ISAC_METRICS pusch_try/pusch_crc_ok"],
  sense: ["Sensing export", "Raw records the receiver publishes for an external sensing application: per-slot reference-signal records and channel snapshots (CFR). No sensing algorithm runs in the receiver.", "records/s", "Drops and I/O errors should be 0.", "records_path (schema 2 JSONL), cfr_path (NRCF v1), ISAC_METRICS sense_*"],
  cfr: ["Channel frequency response (CFR)", "Estimated channel per subcarrier and antenna from one reference signal occurrence. Magnitude in dB, phase in radians.", "dB / rad", "Smooth curves; deep notches = frequency-selective fading.", "cfr_path NRCF v1 frames (strided to 256 points)"],
  evidence: ["Evidence state", "confirmed = proven by a CRC or a decoded field; provisional = inferred, may change; unknown = not learned yet.", "-", "-", "parser of this dashboard"],
  gpu: ["GPU budget", "Share of the GPU time budget used by background discovery (CSI-RS, PDCCH nID).", "%", "< 95 %.", "ISAC_METRICS gpu_budget_used_pct"],
  chpow: ["Per-antenna power", "Mean received power per X410 channel.", "dBFS", "All antennas similar; near the noise floor = antenna or cable fault.", "SENSING: CHPOW (ISAC_USRP_CHPOW_S=N)"],
  scanlag: ["Scan lag", "Largest delay in slots between a PDCCH occasion and its processing (scan queue), and between a grant and its decode (PDSCH queue).", "slots", "Must stay well below one frame (20 slots at 30 kHz).", "ISAC_METRICS scanq_max_lag, pdschq_max_lag"],
};
const GLOSSARY = [
  ["PCI (physical cell identity)", "Number 0-1007 that identifies a cell on air; found from the PSS/SSS sync signals."],
  ["SSB (synchronisation signal block)", "Periodic block with PSS, SSS and PBCH that a receiver uses to find a cell and its timing."],
  ["GSCN", "Index of the frequency raster on which SSBs may be placed; the blind scan searches over it."],
  ["MIB / PBCH", "Master information block carried by the broadcast channel: frame number, CORESET#0 and SS#0 indices, k_SSB."],
  ["SIB1", "System information block 1: operator code (PLMN), cell identity, carrier geometry and TDD pattern. Some cells broadcast it without the carrier part."],
  ["PLMN (MCC-MNC)", "Mobile country code and network code: identifies the operator."],
  ["CORESET", "Control resource set: the time-frequency region where control messages (PDCCH) are sent. CORESET#0 comes from the MIB; dedicated CORESETs are discovered blindly."],
  ["Search space (SS)", "Rules for where and at which aggregation levels (AL) the control messages may be placed in a CORESET."],
  ["PDCCH / DCI", "Downlink control channel carrying downlink control information: the grants telling a phone where its data is."],
  ["RNTI", "Radio network temporary identifier: the identity a grant is addressed to (C-RNTI = one user, SI-RNTI = system information, RA-RNTI = random access)."],
  ["PDSCH / PUSCH", "Downlink / uplink shared channel: the user data that a grant schedules."],
  ["MCS", "Modulation and coding scheme index: higher = more bits per symbol, needs more SNR."],
  ["Layers (Nl, rank)", "Number of parallel MIMO streams in one grant (1-4)."],
  ["CRC", "Checksum of a transport block; CRC OK means the block was decoded correctly."],
  ["HARQ / RV", "Hybrid retransmission: a failed block is resent with another redundancy version (RV)."],
  ["TBS", "Transport block size in bits."],
  ["Stale drop", "A queued decode whose IQ samples were overwritten in the ring before a worker got to it."],
  ["Full drop", "A queued job evicted because the queue was full."],
  ["CFR", "Channel frequency response: complex channel per subcarrier and antenna, exported for sensing."],
  ["CSI-RS / TRS", "Channel-state reference signals; the tracking reference signal (TRS) is a periodic CSI-RS found by blind search."],
  ["DM-RS", "Demodulation reference signal inside PDCCH/PDSCH/PUSCH, used for channel estimation; its scrambling id is learned blindly."],
  ["BWP", "Bandwidth part: the subset of the carrier a phone uses (size @ start, in resource blocks)."],
  ["TDD pattern", "Which slots carry downlink or uplink in time-division duplex."],
  ["Technique D", "The receiver's blind solver that finds how to interpret a user's grants (time allocation, DM-RS, MCS table) by trying hypotheses until the transport-block CRC passes."],

/* tooltips: hover, focus and tap */

/* ------------------------------------------------------------------ charts (inline SVG, one y axis each) */
let chartSeq = 0;
const CHARTS = {};
function lineChart(o) {
  // o: {title, series:[{name, color, pts:[[x,y],...]}], ylab, xlab, ymin, ymax, refs:[{y,label}], fmtY, fmtX, height}
  const id = "c" + (++chartSeq);
  const W = 640, H = o.height || 200, L = 46, R = 12, T = 10, B = 28;
  const all = o.series.flatMap((s) => s.pts.filter((p) => isNum(p[0]) && isNum(p[1])));
  if (!all.length) return empty(o.emptyTitle || "No data yet", o.emptyWhy || "This chart fills when the source starts producing values.");
  let x0 = Math.min(...all.map((p) => p[0])), x1 = Math.max(...all.map((p) => p[0]));
  if (x1 === x0) { x1 = x0 + 1; }
  let y0 = o.ymin != null ? o.ymin : Math.min(0, ...all.map((p) => p[1])), y1 = o.ymax != null ? o.ymax : Math.max(...all.map((p) => p[1]), ...(o.refs || []).map((r) => r.y));
  if (y1 <= y0) y1 = y0 + 1;
  const X = (x) => L + (x - x0) / (x1 - x0) * (W - L - R), Y = (y) => T + (1 - (Math.min(Math.max(y, y0), y1) - y0) / (y1 - y0)) * (H - T - B);
  const fy = o.fmtY || ((v) => +v.toFixed(Math.abs(y1 - y0) < 5 ? 2 : 0));
  const fx = o.fmtX || ft;
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4; g += `<line class="gridl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${esc(fy(v))}</text>`; }
  for (let i = 0; i <= 4; i++) { const v = x0 + (x1 - x0) * i / 4; g += `<text x="${X(v)}" y="${H - 8}" text-anchor="middle">${esc(fx(v))}</text>`; }
  let refs = "";
  for (const r of o.refs || []) refs += `<line x1="${L}" x2="${W - R}" y1="${Y(r.y)}" y2="${Y(r.y)}" stroke="var(--bad)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W - R}" y="${Y(r.y) - 4}" text-anchor="end" fill="var(--text-2)" font-size="11">${esc(r.label)}</text>`;
  let paths = "";
  o.series.forEach((s, i) => {
    const pts = s.pts.filter((p) => isNum(p[0]) && isNum(p[1]));
    if (!pts.length) return;
    const d = pts.map((p, j) => (j ? "L" : "M") + X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join("");
    paths += `<path d="${d}" fill="none" stroke="var(${s.color || SER[i % 8]})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (pts.length < 40) paths += pts.map((p) => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3" fill="var(${s.color || SER[i % 8]})" stroke="var(--surface)" stroke-width="1.5"/>`).join("");
  });
  CHARTS[id] = { o, X, Y, x0, x1, L, R, W, H, T, B, fy, fx };
  const legend = o.series.length > 1 ? `<div class="legend">${o.series.map((s, i) => `<span><span class="sw" style="background:var(${s.color || SER[i % 8]})"></span>${esc(s.name)}</span>`).join("")}</div>` : "";
  return `<div class="chart" data-chart="${id}">${legend}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title || "chart")}"><g class="axis">${g}</g>${refs}${paths}<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" style="display:none"/><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" class="hit"/></svg><div class="small">${esc(o.ylab || "")}${o.xlab ? " vs " + esc(o.xlab) : ""} <button class="pngbtn" data-png="${id}" title="Download this chart as PNG">PNG</button></div></div>`;
}
function barChart(o) {
  // o: {title, cats:[...], vals:[...], notes:[...], ymax, unit, color}
  const id = "c" + (++chartSeq);
  if (!o.vals.some(isNum)) return empty(o.emptyTitle || "No data yet", o.emptyWhy || "");
  const W = 640, H = o.height || 190, L = 40, R = 8, T = 16, B = 34;
  const y1 = o.ymax || Math.max(1, ...o.vals.filter(isNum));
  const n = o.cats.length, bw = (W - L - R) / n;
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = y1 * i / 4, y = T + (1 - i / 4) * (H - T - B); g += `<line class="gridl" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${+v.toFixed(y1 < 5 ? 1 : 0)}</text>`; }
  let bars = "";
  o.cats.forEach((c, i) => {
    const v = o.vals[i], x = L + i * bw + Math.max(1, bw * 0.15), w = Math.max(2, bw * 0.7 - 2);
    if (isNum(v)) {
      const h = (Math.min(v, y1) / y1) * (H - T - B), y = H - B - h;
      bars += `<path d="M${x},${H - B} V${y + Math.min(4, h)} q0,-4 4,-4 H${x + w - 4} q4,0 4,4 V${H - B} Z" fill="var(${o.colors ? o.colors[i] : (o.color || "--s1")})"><title>${esc(c)}: ${esc(o.fmt ? o.fmt(v) : v)}${o.notes && o.notes[i] ? " (" + esc(o.notes[i]) + ")" : ""}</title></path>`;
      if (n <= 16) bars += `<text x="${x + w / 2}" y="${y - 3}" text-anchor="middle" font-size="11" fill="var(--text-2)">${esc(o.fmt ? o.fmt(v) : v)}</text>`;
    }
    if (n <= 16 || i % Math.ceil(n / 16) === 0) bars += `<text x="${x + w / 2}" y="${H - B + 14}" text-anchor="middle" font-size="11" fill="var(--text-2)">${esc(c)}</text>`;
    if (o.notes && o.notes[i] && n <= 8) bars += `<text x="${x + w / 2}" y="${H - B + 27}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(o.notes[i])}</text>`;
  });
  CHARTS[id] = { o };
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title || "bar chart")}"><g class="axis">${g}</g>${bars}</svg><div class="small">${esc(o.ylab || "")} <button class="pngbtn" data-png="${id}" title="Download this chart as PNG">PNG</button></div></div>`;
}
/* crosshair + tooltip on line charts */
document.addEventListener("mousemove", (e) => {
  const svg = e.target.closest(".chart svg"); if (!svg) return;
  const id = svg.parentNode.dataset.chart, c = CHARTS[id]; if (!c || !c.X) return;
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  if (p.x < c.L || p.x > c.W - c.R) return;
  const xv = c.x0 + (p.x - c.L) / (c.W - c.L - c.R) * (c.x1 - c.x0);
  const xh = svg.querySelector(".xh"); xh.style.display = ""; xh.setAttribute("x1", p.x); xh.setAttribute("x2", p.x);
  const rows = c.o.series.map((s) => { let best = null; for (const q of s.pts) if (isNum(q[1]) && (best == null || Math.abs(q[0] - xv) < Math.abs(best[0] - xv))) best = q; return best ? `<div>${esc(s.name)}: <b>${esc(c.fy(best[1]))}</b>${c.o.unit ? " " + esc(c.o.unit) : ""}</div>` : ""; }).join("");
  tip.innerHTML = `<div class="t">${esc(c.fx(xv))}</div>${rows}`; tip.style.display = "block";
  tip.style.left = Math.min(innerWidth - 200, e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px";
});
document.addEventListener("mouseleave", () => {}, true);
document.addEventListener("mouseout", (e) => { const svg = e.target.closest && e.target.closest(".chart svg"); if (svg && !svg.contains(e.relatedTarget)) { tip.style.display = "none"; const xh = svg.querySelector(".xh"); if (xh) xh.style.display = "none"; } });
/* PNG export of a chart */
document.addEventListener("click", (e) => {
  const b = e.target.closest(".pngbtn"); if (!b) return;
  const svg = document.querySelector(`[data-chart="${b.dataset.png}"] svg`); if (!svg) return;
  const clone = svg.cloneNode(true);
  const vb = svg.viewBox.baseVal, scale = 2;
  clone.setAttribute("width", vb.width * scale); clone.setAttribute("height", vb.height * scale);
  let s = new XMLSerializer().serializeToString(clone);
  s = s.replace(/var\((--[\w-]+)\)/g, (m, v) => css(v) || "#888");
  s = s.replace("<svg", `<svg style="font: 11px sans-serif; background:${css("--surface")}"`);
  const img = new Image();
  img.onload = () => { const cv = document.createElement("canvas"); cv.width = vb.width * scale; cv.height = vb.height * scale; const x = cv.getContext("2d"); x.fillStyle = css("--surface"); x.fillRect(0, 0, cv.width, cv.height); x.drawImage(img, 0, 0); cv.toBlob((bl) => download(bl, "chart.png")); };

function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

/* tables with CSV/JSON export + sort */
const TABLES = {};
let tabSeq = 0;
function table(cols, rows, o = {}) {
  // cols: [{k, t, num, f, help}] rows: [{...}]
  if (!rows.length) return empty(o.emptyTitle || "Nothing yet", o.emptyWhy || "");
  const id = "t" + (++tabSeq);
  TABLES[id] = { cols, rows, name: o.name || "table" };
  const head = cols.map((c, i) => `<th class="${c.num ? "num " : ""}sort" data-t="${id}" data-c="${i}" scope="col">${esc(c.t)} ${c.help ? info(c.help) : ""}</th>`).join("");
  const body = rows.map((r) => "<tr>" + cols.map((c) => `<td class="${c.num ? "num" : ""}">${c.html ? c.html(r) : esc(c.f ? c.f(r[c.k], r) : (r[c.k] == null ? "" : r[c.k]))}</td>`).join("") + "</tr>").join("");
  return `<div class="toolbar"><span class="small">${rows.length} row(s)</span><span class="grow"></span><button data-csv="${id}">CSV</button><button data-jsonx="${id}">JSON</button></div><div class="tablewrap"${o.full ? ' style="max-height:none"' : ""}><table id="${id}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
document.addEventListener("click", (e) => {
  const c = e.target.closest("[data-csv]"), j = e.target.closest("[data-jsonx]"), th = e.target.closest("th.sort");
  if (c) { const t = TABLES[c.dataset.csv]; const lines = [t.cols.map((x) => x.t).join(",")].concat(t.rows.map((r) => t.cols.map((x) => { let v = r[x.k]; if (v && typeof v === "object") v = JSON.stringify(v); v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(","))); download(new Blob([lines.join("\n") + "\n"], { type: "text/csv" }), t.name + ".csv"); }
  if (j) { const t = TABLES[j.dataset.jsonx]; download(new Blob([JSON.stringify(t.rows, null, 1)], { type: "application/json" }), t.name + ".json"); }
  if (th && !e.target.closest(".i")) {
    const t = TABLES[th.dataset.t], col = t.cols[+th.dataset.c]; const dir = th.dataset.dir === "a" ? -1 : 1; th.dataset.dir = dir === 1 ? "a" : "d";
    const v = (r) => { const x = r[col.k]; return typeof x === "number" ? x : x == null ? -Infinity : String(x); };
    t.rows.sort((a, b) => (v(a) > v(b) ? 1 : v(a) < v(b) ? -1 : 0) * dir);
    const tb = document.querySelector("#" + th.dataset.t + " tbody");
    tb.innerHTML = t.rows.map((r) => "<tr>" + t.cols.map((cc) => `<td class="${cc.num ? "num" : ""}">${cc.html ? cc.html(r) : esc(cc.f ? cc.f(r[cc.k], r) : (r[cc.k] == null ? "" : r[cc.k]))}</td>`).join("") + "</tr>").join("");
  }
});

/* ------------------------------------------------------------------ state + polling */
let META = null, ST = null, RUNS = [], page = "home", runId = "primary", cellKey = "", replayT = null, playing = false, alertLog = [], lastAlertIds = new Set();
async function getJSON(u) { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText); return r.json(); }
async function loadRuns() {
  try { META = await getJSON("/api/runs"); RUNS = META.runs; } catch (e) { RUNS = []; }
  const sel = $("#runSel");
  sel.innerHTML = RUNS.length ? RUNS.map((r) => `<option value="${esc(r.id)}">${esc(r.name)}${r.live ? " (live)" : ""}</option>`).join("") : `<option value="primary">no run</option>`;
  if (!RUNS.find((r) => r.id === runId) && RUNS.length) runId = RUNS[0].id;
  sel.value = runId;
}
function qs() { const p = new URLSearchParams({ run: runId, thr: JSON.stringify(S.thr) }); if (cellKey) p.set("cell", cellKey); if (replayT != null) p.set("t", replayT.toFixed(1)); return p.toString(); }
let timer = null, busy = false;
async function poll() {
  clearTimeout(timer);
  if (!busy) {
    busy = true;
    try { ST = await getJSON("/api/state?" + qs()); render(); }
    catch (e) { $("#p-" + page).innerHTML = empty("No data", esc(e.message) + "<br>Start the monitor with <code>--run DIR</code>, <code>--log/--metrics/--obs</code> or <code>--follow GLOB</code>, or pick a run from <code>--runs-root</code>."); }
    busy = false;
  }
  const live = ST && ST.meta.live;
  timer = setTimeout(poll, replayT != null && playing ? 1000 : (live ? S.refresh * 1000 : 15000));
}
function render() {
  const m = ST.meta;
  $("#liveBadge").className = "badge " + (m.live ? "live" : "off");
  $("#liveBadge").innerHTML = m.live ? (ST.host.proc_alive ? "&#9679; live, receiver running" : "&#9679; live file, no receiver process") : (m.replay_t != null ? "&#9654; replay" : "&#9632; finished run");
  $("#labelBadge").textContent = m.label || "";
  const cs = $("#cellSel");
  const opts = (m.cells || []).map((k) => `<option value="${esc(k)}">${esc(ST.snap.cells[k] ? ST.snap.cells[k].label : k)}</option>`).join("");
  if (cs.dataset.opts !== opts) { cs.innerHTML = opts || `<option value="">no cell yet</option>`; cs.dataset.opts = opts; }
  cs.value = m.cell || "";
  $("#replay").classList.toggle("on", !m.live);
  if (!m.live && m.duration) { const sl = $("#rpSlider"); sl.max = Math.ceil(m.duration); if (replayT != null) sl.value = replayT; }
  $("#rpTime").textContent = replayT != null ? `t = ${ft(replayT)} of ${ft(m.duration)}` : `whole run (${ft(m.duration)})`;
  renderBanner();
  chartSeq = 0; tabSeq = 0;
  for (const k in CHARTS) delete CHARTS[k];
  for (const k in TABLES) delete TABLES[k];
  const f = RENDER[page]; if (f) { const y = scrollY; f($("#p-" + page)); scrollTo(0, y); }
}
function renderBanner() {
  const a = ST.alerts, now = new Date().toLocaleTimeString();
  const ids = new Set(a.map((x) => x.id));
  for (const x of a) if (!lastAlertIds.has(x.id)) alertLog.unshift({ at: now, sev: x.sev, text: x.text, kind: "raised" });
  for (const id of lastAlertIds) if (!ids.has(id)) alertLog.unshift({ at: now, sev: "ok", text: id + " cleared", kind: "cleared" });
  alertLog = alertLog.slice(0, 100); lastAlertIds = ids;
  const b = $("#banner");
  b.classList.toggle("on", a.length > 0);
  b.style.background = a.some((x) => x.sev === "bad") ? "var(--bad-bg)" : "var(--warn-bg)";
  b.innerHTML = a.map((x) => `<div class="al"><span class="ico-${x.sev}"></span> <b>${x.sev === "bad" ? "Problem" : "Check"}:</b> ${esc(x.text)}</div>`).join("");
}

/* ------------------------------------------------------------------ pages */

function grantsOf(key, dir) { const g = sn().grants[key || ST.meta.cell] || {}; return { src: g.src, d: g[dir] }; }
function series(key) { return sn().series.map((w) => [w.t, w[key]]); }

RENDER.home = (el) => {

RENDER.settings = (el) => {
  const c = ST.config, t = S.thr;
  const thrRows = [["p99_target_us", "Decode p99 target", "µs"], ["stale_pct", "Stale drops threshold", "%"], ["drop_full_pct", "Scan-queue full drops threshold", "%"], ["crc_warn_pct", "DL CRC-OK amber below", "%"], ["crc_bad_pct", "DL CRC-OK red below", "%"], ["gpu_budget_pct", "GPU budget exhausted at", "%"], ["silent_s", "Receiver silent after", "s"], ["ram_floor_gb", "Free RAM floor", "GB"], ["temp_c", "Temperature limit", "°C"]];
  let h = `<h2>Settings</h2><p class="lead">Dashboard preferences are stored in this browser only. The receiver configuration below is <b>read-only</b>: the dashboard never starts or stops the radio and never changes receiver flags.</p>
    <div class="grid2"><div class="card"><h3>Display</h3><div class="kv">
      <span class="k">Refresh every</span><span><select id="setRefresh">${[1, 2, 5, 10].map((v) => `<option ${v === S.refresh ? "selected" : ""} value="${v}">${v} s</option>`).join("")}</select></span>
      <span class="k">Latency unit</span><span><select id="setUnit"><option value="ms" ${S.latUnit === "ms" ? "selected" : ""}>ms</option><option value="us" ${S.latUnit === "us" ? "selected" : ""}>µs</option></select></span>
      <span class="k">Theme</span><span><select id="setTheme">${["auto", "light", "dark"].map((v) => `<option ${v === S.theme ? "selected" : ""}>${v}</option>`).join("")}</select></span>
      <span class="k">Tiles on Home</span><span>${Object.keys(DEF.tiles).map((k) => `<label class="small" style="margin-right:8px"><input type="checkbox" data-tile="${k}" ${S.tiles[k] !== false ? "checked" : ""}> ${k}</label>`).join("")}</span></div></div>
    <div class="card"><h3>Alert thresholds</h3><div class="kv">${thrRows.map(([k, lab, u]) => `<span class="k">${lab}</span><span><input type="number" step="any" data-thr="${k}" value="${t[k]}" style="width:110px"> ${u}</span>`).join("")}</div><div class="toolbar"><button id="setReset">Reset to defaults</button></div></div></div>`;
  h += `<div class="card"><h3>Receiver configuration of this run (read-only)</h3>`;
  if (!c.cmdline || !c.cmdline.length) h += empty("Command line not available", "Taken from the log's CMDLINE line, cmd.txt in the run directory, or /proc of a running receiver.");
  else {
    h += `<div class="kv">${Object.entries(c.key_args).map(([k, v]) => `<span class="k mono">${esc(k)}</span><span class="mono">${esc(v)}</span>`).join("")}</div><details style="margin-top:6px"><summary>Full command line</summary><pre class="log">${esc(c.cmdline.join(" "))}</pre></details>`;
  }
  h += `<div style="margin-top:8px"><b>Config file:</b> <span class="mono">${esc(c.cfg_path || "n/a")}</span>${c.cfg_text ? `<details><summary>Show file</summary><pre class="log">${esc(c.cfg_text)}</pre></details>` : c.cfg_path ? ` <span class="small">(not readable from here)</span>` : ""}</div></div>`;
  h += `<div class="card"><h3>ISAC_* environment, grouped by area</h3>`;
  if (!c.env_groups || !Object.keys(c.env_groups).length) h += empty("Environment not available", "Keep env.txt (or the single-line .env file) in the run directory; for a live receiver /proc/&lt;pid&gt;/environ is used when readable (root-owned receivers usually are not).");
  else {
    h += `<div class="small">Source: ${esc(c.env_source || "")}. Descriptions are extracted automatically from the code comments and PROJECT_MEMORY (gen_flags.py); "unknown" = no description found.</div>`;
    for (const [area, rows] of Object.entries(c.env_groups)) h += `<h3 style="margin-top:10px">${esc(area)}</h3>` + table([{ k: "name", t: "Flag", html: (r) => `<span class="mono">${esc(r.name)}</span>` }, { k: "value", t: "Value", html: (r) => `<span class="mono">${esc(r.value)}</span>` }, { k: "desc", t: "What it does", html: (r) => r.desc ? esc(r.desc) : `<span class="statebadge unknown">unknown${r.known ? "" : " (not read by this code tree)"}</span>` }], rows, { name: "env_" + area });
  }
  h += `</div>`;
  el.innerHTML = h;
  $("#setRefresh").onchange = (e) => { S.refresh = +e.target.value; save(); };
  $("#setUnit").onchange = (e) => { S.latUnit = e.target.value; save(); render(); };
  $("#setTheme").onchange = (e) => { S.theme = e.target.value; save(); applyTheme(); render(); };
  el.querySelectorAll("[data-tile]").forEach((x) => x.onchange = () => { S.tiles[x.dataset.tile] = x.checked; save(); });
  el.querySelectorAll("[data-thr]").forEach((x) => x.onchange = () => { const v = parseFloat(x.value); if (isFinite(v)) { S.thr[x.dataset.thr] = v; save(); poll(); } });
  $("#setReset").onclick = () => { S.thr = Object.assign({}, DEF.thr); save(); poll(); };
};

/* ------------------------------------------------------------------ navigation, replay, boot */
function go(p) {
  if (!PAGES.includes(p)) p = "home";
  page = p;
  document.querySelectorAll("nav a").forEach((a) => a.classList.toggle("on", a.dataset.p === p));
  document.querySelectorAll(".page").forEach((s) => s.classList.toggle("on", s.id === "p-" + p));
  if (location.hash !== "#" + p) history.replaceState(null, "", "#" + p);
  $("#nav").classList.remove("open");
  if (ST) render();
}
window.addEventListener("hashchange", () => go(location.hash.slice(1)));
$("#menuBtn").onclick = () => $("#nav").classList.toggle("open");
$("#themeBtn").onclick = () => { const dark = document.documentElement.getAttribute("data-theme") === "dark" || (S.theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches); S.theme = dark ? "light" : "dark"; save(); applyTheme(); if (ST) render(); };
$("#runSel").onchange = (e) => { runId = e.target.value; cellKey = ""; replayT = null; playing = false; LOG = null; CMP = null; poll(); };
$("#cellSel").onchange = (e) => { cellKey = e.target.value; poll(); };
$("#rpSlider").oninput = (e) => { replayT = +e.target.value; $("#rpTime").textContent = "t = " + ft(replayT); };
$("#rpSlider").onchange = () => poll();
$("#rpPlay").onclick = () => { playing = !playing; if (playing && replayT == null) replayT = 0; $("#rpPlay").innerHTML = playing ? "&#10073;&#10073; Pause" : "&#9654; Play"; poll(); };
$("#rpExit").onclick = () => { replayT = null; playing = false; $("#rpPlay").innerHTML = "&#9654; Play"; poll(); };
setInterval(() => { if (playing && replayT != null && ST) { replayT = Math.min((ST.meta.duration || 0), replayT + +$("#rpSpeed").value); if (replayT >= (ST.meta.duration || 0)) { playing = false; $("#rpPlay").innerHTML = "&#9654; Play"; } } }, 1000);
(async () => { await loadRuns(); go(location.hash.slice(1) || "home"); poll(); setInterval(loadRuns, 60000); })();
</script>
</body>
</html>
