// Offline synthetic test conf for tools/isac_replay (openair1/PHY/NR_UE_ISAC/tools/test_offline_chain.sh).
// Geometry keys (spatial_rx_positions, tx_pos_*, rvm_max_range_m) are generated by
//   tests/passive_rx/survey.py openair1/PHY/NR_UE_ISAC/tools/survey_synth.json --geometry <g.json> \
//     --apply tests/passive_rx/ota/sensing_synth.conf tests/passive_rx/ota/sensing_synth.conf
// Re-run it after changing survey_synth.json.
sensing = {
  enable  = 1;
  sources = "pdsch_dmrs_blind,pdsch_data,pusch_dmrs,pusch_data";
  capture = 1;
  report_path = "/tmp/isac_synth/reports.jsonl";
  num_ues = 1;
  // Application requirements (must be explicit): the synthetic target moves at 3.6 m/s.
  maximum_target_speed_mps     = 10.0;
  max_range_m                  = 600.0;
  false_object_intensity_per_s = 1.0;
  spatial_rx_positions = "0,0,2;40,0,2;0,40,2;40,40,6";
  tx_pos_x = 120.0;
  tx_pos_y = 80.0;
  tx_pos_z = 25.0;
  rvm_max_range_m = 600.0;
};
