// ==============================================================================================
// PASSIVE RECEIVER on bladeRF -- AUTO mode with Phase 3 DEDICATED CORESET recovery.
//
// WARNING: this needs a UE actually attached to the cell. Phase 3 bootstraps the dedicated
// CORESET from C-RNTI grants recovered by Phase 1. On an idle cell Phase 1 only ever sees
// SI-RNTI, so Phase 3 starts with bootstrap_rnti=0x0, hypothesises a 270-RB CORESET spanning the
// whole carrier, and self-deceives -- measured 90 s on this idle cell:
//
//   Phase 3 autodiscover -- CORESET footprint rb_offset=0 span_rb=270 bootstrap_rnti=0x0
//   Phase 3 autodiscover -- dci_length locked at 47 (bootstrap_rnti=0x0, occasions_fed=68)
//   CORESET VERIFIED by fresh dedicated DCI: offset=0 span=270 rnti=0x4810     <- false positive
//   blind PDCCH ladder: num_cces=45 ncand=42/64 accepts_per_al=[149 2614 677 306]
//   accepts=3746 pdsch_decode[crc_ok=0 (0.0%)]   4x RFSTALL, PBCH lock lost
//
// The 42-candidates-per-occasion scan over 270 RB also costs enough CPU to break PBCH lock, so
// the run does not merely find nothing -- it destroys the receiver. Use
// nrue.passive_rx.bladerf.fullauto.conf on an idle cell; come back to this one when there is
// live UE traffic to bootstrap from.
// ==============================================================================================
uicc0 = {
  imsi = "001060123456748";
  key = "5122250214c33e723a5dd523fc145fc0";
  opc= "981d464c7c52eb6e5036234984ad0bcf";
  pdu_sessions = ({ dnn = "internet"; nssai_sst = 1; nssai_sd = 0x000000; });
}

sensing = {
  enable = 0;

  pdcch_blind_monitor_autoconf = 1;      // Phase 1: common search space from MIB/SIB1
  pdcch_blind_monitor_autodiscover = 1;  // Phase 3: recover the DEDICATED CORESET by DM-RS correlation
  pdcch_blind_monitor_full_auto = 1;     // Technique D: discover payload interpretation too

  pdcch_blind_monitor_dci10   = "1";
  pdcch_blind_monitor_pdsch   = "1:1:0:1:4";
  pdcch_blind_monitor_rnti_range  = "1:65519";   // autoconf narrows this to SI-RNTI itself
  pdcch_blind_monitor_noise_gates = "0:2:500:0:3.0";
};
