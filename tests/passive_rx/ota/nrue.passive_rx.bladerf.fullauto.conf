// ==============================================================================================
// PASSIVE RECEIVER on bladeRF 2.0, 100 MHz (273 PRB) band 78 @ 3.45 GHz -- AUTO mode.
//
// No geometry hints and no payload hints: CORESET#0 / SearchSpace#0 / initial BWP / DCI 1_0 size
// are derived from MIB+SIB1 at runtime (Phase 1, autoconf), and the payload interpretation
// (TDA / DM-RS position / MCS table) is discovered and TB-CRC-scored (full_auto). Point it at a
// different cell and it configures itself.
//
// Measured 90 s on the live cell at --ue-rxgain 32, 1 RX antenna:
//   accepts=500 dci10[SI=500] pdsch_decode[try=498 crc_ok=498 (100.0%)]
// identical to the hand-pinned nrue.passive_rx.bladerf.coreset0.conf on the same cell.
//
// REQUIRED on the command line (see the branch commit message for why):
//   --ue-rx-only --passive-rx --time-sync-I 0.01 --ntn-initial-time-drift -4.21 --ue-rxgain 32
//
// Do NOT add pdcch_blind_monitor_tda/_dmrs here. Supplying the gNB's dedicated TDRA list on top
// of autoconf measured WORSE, not better (48-54 % against 68-85 % without): with sib1=1 the SIB1
// PDSCH must use the default TDRA table, since pdsch-ConfigCommon travels inside SIB1 itself.
// ==============================================================================================
uicc0 = {
  imsi = "001060123456748";
  key = "5122250214c33e723a5dd523fc145fc0";
  opc= "981d464c7c52eb6e5036234984ad0bcf";
  pdu_sessions = ({ dnn = "internet"; nssai_sst = 1; nssai_sd = 0x000000; });
}

sensing = {
  enable = 0;

  pdcch_blind_monitor_autoconf = 1;
  pdcch_blind_monitor_full_auto = 1;   // also discover payload interpretation (TDA/DM-RS/MCS table)

  pdcch_blind_monitor_dci10   = "1";
  pdcch_blind_monitor_pdsch   = "1:1:0:1:4";
  pdcch_blind_monitor_rnti_range  = "1:65519";   // autoconf narrows this to SI-RNTI itself
  pdcch_blind_monitor_noise_gates = "0:2:500:0:3.0";
};
