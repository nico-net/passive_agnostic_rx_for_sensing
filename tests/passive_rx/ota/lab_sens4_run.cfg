# lab_sens4_run.sh settings (KEY=VALUE, sourced). Lab cell on sens4 (OCUDU, n78, dl_arfcn 630000 = 3450 MHz, 273 PRB, SCS 30,
# PCI 2, 4T4R, TDD 7D/2U, PLMN 00106). The gNB config/log are validation ground truth only: nothing here feeds the receiver.
GNB_HOST=sens4
GNB_CMD="sudo taskset -c 2-11 /home/sens/ABS/ocudu/build/apps/gnb/gnb -c /home/sens/ABS/AgenticBS/logs/configs/gnb_ofh_ota_tdd30_100mhz_liteon.1e3123cc87ac.yml"
GNB_LOGDIR=/home/sens/NICOLA/gnbLogs           # stdout of the gNB is its log (the config's /tmp/gnb.log is not writable)
GNB_READY_RE="N2: Connection to AMF.*completed"
GNB_READY_S=180
TESTBED_LOCK=/home/sens/ABS/AgenticBS/logs/.testbed.lock   # must be idle: not held by a writer, last note "stop_all ..."
TMUX_PREFIX=s6lab                               # tmux sessions on sens4: s6lab_lock, s6lab_gnb, s6lab_iperf
# iperf3 servers on sens4 (one-shot, looped), bound to the core-side address; never port 5201 (used by another server)
IPERF_BIND=10.42.0.1
# phones: name:host:adb:serial:iperf3:port
PHONES="oppo:sens4:adb:ff1ecb98:iperf3:5204 samsung:sensnuc3:/usr/bin/adb:R5CX11CBYJP:/data/local/tmp/iperf3:5205"
PLMN=00106
UE_IP_RE="10\.45\."
ATTACH_S=60                                     # wait after an airplane-mode toggle
PHASE_S=30                                      # traffic phases alternate DL (-R) and UL, each PHASE_S seconds, both phones
PHASE_BW=""                                     # e.g. "-b 100M"; empty = iperf3 default (TCP, unlimited)
# receiver (sens6) through the launcher
RX_LAUNCHER=tests/passive_rx/sens6_ota/run_ota_s6.sh   # relative to the repository root
RX_ENVFILE=tests/passive_rx/sens6_ota/ota_lab273.s6.env
RX_START_DELAY_S=10                             # traffic first, then the receiver
DUR=300                                         # receiver seconds; traffic runs DUR + RX_START_DELAY_S + 30
OUTBASE=/home/sens/NICOLA/captures
