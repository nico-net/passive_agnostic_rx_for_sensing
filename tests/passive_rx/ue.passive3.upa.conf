# ==================================================================================================
# 2x2 UPA (square planar array) variant of ue.passive3.conf.
#
# GENERATED by transforming ue.passive3.conf: EVERYTHING else -- geometry (rx_pos/tx_pos), scene (objects),
# cell/CORESET/CSI-RS parameters, CFAR settings, output paths -- is byte-identical to the ULA conf.
# The ONLY difference is the three rx_array lines below, so a ULA-vs-UPA run is a controlled A/B.
#
# WHY a 2x2 square instead of the 4-element ULA:
#   - A linear array cannot distinguish a bearing from its MIRROR about the array axis (the phase
#     depends only on d.u), so isac_aoa.cc restricts a collinear array's scan to the half-plane it
#     faces (aoa_broadside_deg). Getting that broadside wrong is exactly what produced the mirrored
#     bearings on rx2 in the 3-receiver run (PHASE3_AOA_MULTISTATIC_HANDOVER.md).
#   - A square is non-collinear, so parse_rx_array()'s collinearity test (max perpendicular spread
#     vs lambda/8) fails and the estimator scans the FULL 360 deg. The mirror ambiguity is gone
#     structurally, not by configuration, and aoa_broadside_deg becomes unused (see below).
#
# THE TRADE-OFF, so results are read correctly: this square is only 0.045 m across per axis
# (0.5 lambda) where the 4-element ULA spanned 3 x 0.045 m (1.5 lambda). Angular resolution / the
# bearing CRB scale with APERTURE, so expect roughly 3x WORSE bearing precision than the ULA on a
# target the ULA was already pointing at correctly. The UPA buys unambiguous 360 deg coverage and
# robustness to a mis-set broadside, NOT accuracy. Compare the two on those terms.
#
# SPACING: 0.045 m, just under lambda/2 = 0.045154 m at 3319.68 MHz. Both isac_aoa.cc's parse_rx_array() and
# sensing_channel.c's sensing_channel_set_rx_array() flag ambiguity on the MINIMUM inter-element
# gap, which for this square is the SIDE (0.045 m), not the diagonal (0.045*sqrt(2)) -- a lambda/2
# square is therefore unambiguous, and the diagonal being 0.707 lambda is expected and fine.
#
# BORESIGHT is 0 here, deliberately. It is a rigid rotation of the element coordinates into ENU; a
# square has 90 deg rotational symmetry and the scan is full-circle, so no rotation carries any
# information -- pinning it at 0 means the elements sit exactly where this file says they do and
# removes a way for the [sensing_channel] and [sensing] copies to silently disagree.
# ==================================================================================================
# THIRD passive receiver, for the full-passive 3rx-no-AoA comparison case (vs the 2rx case in
# ue.passive.conf/ue.passive2.conf) -- see PHASE3_BLIND_PDCCH_LIVE_WIRING_HANDOVER.md. Otherwise an
# exact copy of ue.passive.conf/ue.passive2.conf; see ue.passive2.conf's header comment for the
# general reasoning (world-frame tx_pos/objects unchanged, only rx_pos/rx_id/output paths differ).
#
# rx_pos deliberately NOT collinear with rx1 (100,0)/rx2 (-100,0) -- both of those sit on the same
# line through the illuminator (0,0), which is degenerate for a real 3-receiver geometry test. rx3
# at (0,100) gives genuine 2D spread.

uicc0 = {
  imsi = "001060000000000";
  key  = "00000000000000000000000000000000";
  opc  = "00000000000000000000000000000000";
}

thread-pool = "-1,-1,-1,-1,-1,-1,-1,-1";

rfsimulator = (
  {
    serveraddr = "127.0.0.1";
    options    = ("chanmod");
  }
);

channelmod = {
  max_chan  = 10;
  modellist = "modellist_rfsimu_1";
  modellist_rfsimu_1 = (
    {
      model_name     = "rfsimu_channel_enB0";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    },
    {
      model_name     = "rfsimu_channel_ue0";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    }
  );
};

sensing_channel = {
  enable            = 1;
  tx_pos_x          = 0.0;
  tx_pos_y          = 0.0;
  rx_pos_x          = 0.0;     # non-collinear with rx1/rx2 -- see header comment
  rx_pos_y          = 100.0;
  los_gain_db       = 0.0;
  los_delay_samples = 0.0;
  frac_delay_taps   = 8;
  channel_length    = 128;
  objects           = "1.0; 0,50,80; 120,50,92";

  # Same 2x2 UPA as rx1/rx2 -- NOT reoriented per receiver (a square scans the full 360 deg), unlike
  # the ULA this replaces. For reference, rx3's own target bearing is still ~-16deg: from (0,100)
  # the target (x=50, y=80->92) is vector (50,-20)->(50,-8), i.e. atan2(dy,dx) ~-21.8..-9.1deg.
  # MUST match the [sensing] block's own rx_array exactly.
  rx_array               = "0,0;0.045,0;0,0.045;0.045,0.045";
  rx_array_boresight_deg = 0.0;
};

sensing = {
  enable          = 1;
  sources         = "csi_rs,pdsch_dmrs_blind";
  csirs_monitor   = "2:0:106:1:13:0:0:2:0:160:0";

  pdcch_blind_monitor_coreset = "16:1:0:0:0:0";
  pdcch_blind_monitor_ss      = "1:0:1:0:2:0:0:0";
  pdcch_blind_monitor_bwp     = "0:106:0:45";

  cpi_slots       = 32;
  interpolate     = 1;
  capture         = 1;
  sync_correction = 1;
  selftest        = 0;

  cfar_guard         = 4;
  cfar_train         = 8;
  cfar_pfa           = 1e-4;
  zero_doppler_guard = 3;
  zero_range_guard   = 3;
  nms_range_bins     = 3;
  nms_doppler_bins   = 3;
  max_detections     = 16;

  out_path    = "/tmp/passive_rx/passive_sensing_rx3";
  report_path = "/tmp/passive_rx/passive_reports_rx3.jsonl";

  rx_id          = "rx_passive3";
  illuminator_id = "gnb-passiverx";
  rx_pos_x = 0.0;     # MUST match [sensing_channel] above
  rx_pos_y = 100.0;
  tx_pos_x = 0.0;
  tx_pos_y = 0.0;

  # aoa_enable is a SEPARATE gate from rx_array being non-empty. MUST match [sensing_channel]'s
  # rx_array/boresight exactly. Only takes effect with run_passive_rx.sh's RX3_NANT > 1.
  aoa_enable = 1;
  rx_array               = "0,0;0.045,0;0,0.045;0.045,0.045";
  rx_array_boresight_deg = 0.0;
  # aoa_broadside_deg: INTENTIONALLY OMITTED. isac_aoa.cc only reads it in the collinear
  # branch (aoa_estimator's ctor); a non-collinear array scans -180..180 unconditionally, so
  # setting it here would be silently inert. See this file's header.
};

log_config = {
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
};
