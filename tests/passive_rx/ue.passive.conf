# Passive receiver: runs with --passive-rx, so it does cell search / MIB / SIB1 and then parks in
# UE_RECEIVING_SIB forever. It NEVER transmits (no PRACH, Msg3, PUCCH, PUSCH or SRS) and never
# attaches to the core. See TOTAL_PASSIVE_UE_HANDOVER.md Phase 1 for how that is enforced.
#
# What it senses: the CSI-RS the gNB transmits FOR THE ACTIVE UE. That resource only exists while
# a UE is RRC-connected (the gNB schedules NZP-CSI-RS per connected UE, see
# gNB_scheduler_primitives.c's nr_csirs_scheduling), so this config is a direct demonstration of
# a receiver exploiting another UE's downlink reference signal with no RRC context of its own.
#
# The uicc block is inert -- kept only because the config parser expects one. No IMSI is
# provisioned in the core for it, and none is needed: it never registers.

uicc0 = {
  imsi = "001060000000000";
  key  = "00000000000000000000000000000000";
  opc  = "00000000000000000000000000000000";
}

thread-pool = "-1,-1,-1,-1,-1,-1,-1,-1";

# ---------------------------------------------------------------------------------------------
# rfsimulator client. Same server as the active UE -- the rfsim server writes the SAME downlink
# sample block to every connected client socket (simulator.cpp's rfsimulator_write_internal loops
# over all buf[i].conn_sock), so this receiver sees bit-for-bit the downlink the active UE gets,
# including PDSCH and CSI-RS addressed to the active UE.
#
# NOTE: this UE still WRITES (zeros) to the rfsim server. That is deliberate and required --
# RU_write()'s passive-mode early-return is skipped under rfsim because the UE's write drives the
# simulator's sample clock; stopping it would stall the server's read loop. On a real radio the
# write is suppressed and the TX chain is never keyed.
# ---------------------------------------------------------------------------------------------
rfsimulator = (
  {
    serveraddr = "127.0.0.1";
    options    = ("chanmod");   # REQUIRED for the [channelmod] / [sensing_channel] blocks below
  }
);

channelmod = {
  max_chan  = 10;
  modellist = "modellist_rfsimu_1";
  modellist_rfsimu_1 = (
    {
      model_name     = "rfsimu_channel_enB0";  # downlink (gNB -> UE): sensing channel attaches here
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    },
    {
      model_name     = "rfsimu_channel_ue0";   # uplink: unused, this UE never transmits anything
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    }
  );
};

# ---------------------------------------------------------------------------------------------
# Synthetic target, so the capture is verifiable against known ground truth rather than just
# "something came out". The log prints "SENSING_CHANNEL gt:" once per second. Set enable = 0 for a
# pure passthrough capture of the real link.
#
# TARGET SPEED IS CONSTRAINED BY THE REFERENCE SIGNAL, and this is the single most important thing
# to understand about this test. CSI-RS fires every 160 slots = 80 ms, so the slow-time PRF is
# 12.5 Hz and the unambiguous bistatic velocity is only
#     +/- lambda*PRF/4 = +/- (0.0903 m * 12.5 Hz)/4  ~  +/- 0.28 m/s   (reported vel_max ~0.56 m/s
#                                                                       over the full +/- axis)
# A faster target does not just measure badly -- it FOLDS to a wrong velocity bin. The trajectory
# below is deliberately slow (~0.17 m/s bistatic range rate) so it stays unambiguous.
#
# This is not a defect of the receiver; it is the "velocity resolution is set by the RS repetition
# periodicity" property from CLAUDE.md's reference-pipeline notes, and it is precisely the argument
# for TOTAL_PASSIVE_UE_HANDOVER.md's Phase 3 (blind PDCCH -> other UEs' PDSCH DM-RS, which fires
# per scheduled slot rather than every 80 ms).
# ---------------------------------------------------------------------------------------------
sensing_channel = {
  enable            = 1;
  tx_pos_x          = 0.0;      # illuminator (gNB)
  tx_pos_y          = 0.0;
  rx_pos_x          = 100.0;    # passive receiver -> direct path R_los = 100 m
  rx_pos_y          = 0.0;
  los_gain_db       = 0.0;
  los_delay_samples = 0.0;
  frac_delay_taps   = 8;
  channel_length    = 128;
  # Slow drift away from the baseline: (50,80) -> (50,92) over 120 s.
  # Bistatic differential range 88.7 m -> 109.4 m, i.e. range rate ~0.173 m/s (unambiguous).
  objects           = "1.0; 0,50,80; 120,50,92";

  # ---------------------------------------------------------------------------------------------
  # AoA (2026-07-28, PHASE3_BLIND_PDCCH_LIVE_WIRING_HANDOVER.md): 4-element lambda/2 ULA, only ever
  # active if the receiver process is ALSO started with --ue-nb-ant-rx 4 (see run_passive_rx.sh's
  # RX1_NANT). Carrier here is 3319.68 MHz (this harness's CELL_ARGS -C), lambda=c/f=0.0904m,
  # lambda/2=0.0452m -- element spacing below. rx_array_boresight_deg=32 rotates the array's own
  # local x-axis (the line the elements lie along) into ENU; the array's two broadside normals are
  # then 32+90=122 and 32-90=-58 -- 122 matches this scene's target bearing from rx1 (~121-122deg,
  # see the "azimuth=" field already logged in "SENSING_CHANNEL gt:" lines), so this picks the half
  # the target is actually on (see nr_isac.h/isac_aoa.cc's own "linear array cannot separate a
  # bearing from its mirror" note for why this matters -- get it wrong and every estimate is off by
  # a reflection, not just noisy).
  # MUST match the [sensing] block's own rx_array exactly, same spacing note as there.
  rx_array               = "0,0;0.045,0;0.090,0;0.135,0";
  rx_array_boresight_deg = 32.0;
};

# ---------------------------------------------------------------------------------------------
# NR_UE_ISAC sensing pipeline, fed from csirs_monitor (RRC-independent) -- the ONLY viable source
# in passive-rx mode, because once SIB1 is valid the MAC configures no PDCCH/PDSCH at all, so the
# pdsch_dmrs / pdsch_data taps never fire.
#
# csirs_monitor fields, in order:
#   row : start_rb : nr_rbs : freq_domain : symb_l0 : symb_l1 : cdm_type : freq_density
#       : scramb_id : period_slots : offset_slots
#
# The values below are NOT guessed. They are what THIS gNB config actually transmits, derived from
# openair2/LAYER2/NR_MAC_gNB/nr_radio_config.c's get_nzp_csi_rs_resource() for 1 DL antenna port
# and cross-checked against a live run:
#   row=2            1 port -> frequencyDomainAllocation row2
#   start_rb=0       freqBand.startingRB = 0
#   nr_rbs=106       clamped to BWPStart+BWPSize (nrofRBs would be 108)
#   freq_domain=1    row2 buf {0,16} -> ((16>>4)&0xf) | ((0<<4)&0xff0)
#   symb_l0=13       firstOFDMSymbolInTimeDomain = 13 (last symbol of the slot)
#   symb_l1=0        firstOFDMSymbolInTimeDomain2 = NULL
#   cdm_type=0       noCDM
#   freq_density=2   density_PR_one
#   scramb_id=0      scramblingID = physCellId = 0  <-- WRONG VALUE HERE = garbage, not weak signal
#   period=160       measured: CSI-RS scheduled every 8 frames x 20 slots/frame at mu=1
#   offset=0         measured: always slot 0 of the frame, 624*20 mod 160 == 0
#
# RE-DERIVE THESE if you change physCellId, dl_carrierBandwidth, the TDD pattern, the number of
# gNB DL antenna ports, or do_CSIRS. Procedure: run the gNB with
# --log_config.nr_mac_log_level debug and grep "Scheduling CSI-RS in frame".
# ---------------------------------------------------------------------------------------------
sensing = {
  enable          = 1;
  sources         = "csi_rs,pdsch_dmrs_blind";
  csirs_monitor   = "2:0:106:1:13:0:0:2:0:160:0";

  # ---------------------------------------------------------------------------------------------
  # Blind PDCCH/DCI-1_1 monitor (TOTAL_PASSIVE_UE_HANDOVER.md Phase 3, live-wiring Stage 1): senses
  # the ACTIVE UE's own PDSCH DM-RS by blindly decoding its PDCCH grant -- no RRC context of our
  # own, no knowledge of the active UE's C-RNTI in advance (any CRC-recovered value in
  # pdcch_blind_monitor_rnti_range is accepted; see nr_pdcch_blind_monitor.c). Fires once per
  # scheduled DL slot rather than csirs_monitor's 160-slot/80ms period -- the whole point of this
  # source, per the file header note above.
  #
  # Values below are the deployment-known geometry for tests/passive_rx/gnb.sa.rfsim.conf's default
  # CORESET id=1 / SearchSpace id=5 (traced via configure_initial_dl_bwp() -> get_coreset_config() /
  # rrc_searchspace_config() in nr_radio_config.c -- see the plan's finding 2 for the full trace):
  #   coreset: num_freq_groups=16 (16 contiguous 6-PRB groups from group 0 -> PRBs 0-95 of the
  #            106-PRB BWP; the remaining 10 PRBs are uncovered by the gNB's own bitmap-construction
  #            loop, not a config choice here) duration=1 symbol, non-interleaved (reg_bundle_size/
  #            interleaver_size/shift_index all 0), pdcch_dmrs_scrambling_id=PCI=0 (this gNB never
  #            sets pdcch_DMRS_ScramblingID, so PDCCH descrambling is PCI-only for every UE).
  #   ss:      every slot (period=1 offset=0), duration=1, first_symbol=0. al2_cand=2 reflects this
  #            SS's OWN per-UE candidate count (informational only -- the blind tap does not know
  #            the real UE's RNTI hash in advance, so it scans all 8 non-overlapping AL2 CCE
  #            positions regardless of this value; see nr_pdcch_blind_monitor_rt.c).
  #   bwp:     0:106 (same active DL BWP as csirs_monitor above), dmrs_typeA_position=0 (=pos2 --
  #            matches this gNB's own dmrs_TypeA_Position=0 setting in gnb.sa.rfsim.conf).
  # RE-DERIVE if the gNB's CORESET/SearchSpace/BWP config changes (same caveat as csirs_monitor).
  #
  # dci_length_override=45 (2026-07-28, LIVE-VERIFIED, load-bearing): nr_pdcch_blind_dci_size()'s
  # formula computes 48 bits for bwp_size=106, but this deployment's REAL DCI-1_1 payload is 45 --
  # a one-shot diagnostic dump of the active UE's own MAC-driven rel15->dci_length_options[0]
  # (dci_nr.c's nr_pdcch_dci_indication(), temporarily instrumented) confirmed 45 directly against
  # ground truth. The 3-bit gap is some RRC-negotiated field the formula's hand-derived assumption
  # set gets wrong for this specific config (candidates: dl_DataToUL_ACK list count shorter than the
  # assumed 8 entries, pdsch_CGB_Transmission configured when assumed NULL -- not pinned down, and
  # doesn't need to be: the override is what matters). WITHOUT this override, dci_length was off by
  # 3 bits, polar-decoding at the wrong K, so nr_pdcch_blind_decode_and_extract()'s CRC-recovered
  # "RNTI" was effectively random noise on every candidate -- confirmed by an RNTI cross-check
  # against the active UE's real C-RNTI (0/11 matches, 11/11 distinct values, before this fix).
  # RE-VERIFY (same diagnostic-dump method) if the gNB's PUCCH/CBG/HARQ config changes.
  # ---------------------------------------------------------------------------------------------
  pdcch_blind_monitor_coreset = "16:1:0:0:0:0";
  pdcch_blind_monitor_ss      = "1:0:1:0:2:0:0:0";
  pdcch_blind_monitor_bwp     = "0:106:0:45";

  # CSI-RS lands every 160 slots = 80 ms, so a CPI of 32 rows is ~2.56 s of slow time.
  cpi_slots       = 32;
  interpolate     = 1;
  capture         = 1;
  sync_correction = 1;
  selftest        = 0;

  # ---------------------------------------------------------------------------------------------
  # DSP options deliberately left at their DEFAULTS. Six were tried against this scene; none give a
  # net win, so none are enabled -- do not re-add them expecting a fix without new evidence. Root
  # cause of the persistent ~760-825 m cluster is now UNDERSTOOD (2026-07-28), not just observed --
  # see "Known artifacts / root cause" in README.md before touching any of this again:
  #   interpolate=0 (raw comb-12, no gap-fill)
  #                            -> artifact UNCHANGED (43% of detections vs 45-55% at interpolate=1).
  #                               Rules out interpolation/gap-fill as the cause.
  #   sensing_channel.enable=0 (pure passthrough, no synthetic target/LOS injected at all)
  #                            -> artifact STILL PRESENT (38% of detections), now peaking at bins
  #                               102/105 (the two bins closest to the comb-12 cutoff at bin 106 =
  #                               833 m). Rules out the synthetic channel model as the source: this
  #                               is a real property of the actual CSI-RS air interface.
  #   dealias_taper_bins=24, then 60 (see [sensing]'s own dealias_taper_bins knob below)
  #                            -> did NOT shrink the artifact (stayed 45-49% of detections); the
  #                               PEAK BIN moved inward with each widening (96-98 -> 97-98) instead
  #                               of shrinking. This is diagnostic: it means the underlying content
  #                               is a WIDE lobe approaching the comb-12 boundary from below, not a
  #                               narrow sidelobe skirt right at the edge -- a bigger post-hoc range
  #                               notch just exposes the next-highest point of the same lobe rather
  #                               than removing it. Widening this taper is NOT the fix for this
  #                               artifact (kept available as a knob for cases where it IS the fix --
  #                               a real narrow edge leak -- see its own comment in defs_nr_UE_ISAC.h).
  #   clutter_removal="eca+" (default eca_doppler_max_mps=0.5, eca_delay_max_m=0/full-range)
  #                            -> DOES suppress the artifact: 45-55% -> ~17% of detections. But also
  #                               suppresses the TARGET (0/16 CPIs): the target's 0.171 m/s velocity
  #                               sits inside ECA's default +/-0.5 m/s clutter-Doppler removal band,
  #                               so ECA's projection removes both.
  #   clutter_removal="eca+" + eca_doppler_max_mps=0.1 (narrower than the target's 0.171 m/s, on the
  #   theory that a tighter clutter band would spare it)
  #                            -> WORSE on both counts: artifact rose to 49% (narrower removal band
  #                               apparently captures the boundary lobe's own effective Doppler
  #                               spread LESS completely) and target still 0/16. ECA's actual
  #                               delay/Doppler subspace coupling is not the simple separable model
  #                               assumed here -- needs reading eca_clutter.cc before trying again,
  #                               not another parameter guess.
  #   conj_image_reject alone  -> target detected in 0/8 CPIs.
  #   far_harmonic_reject (near=300 m, far=400 m)
  #                            -> did NOT remove the cluster it was aimed at; target detection
  #                               unchanged at 3/10 CPIs.
  # Plain defaults (this file, as shipped): target detected in 0-3 out of every 8-22 CPIs, run to
  # run. See README.md "Known artifacts" for the full writeup and what a real fix needs.
  # ---------------------------------------------------------------------------------------------

  cfar_guard         = 4;
  cfar_train         = 8;
  cfar_pfa           = 1e-4;
  zero_doppler_guard = 3;
  zero_range_guard   = 3;
  # dealias_taper_bins default (4) left as-is -- see the DSP-options block above for why widening
  # it (tried 24, 60) does not fix this specific scene's artifact. New knob, added 2026-07-28.
  nms_range_bins     = 3;
  nms_doppler_bins   = 3;
  max_detections     = 16;

  out_path    = "/tmp/passive_rx/passive_sensing";
  report_path = "/tmp/passive_rx/passive_reports.jsonl";

  rx_id          = "rx_passive";
  illuminator_id = "gnb-passiverx";
  rx_pos_x = 100.0;   # MUST match [sensing_channel] above
  rx_pos_y = 0.0;
  tx_pos_x = 0.0;
  tx_pos_y = 0.0;

  # aoa_enable is a SEPARATE gate from rx_array being non-empty -- nr_isac.cc's own aoa_enable
  # PARAMFLAG_BOOL defaults to 0/off regardless of whether rx_array is configured (found live
  # 2026-07-28: rx_array+aoa_broadside_deg alone produced zero azimuth on every detection, no AoA
  # log lines at all, until this was added).
  aoa_enable = 1;
  # MUST match [sensing_channel]'s rx_array/rx_array_boresight_deg above exactly -- see that block's
  # comment for the derivation. Only takes effect with --ue-nb-ant-rx 4 (run_passive_rx.sh's
  # RX1_NANT); with the default single antenna this is silently inert (nr_isac_aoa_antennas() still
  # returns 4, but nr_pdcch_blind_monitor_rt.c/csi_rx.c both clamp to the ACTUAL nb_antennas_rx, so
  # every submission just carries 1 antenna and no bearing is ever computed -- a one-shot warning
  # fires if this happens with rx_array configured, see nr_isac.cc).
  # Spacing rounded slightly DOWN from lambda/2 (0.04516m at this cell's 3319.68MHz, lambda=0.0903m)
  # -- rounding UP (0.0452, tried first) tripped sensing_channel.c's "AMBIGUOUS" check by ~0.00004m.
  # Cosmetic only (that check doesn't disable the array, just warns), fixed anyway to avoid the
  # confusing warning.
  rx_array               = "0,0;0.045,0;0.090,0;0.135,0";
  rx_array_boresight_deg = 32.0;
  aoa_broadside_deg      = 122.0;
};

log_config = {
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
};
