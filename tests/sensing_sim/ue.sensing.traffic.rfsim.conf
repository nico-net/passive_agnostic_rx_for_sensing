#
# Fictitious-gNB sensing loop — UE side, TRAFFIC-INJECTION variant.
# Same static-object scenario as ue.sensing.static.rfsim.conf, but requires real DL traffic so
# `pdsch_data` (genuine data-aided CFR reconstruction -- LDPC re-encode + rate-match + scramble +
# modulate of the CRC-verified decoded transport block, NOT DM-RS interpolation) has something to
# decode. Companion run_sim_traffic.sh launches both processes with --noS1 (each gets a local TUN:
# oaitun_enb1/10.0.1.1, oaitun_ue1/10.0.1.2) inside separate network namespaces (per
# doc/runmodem-nrue.md's explicit warning that noS1 does not work with both interfaces on one
# netns) and drives a `ping` across them so real DL PDSCH actually flows.
#
# See README.md's "Fixed: true data-aided PDSCH reconstruction" section for the full history:
# earlier iterations here diagnosed and fixed an LOS-leakage/CFAR-self-masking/comb-12-CSI-RS
# artifact chain, then a conjugate-image "mirror ghost", then found (once those were cleared) that
# `pdsch_data` was ITSELF only resampling the DM-RS-interpolated estimate (a "comb-106" per-PRB
# ripple) -- fixed by implementing real data-aided reconstruction, which also fixed the analogous
# comb-2 boundary artifact `pdsch_dmrs` reintroduces (hence sources="pdsch_data" alone below).

rfsimulator = (
  {
    serveraddr = "192.168.100.1";  # gNB's veth address in its own netns (see run_sim_traffic.sh)
    options    = ("chanmod");
  }
);

channelmod = {
  max_chan  = 10;
  modellist = "modellist_rfsimu_1";
  modellist_rfsimu_1 = (
    {
      model_name     = "rfsimu_channel_enB0";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    },
    {
      model_name     = "rfsimu_channel_ue0";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    }
  );
};

sensing_channel = {
  enable            = 1;
  tx_pos_x          = 0.0;
  tx_pos_y          = 0.0;
  rx_pos_x          = 100.0;
  rx_pos_y          = 0.0;
  los_gain_db       = 0.0;
  los_delay_samples = 0.0;
  frac_delay_taps   = 8;
  channel_length    = 128;

  # Same fixed point as the static baseline: (120,60)m -> dR=97.41 m, range_rate=0.
  # Reflectivity boosted 20x vs the static/moving baselines (refl=1.0 there, equal to LOS gain) --
  # diagnostic to separate "does a sufficiently strong target reach the range-Doppler map at its
  # true position at all" from "is a target as strong as the direct path (which is unrealistic --
  # real target returns are always far weaker) visible over the LOS's own residual leakage skirt".
  objects = "20.0; 0,120,60";
};

sensing = {
  enable          = 1;
  # csi_rs dropped: its comb-12 rows reintroduce a periodic mirror of the LOS skirt inside their
  # own valid window (see README.md "Known limitation" -- the recurring ~365m artifact traced to
  # this). pdsch_dmrs/pdsch_data are comb-1/comb-2 and don't have this periodicity issue, and with
  # real DL traffic flowing they're dense enough to stand alone.
  sources         = "pdsch_data"; # data-aided reconstruction; pdsch_dmrs/csi_rs both reintroduce
                                  # their own comb-N de-aliasing-boundary artifact -- see README.md
  cpi_slots       = 256;
  interpolate     = 1;
  capture         = 1;

  sync_correction = 1;
  selftest        = 0;

  cfar_guard         = 16;  # widened from 4: the target's own response spans ~9 range bins
                            # (windowing/smearing), which was contaminating CA-CFAR's local noise
                            # estimate around its own peak (self-masking) -- see README.md
  cfar_train         = 8;
  cfar_pfa           = 1e-4;
  zero_doppler_guard = 3;
  zero_range_guard   = 15;   # widened from 3: LOS skirt empirically spans ~13 bins (~51m) on both
                             # the near-zero-range side and its mirror near the top of the range
                             # axis (bin nof_range-1-zrg); see README.md "Known limitation" update
  nms_range_bins     = 3;
  nms_doppler_bins   = 3;
  max_detections     = 16;

  out_path    = "/tmp/sensing_sim_traffic/oaiue_sensing";
  report_path = "/tmp/sensing_sim_traffic/oaiue_reports.jsonl";

  rx_id          = "rx1";
  illuminator_id = "gnb1";
  rx_pos_x = 100.0;
  rx_pos_y = 0.0;
  tx_pos_x = 0.0;
  tx_pos_y = 0.0;
};

log_config = {
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
};
