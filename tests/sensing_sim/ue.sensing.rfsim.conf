#
# Fictitious-gNB sensing loop — UE side (rfsimulator client).
# Companion to gnb.sensing.rfsim.conf. See tests/sensing_sim/README.md and run_sim.sh.
#
# Carrier (band 78, 106 PRB, SCS 30 kHz, PCI 2, SSB @ 3615.48 MHz) is passed on the CLI by
# run_sim.sh; this file supplies only the channel model, the synthetic moving-target sensing
# channel, and the NR_UE_ISAC sensing pipeline.

# ---------------------------------------------------------------------------------------------
# rfsimulator: connect to the gNB (server) on loopback, with channel modelling enabled so the
# synthetic sensing channel can be attached to the downlink model (rfsimu_channel_enB0).
# ---------------------------------------------------------------------------------------------
# NOTE: must be a LIST (matches the --rfsimulator.[0].* CLI indexing and this repo's own working
# example configs), NOT a bare object -- a bare "rfsimulator = { ... };" silently fails to parse
# (found the hard way: options=(chanmod) never took effect, "options" list syntax is otherwise
# correct per radio/rfsimulator/simulator.cpp's STRLISTPARAM).
rfsimulator = (
  {
    serveraddr = "127.0.0.1";
    options    = ("chanmod");   # REQUIRED: without this the [channelmod] models (and our sensing
                                # channel attach in allocCirBuf) are never instantiated.
  }
);

# ---------------------------------------------------------------------------------------------
# Base channel model. The downlink model MUST be named "rfsimu_channel_enB0" (the name the UE
# client applies to gNB->UE samples). A plain low-noise AWGN base is fine: the synthetic sensing
# channel below OVERWRITES this model's taps every block (and grows its length as needed).
# ---------------------------------------------------------------------------------------------
channelmod = {
  max_chan  = 10;
  modellist = "modellist_rfsimu_1";
  modellist_rfsimu_1 = (
    {
      model_name     = "rfsimu_channel_enB0";  # downlink (gNB -> UE): the sensing channel attaches here
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;                     # low noise so the synthetic target is clearly visible
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    },
    {
      model_name     = "rfsimu_channel_ue0";    # uplink (UE -> gNB): left clean so --do-ra RACH works
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    }
  );
};

# ---------------------------------------------------------------------------------------------
# Synthetic moving-target sensing channel (openair1/SIMULATION/TOOLS/sensing_channel.{h,c}).
# Injects a static direct path (LOS) plus moving reflecting objects on their configured
# piecewise-linear trajectories, and synthesizes the resulting time-varying CIR into the DL model.
# Geometry is ENU metres in the SAME frame as the [sensing] rx_pos_*/tx_pos_* below.
#
#   objects: '|'-separated; each = "refl; t0,x0,y0; t1,x1,y1; ..."   (t seconds, x/y metres)
# ---------------------------------------------------------------------------------------------
sensing_channel = {
  enable            = 1;
  tx_pos_x          = 0.0;    # illuminator (gNB) ENU position
  tx_pos_y          = 0.0;
  rx_pos_x          = 100.0;  # receiver (UE) ENU position  -> direct-path R_los = 100 m
  rx_pos_y          = 0.0;
  los_gain_db       = 0.0;    # direct-path amplitude (unit); clutter removal suppresses it
  los_delay_samples = 0.0;    # LOS at the differential-delay origin (range bin 0)
  frac_delay_taps   = 8;      # Hann-windowed sinc fractional delay (0 = nearest-bin, for A/B)
  channel_length    = 128;    # tap count (<= 255, uint8_t cap)

  # One object crossing the scene: (50,80) -> (150,80) over 20 s (+5 m/s along x).
  # Bistatic differential range sweeps ~88.7 m (t=0) -> ~164.3 m (t=20); this is the ground truth
  # the detected range should track (also printed once/second as "SENSING_CHANNEL gt:" in the log).
  objects = "1.0; 0,50,80; 20,150,80";
};

# ---------------------------------------------------------------------------------------------
# NR_UE_ISAC passive sensing pipeline.
#
# CORRECTED FINDING (2026-07-22, superseding the original assumption below): --do-ra does NOT
# leave RRC unconnected. executables/nr-ue.c's init_NR_UE() unconditionally calls
# init_nsa_message() (openair2/RRC/NR_UE/main_ue.c) whenever phy_test||do_ra is set, which
# fopen()s ./reconfig.raw + ./rbconfig.raw (repo-root fixtures, AssertFatal if missing -- i.e.
# --do-ra CANNOT run without them) and UPER-decodes them as a genuine NR_RRCReconfiguration_t,
# fed through the SAME nr_rrc_ue_process_rrcReconfiguration() a real OTA message would use. This
# populates a real mac->sc_info.csi_MeasConfig, so nr_ue_csi_rs_procedures (the OWN CSI-RS path,
# gated on csirs_vars.active) DOES activate under --do-ra -- confirmed live: it captured a real
# NZP-CSI-RS occurrence spanning the full 106-PRB carrier (nof_re=106, comb=12, i.e. density="one"
# over the whole BWP), scrambling/geometry presumably matched to whatever gNB config
# reconfig.raw's fixture was built against (same family as this file's own do-ra rfsim template).
#
# CONSEQUENCE: running BOTH this own-path AND a separately-configured csirs_monitor resource under
# the same `sources="csi_rs"` tag merges two differently-scoped, independently-sourced CSI-RS
# occurrences (24 PRB hand-derived vs. 106 PRB canned) into one fused CFR grid -- an untested
# combination that corrupted CPI #1 in the first end-to-end run (top detection at range=365 m,
# nowhere near the injected ground truth of 88.7-164.3 m). Fix: csirs_monitor is intentionally
# left EMPTY here; the own-CSI-RS path (reconfig.raw-driven, matched to this repo's own do-ra
# fixture pairing) is the sole, homogeneous CSI-RS source. csirs_monitor remains available/tested
# (openair1/PHY/NR_UE_TRANSPORT/nr_csirs_monitor.c) for scenarios where RRC genuinely never
# activates -- see CLAUDE.md's "CSI-RS UE-agnostic monitor" note for the live-cell (non-simulated)
# use case that motivated it, which does NOT go through this reconfig.raw injection path.
# ---------------------------------------------------------------------------------------------
sensing = {
  enable          = 1;
  sources         = "csi_rs";
  cpi_slots       = 256;
  interpolate     = 1;
  capture         = 1;              # keep RVM rasters + rvm_blob for offline inspection

  # Sync corrections (ota_sync_passive_ue.md Phases 1-4). On by default; set 0 for an A/B baseline.
  sync_correction = 1;

  selftest        = 0;

  cfar_guard         = 4;
  cfar_train         = 8;
  cfar_pfa           = 1e-4;
  zero_doppler_guard = 3;
  zero_range_guard   = 3;
  nms_range_bins     = 3;
  nms_doppler_bins   = 3;
  max_detections     = 16;

  out_path    = "/tmp/sensing_sim/oaiue_sensing";
  report_path = "/tmp/sensing_sim/oaiue_reports.jsonl";

  rx_id          = "rx1";
  illuminator_id = "gnb1";
  # MUST match the [sensing_channel] geometry above so reported bistatic range/velocity are
  # consistent with the injected ground truth.
  rx_pos_x = 100.0;
  rx_pos_y = 0.0;
  tx_pos_x = 0.0;
  tx_pos_y = 0.0;
};

log_config = {
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
};
