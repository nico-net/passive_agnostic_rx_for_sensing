#
# Fictitious-gNB sensing loop — UE side, SINUSOIDAL trajectory variant.
# Same TX/RX geometry and DSP config as eca_walk.rfsim.conf (walking-STO tracker + Dolph-Chebyshev
# window + ECA+ clutter removal + Kalman tracker), swapping the circular trajectory for a sinusoid.
#
# Motivation (2026-07-24): the circular trajectory has CONSTANT-MAGNITUDE curvature -- good for
# proving a CA model beats CV at all, but it never tests a SIGN CHANGE in acceleration mid-track,
# and it revealed the cpi_period_slots integer-rounding bug (fixed same day in sensing_engine.cc)
# via a wrong but *constant* velocity bias, which a pure circle can't distinguish from a scale
# error. A sinusoid crosses zero range-rate every half-period with alternating curvature sign
# (concave/convex), which is a harder, more realistic maneuvering-target case (a genuine S-turn)
# and a cleaner test that the fixed dt is right, not just consistently scaled.
#
# Geometry (see docs/NR_UE_ISAC_algorithms.md / SYNC_NOISE_HANDOVER.md for the general setup):
#   TX (gNB, illuminator) at (0, 0), RX (this UE) at (100, 0), R_los = 100 m.
#   Target: x(t) = 30 + 4*t [m], y(t) = 140 + 15*sin(2*pi*t/8) [m], t in [0, 20] s.
#   i.e. a straight drift along x at 4 m/s with a +-15 m, 8 s-period sinusoidal sweep in y --
#   2.5 full periods over the 20 s trajectory, 5 range-rate zero-crossings (t ~ 2, 6, 10, 14, 18 s),
#   peak transverse speed ~11.8 m/s (dy/dt) on top of the constant 4 m/s drift.
#   Bistatic dR sweeps ~169-241 m, peak |range-rate| ~23.6 m/s (comparable magnitude to the
#   circular scene's 27 m/s peak) -- never crosses the LOS itself (dR stays >> the zero_range_guard
#   below) and never sits exactly on zero Doppler for more than one CPI at a time.
# Waypoints sampled every 0.5 s (piecewise-linear interpolation between them, see sensing_channel.c).

rfsimulator = (
  {
    serveraddr = "192.168.101.1";  # gNB's veth address (run_sim_traffic_iperf.sh's netns pair)
    options    = ("chanmod");
  }
);

channelmod = {
  max_chan  = 10;
  modellist = "modellist_rfsimu_1";
  modellist_rfsimu_1 = (
    {
      model_name     = "rfsimu_channel_enB0";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    },
    {
      model_name     = "rfsimu_channel_ue0";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    }
  );
};

sensing_channel = {
  enable            = 1;
  tx_pos_x          = 0.0;
  tx_pos_y          = 0.0;
  rx_pos_x          = 100.0;
  rx_pos_y          = 0.0;
  los_gain_db       = 0.0;
  los_delay_samples = 0.0;
  frac_delay_taps   = 8;
  channel_length    = 128;

  objects = "0.30; 0.0,30.0,140.0; 0.5,32.0,145.7; 1.0,34.0,150.6; 1.5,36.0,153.9; 2.0,38.0,155.0; 2.5,40.0,153.9; 3.0,42.0,150.6; 3.5,44.0,145.7; 4.0,46.0,140.0; 4.5,48.0,134.3; 5.0,50.0,129.4; 5.5,52.0,126.1; 6.0,54.0,125.0; 6.5,56.0,126.1; 7.0,58.0,129.4; 7.5,60.0,134.3; 8.0,62.0,140.0; 8.5,64.0,145.7; 9.0,66.0,150.6; 9.5,68.0,153.9; 10.0,70.0,155.0; 10.5,72.0,153.9; 11.0,74.0,150.6; 11.5,76.0,145.7; 12.0,78.0,140.0; 12.5,80.0,134.3; 13.0,82.0,129.4; 13.5,84.0,126.1; 14.0,86.0,125.0; 14.5,88.0,126.1; 15.0,90.0,129.4; 15.5,92.0,134.3; 16.0,94.0,140.0; 16.5,96.0,145.7; 17.0,98.0,150.6; 17.5,100.0,153.9; 18.0,102.0,155.0; 18.5,104.0,153.9; 19.0,106.0,150.6; 19.5,108.0,145.7; 20.0,110.0,140.0";
};

sensing = {
  enable          = 1;
  sources         = "pdsch_data";
  cpi_slots       = 512;   # overridden to 128 by the runner script, kept here as the documented default
  interpolate     = 1;
  capture         = 1;

  sync_correction = 1;
  selftest        = 0;

  cfar_guard         = 16;
  cfar_train         = 8;
  cfar_pfa           = 1e-4;
  zero_doppler_guard = 3;
  zero_range_guard   = 7;
  nms_range_bins     = 3;
  nms_doppler_bins   = 3;
  max_detections     = 16;

  clutter_removal     = "eca+";
  eca_delay_max_m     = 0.0;
  eca_doppler_max_mps = 0.30;

  # True LOS dR = 0 in this synthetic geometry (see eca_walk.rfsim.conf's note on why this must not
  # be left at the live-cell default of 98.0).
  nominal_los_range_m = 0.0;

  # track_model overridden to "cv"/"ca" by the runner script for the A/B comparison.
  track_enable     = 1;
  track_model      = "cv";
  track_r_var_m2   = 2.6;
  track_q_accel    = 0.0025;
  track_gate_sigma = 3.0;

  out_path    = "/tmp/sensing_sine/oaiue_sensing";
  report_path = "/tmp/sensing_sine/oaiue_reports.jsonl";

  rx_id          = "rx1";
  illuminator_id = "gnb1";
  rx_pos_x = 100.0;
  rx_pos_y = 0.0;
  tx_pos_x = 0.0;
  tx_pos_y = 0.0;
};

log_config = {
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
};
