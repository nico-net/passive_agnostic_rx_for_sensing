#
# Fictitious-gNB sensing loop — UE side, STATIC single-object baseline variant.
# Identical to ue.sensing.rfsim.conf except [sensing_channel] objects is a single fixed point
# (zero velocity) and outputs go to a separate dir, so this scenario can be run and inspected
# independently. See README.md "Scenarios" for why the static case is verified before the
# moving one: it isolates the tap-synthesis/detection math from CPI-duration-vs-target-dynamics
# effects (a fast-moving target migrating many range/Doppler cells within one long CPI smears
# the peak, which is an expected physical limitation of a slow-cadence reference signal, not a
# bug -- see README.md's "CPI duration vs. target dynamics" note).

rfsimulator = (
  {
    serveraddr = "127.0.0.1";
    options    = ("chanmod");
  }
);

channelmod = {
  max_chan  = 10;
  modellist = "modellist_rfsimu_1";
  modellist_rfsimu_1 = (
    {
      model_name     = "rfsimu_channel_enB0";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    },
    {
      model_name     = "rfsimu_channel_ue0";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    }
  );
};

sensing_channel = {
  enable            = 1;
  tx_pos_x          = 0.0;
  tx_pos_y          = 0.0;
  rx_pos_x          = 100.0;
  rx_pos_y          = 0.0;
  los_gain_db       = 0.0;
  los_delay_samples = 0.0;
  frac_delay_taps   = 8;
  channel_length    = 128;

  # Single fixed point: (120,60)m, held for the whole run (single waypoint => endpoint-hold).
  # R_tx-obj = sqrt(120^2+60^2) = 134.16 m, R_obj-rx = sqrt(20^2+60^2) = 63.25 m
  # bistatic_range = 197.42 m, R_los = 100 m => dR = 97.42 m, range_rate = 0.000 m/s.
  objects = "1.0; 0,120,60";
};

sensing = {
  enable          = 1;
  sources         = "csi_rs";
  cpi_slots       = 256;
  interpolate     = 0;
  capture         = 1;

  sync_correction = 1;
  selftest        = 0;

  cfar_guard         = 4;
  cfar_train         = 8;
  cfar_pfa           = 1e-4;
  zero_doppler_guard = 3;
  zero_range_guard   = 3;
  nms_range_bins     = 3;
  nms_doppler_bins   = 3;
  max_detections     = 16;

  out_path    = "/tmp/sensing_sim_static3/oaiue_sensing";
  report_path = "/tmp/sensing_sim_static3/oaiue_reports.jsonl";

  rx_id          = "rx1";
  illuminator_id = "gnb1";
  rx_pos_x = 100.0;
  rx_pos_y = 0.0;
  tx_pos_x = 0.0;
  tx_pos_y = 0.0;
};

log_config = {
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
};
