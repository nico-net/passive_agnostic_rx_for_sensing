# HIGH-RADIAL-ACCELERATION scene, generated by make_accel_scene.py (see that file for the
# full derivation). Purpose: try to produce ORPHANED Doppler harmonics for Phase B validation
# (GHOST_KINEMATIC_CONSISTENCY_HANDOVER.md 7.7 item 2). obj0 oscillates at 1 Hz giving ~65 m/s^2
# peak bistatic acceleration (~3 Doppler bins of smear per 64 ms CPI) at a modest ~0.8 m amplitude;
# obj1 is a constant-velocity CONTROL. harmonic_reject stays 0 (inherited) so the census sees the
# RAW harmonic population. Regenerate with: python3 make_accel_scene.py

