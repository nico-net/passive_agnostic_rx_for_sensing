#
# Fictitious-gNB sensing loop — UE side, TRAFFIC-INJECTION variant.
# Same static-object scenario as ue.sensing.static.rfsim.conf, but adds PDSCH DM-RS/data-aided
# CFR fusion (sources="csi_rs,pdsch_dmrs,pdsch_data") on top of the own-CSI-RS path. Only useful
# when real PDSCH is actually being scheduled, which under plain --do-ra never happens (no NAS/PDU
# session, no data). Companion run_sim_traffic.sh launches both processes with --noS1 (each gets a
# local TUN: oaitun_gnb1/10.0.1.1, oaitun_ue1/10.0.1.2) inside separate network namespaces (per
# doc/runmodem-nrue.md's explicit warning that noS1 does not work with both interfaces on one
# netns) and drives a `ping` across them so real DL PDSCH actually flows.
#
# Purpose: with only comb-12 CSI-RS as a source, every CPI showed a strong, near-zero-Doppler
# false detection near the comb's ~416 m unambiguous-range boundary (see README.md "Known
# limitation"). PDSCH DM-RS/data occupies far more subcarriers per slot; fusing it in should
# either dilute that artifact well below the true target return, or leave it unchanged -- telling
# us whether the artifact is a density/comb problem (fixed by fusion) or a deeper bug in
# range_doppler.cc's de-aliasing (not fixed by fusion, needs a real DSP fix).

rfsimulator = (
  {
    serveraddr = "192.168.100.1";  # gNB's veth address in its own netns (see run_sim_traffic.sh)
    options    = ("chanmod");
  }
);

channelmod = {
  max_chan  = 10;
  modellist = "modellist_rfsimu_1";
  modellist_rfsimu_1 = (
    {
      model_name     = "rfsimu_channel_enB0";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    },
    {
      model_name     = "rfsimu_channel_ue0";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    }
  );
};

sensing_channel = {
  enable            = 1;
  tx_pos_x          = 0.0;
  tx_pos_y          = 0.0;
  rx_pos_x          = 100.0;
  rx_pos_y          = 0.0;
  los_gain_db       = 0.0;
  los_delay_samples = 0.0;
  frac_delay_taps   = 8;
  channel_length    = 128;

  # MOVING object (unlike the static traffic variant): crosses (50,80) -> (150,80) over 40 s
  # (+2.5 m/s along x). Purpose: test the mirror-ghost hypothesis. A static target's post-clutter
  # residual is near-real-valued in frequency (constant phase across slow-time) -> conjugate-symmetric
  # range IFFT -> energy at both the true bin AND its N-k mirror. A moving target has genuine complex
  # slow-time phase progression, which should break that symmetry and suppress the mirror. Still 20x
  # reflectivity so the target is unmistakable over the LOS skirt.
  objects = "20.0; 0,50,80; 40,150,80";
};

sensing = {
  enable          = 1;
  # pdsch_data ONLY: now that pdsch_data is genuine data-aided reconstruction (comb-1, no
  # interpolation), pdsch_dmrs's comb-2 rows reintroduce the SAME class of artifact as comb-12
  # CSI-RS did -- a leakage cluster at their own de-aliasing taper boundary (nof_range/2, since
  # comb=2), confirmed at bin~636 with pdsch_dmrs included. Dropping it, same fix pattern as
  # dropping csi_rs earlier. See README.md.
  sources         = "pdsch_data";
  cpi_slots       = 64;
  interpolate     = 1;
  capture         = 1;

  sync_correction = 1;
  selftest        = 0;

  cfar_guard         = 16;  # widened from 4: the target's own response spans ~9 range bins
                            # (windowing/smearing), which was contaminating CA-CFAR's local noise
                            # estimate around its own peak (self-masking) -- see README.md
  cfar_train         = 8;
  cfar_pfa           = 1e-4;
  zero_doppler_guard = 3;
  zero_range_guard   = 15;   # widened from 3: LOS skirt empirically spans ~13 bins (~51m) on both
                             # the near-zero-range side and its mirror near the top of the range
                             # axis (bin nof_range-1-zrg); see README.md "Known limitation" update
  nms_range_bins     = 3;
  nms_doppler_bins   = 3;
  max_detections     = 16;

  # ECA+ clutter cancellation (ECA_CLUTTER_HANDOVER.md). Removes the near-zero-Doppler clutter band
  # in the complex CFR domain (root-cause fix for the conjugate mirror ghost).
  # TUNING NOTE (found while validating on this harness): eca_doppler_max_mps is an ABSOLUTE m/s
  # band, but its effect in *bins* is band/vel_res, and this CPI has a very fine vel_res (~0.04 m/s).
  # A 0.5-1.5 m/s band therefore removes 12-36 Doppler bins and cancels the quasi-static target too
  # (in the short rfsim window the object's bistatic range-rate is only ~0.1-0.6 m/s). Keep the band
  # comparable to zero_doppler_guard*vel_res (here ~3*0.04 = 0.12 m/s): 0.15 m/s removes ~4 bins,
  # suppressing the clutter/mirror while keeping the slow target. A/B: with 0.15 the target is the
  # top detection in 4/6 CPIs (~66-118 m vs GT ~89 m) vs 1/5 for plain mean subtraction.
  clutter_removal     = "eca+";
  eca_delay_max_m     = 0.0;   # full range: cancel clutter at all delays (target survives via Doppler)
  eca_doppler_max_mps = 0.15;

  out_path    = "/tmp/sensing_sim_traffic_moving_eca/oaiue_sensing";
  report_path = "/tmp/sensing_sim_traffic_moving_eca/oaiue_reports.jsonl";

  rx_id          = "rx1";
  illuminator_id = "gnb1";
  rx_pos_x = 100.0;
  rx_pos_y = 0.0;
  tx_pos_x = 0.0;
  tx_pos_y = 0.0;
};

log_config = {
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
};
