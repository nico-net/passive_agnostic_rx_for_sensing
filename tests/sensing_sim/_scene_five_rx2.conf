sensing = {
  enable          = 1;
  # CSI-RS fusion was tried (2026-07-24) and REVERTED: this cell's own-CSI-RS fires only ~1-3x per
  # 128-row CPI (too sparse to be a sampling backbone) AND mixing its different PRB scope with the
  # 273-PRB PDSCH corrupted the fused grid (far ghosts got worse). The starved-CPI ghosts are instead
  # addressed by cpi_quality_gate below. See PHASE2_MOT_MULTIUE_HANDOVER.md.
  sources         = "pdsch_data";
  # Matched-filter detector front-end (2026-07-24): replaces the FFT core (which assumes uniform,
  # complete, real-symmetric sampling and thus MANUFACTURES the harmonic/mirror/pedestal ghosts) with
  # an occupancy-matched hypothesis bank -- per-row occupied-only range transform + per-row occupancy
  # normalisation + coherent NUDFT slow-time. Artifact-suppression by construction rather than by
  # downstream rejection. See PHASE2_MOT_MULTIUE_HANDOVER.md / defs_nr_UE_ISAC.h.
  detector        = "fft";
  mf_per_row_norm = 1;
  # Sub-slot CFR sampling: 6 symbols/row + strict gates -- 1.8x unambiguous velocity at
  # zero precision cost (see MULTISTATIC_FAST_TARGET_NOTES.md section 5).
  subslot_symbols    = 6;
  subslot_min_re     = 1500;
  subslot_min_snr_db = 12.0;
  cpi_slots       = 512;   # overridden to 128 by the runner script, kept as the documented default
  interpolate     = 1;
  capture         = 1;

  # Disabled for a test (2026-07-24): prior (pre-this-session) validation found sync_correction=ON
  # net-negative on this same harness type (61-69% target detection vs 100% OFF, p<=0.002,
  # ota-sync-task-progress memory) and the flagged WALK_HALFWIN_BINS recalibration was never done.
  # It had been left ON, untested, through this whole session's MOT work.
  sync_correction = 0;
  selftest        = 0;

  cfar_guard         = 16;
  cfar_train         = 8;
  # cfar_pfa = 0 => AUTO-derive the per-cell Pfa from cfar_target_fa_per_cpi and the grid size
  # (see defs_nr_UE_ISAC.h). The old fixed cfar_pfa=1e-4 predicted ~42 statistical false alarms/CPI
  # on this grid (3276 range x 128 Doppler bins) -- live-confirmed 2026-07-24 as the actual source of
  # multi_target_tracker's track churn, not a clutter/mirror bug (see PHASE2_MOT_MULTIUE_HANDOVER.md).
  cfar_pfa               = 0;
  cfar_target_fa_per_cpi = 16;
  # Closed-loop adaptation (2026-07-24): 1.0 was tuned for an EARLIER problem (16 det/CPI, mostly
  # noise) and never revisited -- live-measured to throttle the WHOLE stream to ~1 event/CPI (77
  # detections / 76 CPIs), making real-target-vs-noise close to a coin flip each CPI. Adapts from the
  # measured raw detection count instead of staying pinned to a stale constant.
  # Re-enabled (2026-07-25): re-tested in isolation on the minimal 100%-coverage baseline (corrected
  # geometry) -- holds 100%/100% coverage, precision 31%/34% (same as baseline within noise). No cost,
  # and keeps the pfa self-tuning instead of a hand-picked constant. See PHASE2_MOT_MULTIUE_HANDOVER.md.
  cfar_fa_adapt_enable    = 0;
  cfar_fa_min              = 0.5;
  cfar_fa_max              = 20.0;
  cfar_fa_adapt_rate       = 1.15;
  # target_max_det raised 8->60 (2026-07-24): the tight band pinned the loop at its FLOOR the entire
  # run (raw_det measured 7-52, NEVER below 8) -- most of that isn't statistical noise the pfa knob
  # can suppress, it's structured signal (sidelobes/ghosts/harmonics). 60 sits above the observed
  # max, so the loop stops wastefully over-tightening and leaves real-vs-structured discrimination to
  # the downstream filters (harmonic_reject, track_harmonic_reject) that already do that job.
  cfar_fa_target_min_det   = 2;
  cfar_fa_target_max_det   = 60;
  # Per-Doppler-column CFAR: also judge each cell against the noise of its own velocity lane, which
  # rejects the range-wide pedestal a strong target smears across its own Doppler column (the dominant
  # MOT-false-track source at the target FUNDAMENTAL velocity, RVM-confirmed 2026-07-24 -- see
  # PHASE2_MOT_MULTIUE_HANDOVER.md). Complementary to range_whiten (which handles the harmonic ridges).
  cfar_per_column        = 1;
  # Per-RANGE-row CFAR (2026-07-25): the complement of cfar_per_column. RVM-confirmed that the
  # dominant residual ghosts are a horizontal slow-time RIDGE across a strong target\'s own range
  # row; training along Doppler makes that ridge its own noise floor. Same-binary A/B on the fast
  # scene: track precision 25%->54%, false detections -58%, track coverage 68%->99%.
  cfar_per_row           = 1;
  subbin_interp          = 1;
  # Restored to 3 (from the 1 tried earlier): targets now move fast enough (10/8 m/s -> bistatic rate
  # >=3 m/s) to clear guard=3's ~2.27 m/s notch, and guard=1 reopened a LOS/clutter leakage regression
  # (far-range ghosts returned) -- see PHASE2_MOT_MULTIUE_HANDOVER.md.
  zero_doppler_guard = 3;
  zero_range_guard   = 7;
  nms_range_bins     = 3;
  nms_doppler_bins   = 3;
  max_detections     = 32;

  range_window            = "chebyshev";
  range_window_sidelobe_db = 60.0;
  # Soft spectral whitening: caps subcarriers hotter than the median slow-time RMS, collapsing the
  # flat range pedestal that the irregular pdsch_data occupancy smears a strong target into (the
  # dominant MOT-false-track source, RVM-confirmed 2026-07-24 -- see PHASE2_MOT_MULTIUE_HANDOVER.md).
  range_whiten            = 1;

  # doppler_nudft evaluated (2026-07-24) but left OFF: it removes only the TIMING-irregularity
  # harmonic family, not the amplitude-gating (on/off PDSCH occupancy) one, and was net-neutral to
  # slightly worse on end-to-end churn here. Kept as an opt-in knob. See PHASE2_MOT_MULTIUE_HANDOVER.md.
  doppler_nudft           = 0;

  # Low-rank matrix completion of the CFR grid BEFORE range/Doppler: fills the per-slot subcarrier
  # gaps (varying PRB allocation) with a rank~=#scatterers model, giving every slot a consistent full
  # aperture. This attacks the AMPLITUDE-GATING harmonic mechanism at the source -- the one NUDFT
  # can't reach (see PHASE2_MOT_MULTIUE_HANDOVER.md). Supersedes the per-row interpolate gap-fill.
  slow_time_complete      = 1;
  mc_rank                 = 0;   # 0 = auto-derive from the previous CPI's confirmed track count
  mc_rank_max             = 8;
  mc_iters                = 15;
  mc_power_iters          = 1;

  # L1/FISTA sparse Doppler verification: re-solves only the CFAR-flagged range bins via sparse
  # recovery over the actual irregular sample times, dropping detections that needed to borrow
  # energy from a neighbouring bin in the dense transform (Doppler harmonics). Offline-validated
  # >80 dB peak-to-harmonic ratio vs ~5.5 dB for the dense transform on the same gappy data. Bypasses
  # slow-time resampling (needs the real row times), same as doppler_nudft.
  # lambda_scale=1.0 (fixed) over-suppressed real targets live 2026-07-24 (0-2 det/CPI, long zero
  # stretches) -- now just the SEED for a closed-loop adaptation in range_doppler.cc (see
  # defs_nr_UE_ISAC.h), which relaxes/tightens per CPI based on the measured surviving-detection count.
  doppler_sparse             = 0;
  doppler_sparse_iters       = 40;
  doppler_sparse_lambda_scale = 1.0;
  doppler_sparse_lambda_min  = 0.05;
  doppler_sparse_lambda_max  = 1.5;
  doppler_sparse_adapt_rate  = 0.85;
  doppler_sparse_target_min_det = 1;
  doppler_sparse_target_max_det = 6;
  doppler_sparse_peak_ratio  = 0.05;   # lenient: does THIS detection's own bin survive sparse recovery
  doppler_sparse_harmonic_ratio = 0.25; # strict: reject as orphaned harmonic only if a sub-bin is >=-6dB

  # Doppler-harmonic rejection: irregular slot sampling turns a moving target's slow-time tone into a
  # harmonic-rich signal, leaving strong ghosts at 2x/3x its velocity at the SAME range. Reject them
  # (a real target at exactly integer-multiple velocity + same range is absurd). 2026-07-24, see
  # PHASE2_MOT_MULTIUE_HANDOVER.md.
  harmonic_reject         = 1;
  harmonic_max_k          = 4;
  harmonic_tol            = 0.15;

  # Far-range harmonic rejection: reverted to 0 (2026-07-24). Diagnostics showed the residual far
  # ghosts live in SPARSE CPIs (high T_slot) where the real near target isn't detected at all, so this
  # filter has no near reference to compare against and can't fire -- it's the wrong layer. The root
  # cause (uninformative sparse CPIs) is instead being addressed by fusing the traffic-independent,
  # PERIODIC CSI-RS as a sampling backbone (sensing.sources below). See PHASE2_MOT_MULTIUE_HANDOVER.md.
  # Re-enabled (2026-07-24): was reverted only because it looked ineffective during the CSI-RS-fusion
  # detour, but that run was confounded by CSI-RS corruption. Now on clean pdsch_data + cpi_quality_gate,
  # detections.csv shows 8/22 far-ghost CPIs DO have a co-located near-range reference (e.g. CPI 57:
  # near=+8.27 m/s, far=-15.79 m/s, ratio -1.91 ~= -2, within harmonic_tol) -- exactly what this catches.
  # Re-validated (2026-07-25) in the incremental "add mechanisms back one at a time" pass on the
  # minimal 100%-coverage FFT baseline: KEPT -- holds 100%/100% coverage, precision improves slightly
  # (30%/37% vs the 29%/35% baseline). See PHASE2_MOT_MULTIUE_HANDOVER.md.
  far_harmonic_reject     = 1;
  far_harmonic_far_m      = 500.0;
  far_harmonic_near_m     = 250.0;

  # CPI-quality gate: drop all detections from a "starved" CPI whose T_slot spikes well above the
  # running EMA -- these are the sparse-scheduling CPIs where only amplitude-gating ghosts survive
  # (diagnostics-confirmed 2026-07-24, PHASE2_MOT_MULTIUE_HANDOVER.md). Tracker coasts through them.
  cpi_quality_gate        = 0;
  cpi_quality_max_ratio   = 1.5;
  cpi_quality_ema_alpha   = 0.2;

  clutter_removal     = "eca+";
  eca_delay_max_m     = 0.0;
  eca_doppler_max_mps = 0.30;

  nominal_los_range_m = 0.0;   # true LOS dR = 0 in this synthetic geometry

  # Multi-object tracking. CV model for two constant-velocity targets. track_confirm_m = 0 => AUTO
  # -derive the M-of-N confirmation threshold from the MEASURED per-CPI false-alarm density instead
  # of a hand-picked constant (see multi_target_tracker.cc's solve_confirm_m): a fixed 3-of-5 was
  # live-tested on this exact scene 2026-07-24 and let a range=5146 m ghost (and several extra ids)
  # confirm as tracks once CFAR was running ~14-16 raw detections/CPI for only 2 real targets.
  track_enable              = 1;
  track_model               = "cv";
  track_r_var_m2            = 2.6;
  track_q_accel             = 0.0025;
  track_gate_sigma          = 3.0;
  track_max_tracks          = 24;
  track_confirm_m           = 0;      # 0 = auto (see comment above)
  track_confirm_n           = 5;
  track_confirm_target_pfa  = 1e-3;
  track_assoc_gate_sigma    = 5.0;
  # Track-level harmonic rejection: drops a confirmed track at integer-multiple velocity of a
  # same-range track -- catches the leaked/coasting Doppler harmonics the per-CPI detection filter
  # misses (see PHASE2_MOT_MULTIUE_HANDOVER.md).
  track_harmonic_reject     = 1;
  track_harmonic_range_m    = 10.0;

  out_path    = "/tmp/sensing_mot2/oaiue_sensing";
  report_path = "/tmp/sensing_mot2/oaiue_reports.jsonl";

  rx_id          = "rx2";
  rx_array          = "0.000000,0.000000;0.039972,0.000000;0.079945,0.000000;0.000000,0.039972";
  rx_array_boresight_deg = 0.0;
  aoa_broadside_deg = -113.4;
  aoa_enable        = 1;
  illuminator_id = "gnb1";
  rx_pos_x          = 0.0;
  rx_pos_y          = 200.0;
  tx_pos_x = 0.0;
  tx_pos_y = 0.0;
};

log_config = {
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
};
