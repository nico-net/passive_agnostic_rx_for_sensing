.0,364.0,0.8; 14.5,378.1,5.1; 15.0,392.6,9.4; 15.5,407.3,13.2; 16.0,422.0,16.2; 16.5,436.6,18.4; 17.0,451.4,20.1; 17.5,466.6,21.9; 18.0,482.6,24.5; 18.5,499.6,28.4; 19.0,517.9,34.2; 19.5,537.5,41.7; 20.0,558.2,50.7 | 0.3; 0.0,161.4,42.5; 0.5,172.1,39.4; 1.0,183.0,37.7; 1.5,193.7,37.0; 2.0,204.3,36.7; 2.5,214.6,35.9; 3.0,224.2,33.8; 3.5,233.2,30.0; 4.0,241.4,24.1; 4.5,248.9,16.6; 5.0,255.8,8.1; 5.5,262.3,-0.7; 6.0,268.5,-9.0; 6.5,274.7,-16.2; 7.0,280.6,-22.2; 7.5,286.4,-27.4; 8.0,291.8,-32.3; 8.5,296.6,-37.9; 9.0,300.7,-44.8; 9.5,303.9,-53.8; 10.0,306.1,-64.9; 10.5,307.4,-77.8; 11.0,308.0,-92.0; 11.5,308.0,-106.5; 12.0,307.5,-120.7; 12.5,306.7,-133.9; 13.0,305.6,-146.2; 13.5,304.0,-157.7; 14.0,301.9,-169.2; 14.5,299.1,-181.4; 15.0,295.2,-195.3; 15.5,290.3,-211.3; 16.0,284.3,-229.6; 16.5,277.2,-249.9; 17.0,269.1,-271.5; 17.5,260.2,-293.7; 18.0,250.7,-315.7; 18.5,240.7,-337.0; 19.0,230.1,-357.4; 19.5,219.0,-377.3; 20.0,207.1,-397.2";
